{q:"What two parts make up a resist?",a:`The resist is an "intelligent polymer" with two parts:<ul><li><b>Matrix</b>: <b>insensitive</b> to the radiation. It fulfils the mechanical requirements (film forming, etch resistance).</li><li><b>Active component</b>: <b>sensitive</b> to the radiation. It speeds up or slows down how fast the resist dissolves in the developer, and so defines the pattern.</li></ul>`},
{x:1,q:"Positive vs negative resist?",a:`<ul><li><b>Positive resist</b>: exposure makes it <b>more soluble</b> (the radiation breaks polymer chains, "chain scission"). The developer removes the <b>exposed</b> areas, so the pattern is the <b>same as the mask</b>. Example: PMMA.</li><li><b>Negative resist</b>: exposure makes it <b>less soluble</b> (cross-linking, hardening). The developer removes the <b>unexposed</b> areas, so the pattern is the <b>inverse of the mask</b>.</li></ul>`},
{q:"List the photolithography process steps.",a:`<ol><li><b>Surface cleaning</b> of the wafer + adhesion promoter</li><li><b>Spin-coat</b> the photoresist</li><li><b>Soft bake</b> (≈ 90–100 °C, 30 s) to remove solvent</li><li><b>Exposure</b> through a mask (contact, proximity or projection; stepper or scanner)</li><li>(Post-exposure bake)</li><li><b>Develop</b>: selectively remove resist</li><li><b>Hard bake</b>: makes the remaining resist more resistant to etchants</li><li><b>Etch or deposit</b>, then <b>strip</b> the resist</li></ol>Check the result with SEM or TEM.`},
{q:"Contact vs proximity vs projection printing: pros and cons.",a:`<ul><li><b>Contact</b> (mask touches the resist): simple, low cost, good resolution (not limited by diffraction). But the mask degrades and contamination causes defects.</li><li><b>Proximity</b> (small gap): less mask damage and contamination, but <b>poorer resolution</b> because of light diffraction in the gap.</li><li><b>Projection</b> (a lens system images the mask, often reduced): <b>highest resolution</b>, the lenses reduce diffraction error, and there's no risk of mask damage. But only small areas can be patterned at a time (step-and-repeat), and out-of-focus errors can occur.</li></ul><p class="why">State of the art: maskless aligners.</p>`},
{q:"What limits resolution in projection lithography, and how has industry improved it?",a:`Rayleigh criterion:<br><b>R = k₁ λ / NA</b>, depth of focus <b>DOF = k₂ λ / NA²</b><br>(λ = wavelength, NA = numerical aperture, k₁, k₂ = process constants)<p class="why">Better resolution (shorter λ, larger NA) costs depth of focus. Industry has moved to shorter wavelengths: Hg lamp g-line 436 nm and i-line 365 nm, then excimer lasers KrF 248 nm and ArF 193 nm, then EUV at 13.5 nm. Phase-shift masks and immersion lithography (liquid between lens and wafer to increase NA) improve it further.</p>`},
{q:"X-ray lithography: wavelength, mask design and how the resist is exposed.",a:`<ul><li>λ ≈ <b>0.01–10 nm</b>, so far fewer diffraction problems than UV. First used with proximity printing for high-resolution patterns.</li><li><b>Mask</b>: the transparent part is a thin membrane (&lt; 2 µm) of a <b>low-atomic-number</b> material (SiC). The pattern is a <b>high-atomic-number</b> absorber (Au, W, Ta compounds) on the membrane. X-rays pass through low-Z material but are absorbed or scattered by high-Z material.</li><li><b>Exposure</b>: X-rays absorbed in the resist produce <b>photoelectrons</b>, and these electrons drive the chemical reaction in the resist.</li></ul>`},
{x:1,q:"Electron beam lithography: principle, pros, cons and use.",a:`A focused electron beam <b>scans</b> a substrate covered with an electron-sensitive resist and <b>writes</b> the pattern directly, controlled by a computer.<ul><li>+ <b>Highest resolution</b> of the lithography methods covered (the electron wavelength is far below 1 nm)</li><li>+ <b>No mask needed</b>: very flexible, the pattern is controlled from the computer</li><li>− <b>Slow</b>: a sequential process that writes the pattern step by step</li></ul>Used to make <b>masks</b> for optical lithography, and for R&amp;D. Common resist: <b>PMMA</b> (positive).<p class="why">Resolution is limited not by diffraction but by electron scattering in the resist (forward) and from the substrate (backscatter). This "proximity effect" gives an extra dose to neighbouring features.</p>`},
{x:1,q:"Which radiation gives (a) the best lithographic resolution and (b) the fastest and cheapest patterning of large areas?",a:`<ul><li>(a) <b>Electrons</b> (EBL): very short wavelength, a focused beam, nm resolution</li><li>(b) <b>Photons</b> (photolithography through a mask): the whole area is exposed at once (parallel), so it is fast and cheap per area</li></ul>`},
{q:"What is lift-off?",a:`A way to pattern a material (often a metal) that is hard to etch:<ol><li>Spin-coat resist and pattern it (e.g. EBL), opening holes where the material should be.</li><li>Deposit the metal over everything (on the resist and in the openings on the substrate).</li><li>Dissolve the resist. The metal on top of the resist lifts off with it, leaving metal only in the exposed openings.</li></ol>Examples: periodic arrays of dots, holes, squares.`},
{q:"Focused ion beam: ion source and three operating modes. Drawbacks?",a:`<b>Liquid metal ion source (LMIS)</b>: a tungsten tip wetted by a liquid metal, usually <b>Ga</b> (melting point ≈ 30 °C; or alloys like AuSi). A high voltage to an extraction electrode gives a field of about 15 V/nm at the tip apex. The liquid deforms into a <b>Taylor cone</b> that emits ions (compare electrospinning).<ol><li><b>Imaging</b>: scan the beam and collect secondary electrons</li><li><b>Milling</b>: a high-current beam sputters material away to make patterns and structures</li><li><b>Deposition</b>: works like CVD. A precursor gas adsorbs on the surface, the ion beam decomposes it locally, by-products are pumped away, and a thin film is deposited.</li></ol>Also used to cut thin TEM lamellae, often in a combined FIB/SEM dual-beam instrument.<p class="why">Drawbacks: heavy ions cause damage (amorphization), Ga is implanted in the surface, and milling is sequential and slow. Advantage: it removes and deposits material directly, without resist.</p>`},
{x:1,q:"What is soft lithography? Name the three main types.",a:`A collective term for <b>non-photolithographic</b> micro- and nanofabrication techniques that use an <b>elastomer</b> (a mechanically soft material, typically <b>PDMS</b>, polydimethylsiloxane) as a stamp or mould, or an AFM tip. Well suited to polymers, gels and organic monolayers.<ol><li><b>Microcontact printing (µCP)</b></li><li><b>Nanoimprint lithography (NIL)</b></li><li><b>Dip-pen nanolithography (DPN)</b></li></ol>`},
{x:1,q:"Describe microcontact printing.",a:`<ol><li><b>Make a master</b> (e.g. by photolithography in Si or silica).</li><li><b>Cast PDMS</b> monomer on the master and cure (polymerize) it, then peel it off, giving an elastomeric <b>stamp</b> with the relief pattern.</li><li><b>"Ink" the stamp</b> with SAM-forming molecules, e.g. an alkanethiol (or biomolecules such as antibodies).</li><li><b>Press</b> the stamp onto the substrate (e.g. Au). Molecules transfer only where the stamp touches and chemisorb (Au–S bonds), forming a patterned SAM.</li></ol>The SAM pattern then serves as an <b>etch mask</b> or as a template for selective deposition.<p class="why">Variants: a flat stamp on a flat substrate, a rolling stamp, or a flat stamp on a curved substrate.</p>`},
{x:1,q:"Describe nanoimprint lithography.",a:`Patterns are made by <b>mechanical deformation</b> of an imprint resist, then further processing, like a waffle iron.<ol><li><b>Spin-coat</b> a thermoplastic polymer (PMMA or polycarbonate) on the substrate.</li><li><b>Press the mould</b> into the polymer while heating <b>above its glass transition temperature T<sub>g</sub></b>, so it flows and fills the mould.</li><li><b>Cool</b> below T<sub>g</sub> and remove the mould.</li><li>A thin <b>residual layer</b> always remains in the recesses. Remove it by <b>anisotropic etching</b>, then transfer the pattern (dry etching, lift-off) or use the polymer directly.</li></ol><p class="why">Advantages: cheap, high throughput, high resolution. Example: VO₂ nanopillars and nanowires (imprint at 130 °C and 300 psi for 5 min, VO₂ dispersion spin-coated, lift-off, anneal).</p>`},
{x:1,q:"Describe dip-pen nanolithography.",a:`An <b>AFM tip</b> writes patterns directly on a substrate (Mirkin et al., 1999):<ul><li>The AFM cantilever is the <b>"pen"</b>, a solution of molecules is the <b>"ink"</b> (originally octadecanethiol, ODT), and the substrate is the "paper" (Au, SiOₓ …).</li><li>When the tip touches the surface, water condenses naturally into a <b>meniscus</b> between tip and substrate, and the molecules are transported through it.</li><li><b>Chemisorption</b> (e.g. thiol to Au) is the driving force that transfers the molecules to the substrate.</li><li>Dot radius grows with contact time, <b>r ∝ √t</b>, because molecules diffuse outward from the tip.</li></ul><p class="why">Advantages: works in ambient conditions, AFM-level resolution, you can "write and read" with the same tip, and many inks are possible (small organics, polymers, biomolecules, colloids, metal ions). Disadvantage: slow, sequential writing.</p>`},
{x:1,q:"Give one advantage and one typical application for each soft lithography type. Which for prototyping, which for mass production?",a:`<ul><li><b>µCP</b>: cheap and scalable, patterns large areas, works on curved surfaces. Application: printing SAMs for sensors and biochips, or SAM etch masks.</li><li><b>NIL</b>: high resolution, cheap, high throughput. Application: microfluidics, lab-on-a-chip, large-area templates or lattices for optoelectronics.</li><li><b>DPN</b>: flexible, ambient conditions, AFM resolution, no mask. Application: prototyping, testing patterns, fundamental science.</li></ul><p class="why"><b>Developing or testing</b> a pattern: DPN (no mould needed, easy to change). <b>Mass production</b>: µCP or NIL. Making the master or mould takes time, but after that, copies are fast and cheap.</p>`},
{q:"SPM history: who invented STM and AFM, and when?",a:`<ul><li><b>STM</b>: 1981, Binnig and Rohrer (IBM Zürich). <b>Nobel Prize in Physics 1986</b>, shared with Ruska (electron microscope).</li><li><b>AFM</b>: 1986, Binnig, Quate and Gerber.</li></ul><p class="why">"Microscopy" is slightly misleading: no optical image forms. The surface is scanned point by point with a probe. Later variants: SNOM (near-field optical), scanning SQUID, scanning thermal microscopy, cAFM, PFM, MFM.</p>`},
{x:1,q:"Explain the principle of STM. Why is its vertical resolution so good?",a:`A sharp <b>conducting tip</b> (W or Pt–Ir) on a 3D <b>piezoelectric</b> scanner is brought to 0.2–0.6 nm from a <b>conducting</b> sample. With a small bias voltage, electrons <b>tunnel</b> through the vacuum gap (0.1–10 nA).<br><b>I = C ρ<sub>t</sub> ρ<sub>s</sub> exp(−z k<sup>1/2</sup>)</b>, or from quantum mechanics <b>I ∝ exp(−2κz)</b>, with κ = √(2mφ)/ħ<br>(z = tip–sample distance, ρ<sub>t</sub>, ρ<sub>s</sub> = density of states of tip and sample, φ = work function)<p class="why">With φ ≈ 4.5 eV, κ ≈ 11 nm⁻¹, so increasing z by 0.1 nm reduces I by e⁻²·² ≈ 0.11. The current changes about <b>10× per Å</b>, giving about 0.002 nm z-resolution and about 0.01 nm lateral, which is atomic resolution.<br>Modes: <b>constant current</b> (feedback adjusts the tip height and the height map is the image; most common) or <b>constant height</b> (measure the current; faster, needs very flat samples). Example: the Si(111) 7×7 reconstruction in UHV (in air it oxidizes immediately).</p>`},
{x:1,q:"Explain the principle of AFM and its modes. What can it do that STM can't?",a:`<ol><li>The sample sits on a scanner, and a <b>cantilever</b> with a sharp tip (Si or SiN, tip radius a few nm) is brought close to the surface.</li><li><b>Forces</b> between tip and sample bend the cantilever: short-range (van der Waals, repulsion) and long-range (electrostatic, magnetic, capillary from condensed water).</li><li>A <b>laser</b> reflected off the back of the cantilever onto a <b>photodiode</b> measures the bending.</li><li>Usually a feedback loop keeps the force constant and records the height.</li></ol><b>AFM works on insulators</b>; STM needs conducting samples.<ul><li><b>Contact mode</b> (repulsive regime): high resolution, but can damage soft samples</li><li><b>Non-contact</b> (attractive regime): the cantilever oscillates above the surface, and shifts in resonance frequency give the topography</li><li><b>Tapping</b> (intermittent contact): brief contact once per oscillation, good for soft and biological samples</li></ul><p class="why">The tip–sample force follows a Lennard-Jones-like curve: attractive at long range, repulsive at short range.</p>`},
{x:1,q:"Name AFM/SPM variants for local functional properties.",a:`<ul><li><b>cAFM</b> (conductive AFM): local electrical conductivity / current maps</li><li><b>PFM</b> (piezoresponse force microscopy): ferroelectric domains and domain walls (an AC voltage on the tip makes the sample vibrate piezoelectrically)</li><li><b>MFM</b> (magnetic force microscopy) or <b>spin-polarized STM</b>: local magnetic structure</li><li>Also SNOM (optical), scanning SQUID, scanning thermal microscopy (SThM)</li></ul>`},
{x:1,q:"How can scanning probe microscopes be used for nanomanipulation? Give examples.",a:`Beyond imaging, the tip can <b>push, pull or slide</b> atoms, molecules, nanoparticles and nanowires into positions that self-assembly can't make. It can also locally <b>write, oxidize, reduce or deposit</b> material, creating metastable (not ground-state) structures or molecules that conventional synthesis can't make.<ul><li><b>IBM 1990</b> (Eigler): 35 Xe atoms arranged on Ni(110) by STM, in UHV at 4 K</li><li><b>Quantum corral</b> (1993): a ring of Fe atoms on Cu(111) traps surface electrons, which form standing waves</li><li><b>Chemistry with STM</b>: tunnelling electrons break C–I bonds in iodobenzene, the C₆H₅ radicals are pushed together, and new electrons bind them into biphenyl (C₁₂H₁₀)</li><li><b>AFM</b>: pushing a 30 nm Au particle on mica; cyclo[18]carbon (2019), made by removing CO groups one by one</li><li><b>Writing</b>: STM voltage pulses dig nm holes in graphite; hot AFM tips sculpt 3D relief in polymers; field-induced conducting defects in h-YMnO₃</li></ul>`},
{x:1,q:"What forces drive the self-assembly of nanoparticles?",a:`<ul><li>Hydrophobic / hydrophilic interactions</li><li><b>Electrostatic</b> forces: repulsion between like-charged particles, attraction to an oppositely charged surface</li><li><b>Capillary</b> forces from liquid menisci</li><li>Chemisorption (covalent binding)</li><li><b>Van der Waals</b> forces: only at very short distances, stabilize aggregates and 2D crystals</li><li><b>Magnetic</b> interactions (e.g. under an external field)</li></ul><p class="why">The book also mentions shear forces (flow), electric fields (dielectrophoresis of nanowires) and gravity (sedimentation into colloidal crystals).</p>`},
{x:1,q:"How do capillary forces drive self-assembly? Describe template-assisted self-assembly (TASA).",a:`<b>Capillary forces</b>: a liquid meniscus forms a bridge between particles, and its <b>surface tension</b> pulls them together into close-packed structures. This happens especially when the solvent film becomes thinner than the particle diameter (immersion forces). Like particles attract; a hydrophilic and a hydrophobic particle repel.<br><b>TASA</b> (Yin and Xia, 2001) combines a physical template with capillary self-assembly:<ol><li>A dispersion of colloidal spheres (e.g. polystyrene) flows through a fluidic cell over a template with holes (patterned photoresist on glass).</li><li>As the liquid front recedes across the template, capillary forces push the spheres into the holes.</li></ol>The ratio of <b>hole diameter D to sphere diameter d</b> sets how many spheres fit, giving singles, dimers, trimers and so on. D<sub>min</sub>/d = 1 + 1/sin(π/N) for N spheres in a ring. Different hole shapes (circles, grooves, squares) give different patterns.`},
{q:"What is the 2D electron gas at the LaAlO₃/SrTiO₃ interface?",a:`<b>Two insulators</b> (LAO, E<sub>g</sub> 5.6 eV; STO, 3.2 eV) give a <b>conducting interface</b> (a 2DEG) when LAO is grown epitaxially on TiO₂-terminated STO, once LAO is thicker than about 4 unit cells (Ohtomo and Hwang, 2004).<p class="why"><b>Polar catastrophe</b>: STO consists of neutral layers (SrO⁰, TiO₂⁰), while LAO alternates LaO⁺ and AlO₂⁻. The polar discontinuity at the interface would make the electric potential grow without limit with LAO thickness, which is unphysical.<br><b>Electronic reconstruction</b> (TiO₂/LaO interface): 0.5 e⁻ per unit cell transfers to the interface, Ti⁴⁺ is partly reduced to Ti³⁺, and the result is an n-type conducting 2DEG. At the SrO/AlO₂ (p-type) interface, the catastrophe is instead avoided by <b>oxygen vacancies</b>, so it is insulating. STEM-EELS confirms both.</p>`},
{q:"What are ferroelectric domain walls, and why can charged walls conduct?",a:`A <b>domain wall</b> is the boundary between two domains with different orientation of a ferroic order (polarization, magnetization, strain). It is the same material on both sides and only a few unit cells thick, so it is a natural 2D nano-object.<ul><li><b>Neutral wall</b>: polarization runs side by side with the wall</li><li><b>Charged walls</b>: <b>head-to-head</b> (positive bound charge) or <b>tail-to-tail</b> (negative bound charge)</li></ul><p class="why">Charged walls need <b>screening charge</b>: head-to-head walls attract electrons (or O²⁻, OH⁻), tail-to-tail walls attract holes or oxygen vacancies (or H⁺). So their conductivity differs from the domains. Walls can be written, moved and erased by electric fields, which suggests reconfigurable nanoelectronics (switches, diodes). Improper ferroelectrics like YMnO₃ can have stable charged walls.</p>`}
]});

DECKS.push({id:"char", name:"Characterization", lec:"L19–L20 · CW 8", cards:[
{q:"What is the general requirement for characterizing at the nanoscale? Which two approaches exist?",a:`You must use a <b>probe on the same length scale</b> as the property you want to measure.<ol><li><b>Natural nanosized probes</b>: radiation or particles whose wavelength is around or below 1 nm. Electromagnetic radiation (X-rays, λ ≈ 1 Å) and particles (electrons, neutrons, protons, ions). Mostly averaging, scattering-based techniques, plus electron microscopy.</li><li><b>Miniaturized probes</b>: a physical tip of nm size. Scanning probe microscopy (AFM, STM), which is local and surface-sensitive.</li></ol><p class="why">We characterize to learn atomic structure, shape and morphology, size, composition, and physical, chemical and electromagnetic properties.</p>`},
{q:"What happens when X-rays hit a sample, and what three kinds of experiment does this enable?",a:`Incoming X-rays can be <b>scattered</b> (elastically: diffraction; inelastically: Compton), <b>transmitted</b>, or <b>absorbed</b>. Absorption gives photoelectrons (XPS), characteristic X-rays (fluorescence), Auger electrons and heat.<ul><li><b>Microscopy</b>: imaging structures not otherwise visible (transmission)</li><li><b>Diffraction / scattering</b>: structural information from the interference between scattered waves (XRD, SAXS, PDF)</li><li><b>Spectroscopy</b>: intensity as a function of wavelength or energy gives chemical information (XPS, fluorescence)</li></ul>`},
{x:1,q:"Name three advantages of synchrotron X-rays over a lab diffractometer.",a:`<ul><li><b>Much higher intensity and brilliance</b> (photons per second per source area per solid angle per bandwidth): better data, much faster. What takes days in the lab takes minutes or hours at a synchrotron.</li><li><b>Extreme time resolution</b> (down to ns–ps): enables <b>in situ and time-resolved</b> studies, e.g. following hydrothermal synthesis in real time</li><li><b>Tunable wavelength or energy</b>: enables a range of techniques (e.g. element-specific absorption edges). Also higher resolution.</li></ul>`},
{x:1,q:"WAXS/XRD vs SAXS vs PDF: what does each tell you?",a:`All three measure elastic X-ray scattering, at different angles and with different analysis:<ul><li><b>WAXS / XRD</b> (wide angles, Bragg peaks): the <b>average long-range</b> atomic structure; phases, lattice parameters, crystallite size, strain. Only for crystalline material.</li><li><b>SAXS</b> (2θ &lt; about 5°): scattering at small angles reflects <b>large features</b>, giving <b>particle size, shape and size distribution</b>. Works for amorphous particles, proteins in solution, colloids and pores.</li><li><b>PDF</b> (total scattering: Bragg + diffuse, Fourier-transformed): the <b>average local</b> atomic structure (interatomic distances); disorder, amorphous phases, very small nanoparticles.</li></ul><p class="why">Length scales: PDF ≈ 0.1–few nm, XRD gives atomic periodicity, SAXS ≈ 1–200 nm. Shared weaknesses: weak for light elements; average over a large volume, so not a local probe.</p>`},
{q:"Give Bragg's law and the Laue condition, and how Q relates to d and θ.",a:`<b>Bragg's law</b>: <b>2d sin θ = nλ</b>. Diffraction happens when X-rays reflecting from lattice planes with spacing d interfere constructively (the path difference is a whole number of wavelengths).<br><b>Laue condition</b>: <b>Q = G<sub>hkl</sub></b>. Diffraction happens when the scattering vector equals a reciprocal lattice vector, G<sub>hkl</sub> = ha* + kb* + lc*.<br><b>|Q| = 4π sin θ / λ = 2π / d<sub>hkl</sub></b><p class="why">Data can be plotted against 2θ (depends on λ), or against Q or d (independent of λ, so you can compare instruments). A larger d gives a peak at lower 2θ, so thermal expansion shifts peaks to lower angles.</p>`},
{x:1,q:"What three types of information does each Bragg peak in XRD give?",a:`<ul><li><b>Position</b> (2θ): from Bragg's law, the <b>d-spacing</b> between lattice planes and hence the <b>lattice parameters</b>. Cubic: d<sub>hkl</sub> = a/√(h² + k² + l²). Shifts show thermal expansion or strain; peak splitting shows lower symmetry.</li><li><b>Intensity</b> (area): I ∝ |F<sub>hkl</sub>|² (structure factor), so the <b>types of atoms and their positions</b> in the unit cell (also thermal vibrations); phase fractions; stoichiometry.</li><li><b>Width</b> (FWHM): <b>crystallite size</b> (Scherrer), <b>strain</b> (microstrain broadening) and instrumental broadening.</li></ul>`},
{x:1,q:"What does the Scherrer equation give? What is a common misconception?",a:`<b>D = K λ / (β cos θ)</b><br>D = crystallite size, K ≈ 0.9–1 (shape factor), λ = wavelength, β = peak width (FWHM, in radians, after subtracting instrumental broadening), θ = Bragg angle.<p class="why">Small crystals have few lattice planes, so the interference condition is less sharp and peaks broaden. Smaller D gives broader peaks.<br><b>Misconception</b>: D is the <b>crystallite</b> (coherently diffracting domain) size, <b>not the particle size</b>. One particle can contain several crystallites, and strain also broadens peaks.</p>`},
{q:"How do you tell cubic from tetragonal symmetry with XRD? Why is it harder for nanoparticles?",a:`In a cubic crystal a = b = c, so e.g. (100), (010) and (001) have the same d and give <b>one peak</b>. In a tetragonal crystal c ≠ a, so (001) separates from (100)/(010) and the peak <b>splits</b>. Cubic: d = a/√(h² + k² + l²); tetragonal: 1/d² = (h² + k²)/a² + l²/c².<p class="why">For nanoparticles, <b>size broadening</b> (Scherrer) can make the split peaks overlap and hide a small tetragonal distortion. Nano BaTiO₃ can look cubic in XRD while being locally tetragonal, which PDF reveals. XRD alone can't always tell cubic from tetragonal for nanoparticles.</p>`},
{q:"Write the structure factor. Why are light elements hard to see with X-rays?",a:`<b>F<sub>hkl</sub> = Σ<sub>i</sub> f<sub>i</sub> exp[2πi(hx<sub>i</sub> + ky<sub>i</sub> + lz<sub>i</sub>)]</b>, summed over all atoms in the unit cell, and <b>I<sub>hkl</sub> ∝ |F<sub>hkl</sub>|²</b><br>f<sub>i</sub> = atomic form factor (scattering length); x<sub>i</sub>, y<sub>i</sub>, z<sub>i</sub> = fractional coordinates.<p class="why">X-rays scatter from electrons, so f<sub>i</sub> is roughly proportional to the <b>atomic number Z</b>. Light atoms (H, Li, O) scatter weakly: oxygen in PbTiO₃ is nearly "invisible" next to Pb. Neighbours in the periodic table (Fe and Mn) have almost the same f, so they are hard to tell apart. If the unit cell is known, the whole pattern can be calculated, and <b>Rietveld refinement</b> fits a structural model to the measured pattern.</p>`},
{q:"List the information XRD gives, plus its strengths and weaknesses.",a:`<b>Information</b>:<ol><li>Crystalline phases present (peak positions)</li><li>Phase fractions (intensity scaling of each phase's lines)</li><li>Crystallite size (Scherrer), <i>not</i> particle size</li><li>Stoichiometry (relative intensities)</li><li>Lattice parameters, symmetry, phase transitions (peak splitting)</li></ol><b>Strengths</b>: widely available in labs, easy to get started, lots of information.<br><b>Weaknesses</b>: <b>only crystalline</b> materials; <b>average</b> over a large volume (not a local probe); <b>weak scattering from light elements</b>; little chemical information.`},
{x:1,q:"X-rays vs neutrons for diffraction: when do you need neutrons?",a:`<b>X-rays</b>: easy to produce in the lab, easy to guide and focus, scatter from electrons (f ∝ Z).<br><b>Neutrons</b>: need a nuclear reactor or spallation source, interact weakly with matter (<b>large samples</b> needed) and are hard to guide and focus. But:<ul><li>The neutron scattering length depends on the <b>nucleus</b>, a seemingly random function of the isotope, not proportional to Z. So <b>light elements (H, Li, O)</b> scatter as strongly as heavy ones, and neighbouring elements can be distinguished.</li><li>Neutrons have a <b>magnetic moment</b>, so they scatter from magnetic moments and reveal <b>magnetic structures</b>.</li></ul><p class="why">Ideal solution: <b>use both</b> in one Rietveld refinement. X-rays give accurate lattice parameters and heavy-atom positions; neutrons give accurate oxygen positions.</p>`},
{q:"What is PDF (total scattering) analysis used for? Give the BaTiO₃ example.",a:`The <b>pair distribution function</b> uses <b>all</b> the scattering: Bragg peaks plus the weak, less directional <b>diffuse scattering</b> from deviations from perfect order. Short wavelength (≈ 0.5 Å) gives a large Q range. After careful background subtraction and normalization, a <b>Fourier transform</b> gives the probability of finding atom pairs at distance r, which is the <b>local structure</b> in real space.<br>Used for disorder, amorphous phases and very small nanoparticles, where Bragg peaks are broad or absent.<p class="why">BaTiO₃: bulk is tetragonal on long range but rhombohedral locally (Ti off-centred). Nanoparticles look tetragonal or cubic in XRD, but PDF shows that a local tetragonal distortion persists.</p>`},
{q:"SAXS: what samples, and what information (Guinier, Porod)?",a:`<b>Small-angle X-ray scattering</b>: 2θ &lt; about 5° (for Cu Kα), the region usually ignored in XRD (the direct beam is masked out). Scattering at small Q reflects <b>large real-space features</b> (1–200 nm), and there are no diffraction lines in this region.<br>Typical samples: proteins in solution, mesoporous materials, colloidal nanoparticles, amorphous particles.<ul><li><b>Guinier analysis</b>: the slope at low Q gives the <b>radius of gyration</b>, an average particle size</li><li><b>Porod analysis</b>: the slope at higher Q gives the average <b>aspect ratio / shape</b> (1:1 for spheres)</li></ul><p class="why">Analysis is trickier than XRD and relies on approximate models, e.g. a continuous sphere with the particle's average electron density.</p>`},
{q:"Why are electrons good nanoscale probes? What is their wavelength?",a:`<b>λ = h / √(2 m<sub>e</sub> e U)</b><br>(h = Planck's constant, m<sub>e</sub> = electron mass, e = elementary charge, U = acceleration voltage). At 100–300 kV, λ is a few pm, far below atomic spacings. (Strictly a small relativistic correction applies.)<ol><li><b>High energy</b>, so a short wavelength and high resolution</li><li><b>Easy to produce</b> high-intensity beams</li><li><b>Easy to manipulate</b> (focus and scan) with electromagnetic lenses</li><li><b>Interact strongly with matter</b>, so they are sensitive to small volumes (but need thin samples for transmission)</li></ol>Used for both imaging and diffraction.`},
{x:1,q:"Which electron–matter signals are used in SEM, TEM and STEM, and what does each tell you?",a:`<b>SEM</b> (scanning a focused beam over the surface):<ul><li><b>Secondary electrons</b> (SE: low energy, knocked out of the sample's own atoms by inelastic scattering, from near the surface): <b>topography</b>, 3D-like images</li><li><b>Backscattered electrons</b> (BSE: beam electrons scattered back elastically): <b>composition</b> (heavier elements are brighter, Z-contrast) and grain orientation</li><li><b>Characteristic X-rays</b>: <b>EDS</b>, chemical composition maps</li></ul><b>(S)TEM</b> (thin sample, electrons transmitted):<ul><li><b>Elastically scattered electrons</b>: <b>diffraction and imaging</b>, giving crystal structure, phase identification, defects, morphology</li><li><b>Inelastically scattered electrons</b>: <b>EELS</b>, chemical composition and bonding</li></ul>`},
{q:"SEM: sample requirements, and secondary vs backscattered electrons.",a:`Easier sample preparation than TEM (no transmission, so bulk samples work), but the <b>sample must be electrically conductive</b> or charge builds up. Insulators are coated (e.g. sputter-coated with Au or C, like the sputter-coated ant).<ul><li><b>SE</b>: low energy, escape only from near the surface. Edges and tilted surfaces emit more, giving strong <b>topographic</b> contrast (e.g. pollen grains).</li><li><b>BSE</b>: high energy, from the beam. Yield increases with Z, giving <b>compositional</b> contrast (and grain orientation contrast).</li></ul>`},
{q:"TEM: sample thickness, diffraction vs image mode, bright vs dark field.",a:`The sample must be <b>very thin</b> (&lt; 100 nm) for electrons to pass through. Solids are thinned by polishing, ion milling or FIB lamellae; particles are dispersed on a TEM grid.<ul><li>A parallel beam illuminates the sample. The <b>intermediate lens</b> chooses whether the <b>diffraction pattern</b> or the <b>image</b> is projected onto the screen.</li><li>A <b>selected-area aperture</b> chooses which region (e.g. one grain) to diffract from: <b>SAED</b>.</li><li>An <b>objective aperture</b> selects which beam forms the image:<ul><li><b>Bright field</b>: only the direct (transmitted) beam. Strongly diffracting regions appear dark.</li><li><b>Dark field</b>: only one diffracted spot. Grains diffracting into that spot light up.</li></ul></li></ul>`},
{q:"STEM: how does it differ from TEM, and what do BF and (HA)ADF show?",a:`In <b>STEM</b> a finely focused probe is <b>scanned</b> across the sample, instead of illuminating it all at once. At each point the transmitted or diffracted electrons are collected and the image is reconstructed electronically.<ul><li><b>BF</b> (bright field, central detector): weak scatterers such as <b>light atoms (O)</b> become visible</li><li><b>ADF / HAADF</b> (annular dark field): high-angle scattering scales strongly with atomic number, giving <b>Z-contrast</b>. Heavy atoms (e.g. Sr, Lu) appear bright.</li></ul><p class="why">Combined with EELS, STEM maps composition with <b>atomic resolution</b>, e.g. across an epitaxial interface or a domain wall.</p>`},
{x:1,q:"EDS vs EELS: what are they, and when do you use which?",a:`<ul><li><b>EDS/EDX</b> (energy-dispersive X-ray spectroscopy): the beam ionizes inner shells, and the emitted <b>characteristic X-rays</b> identify the elements. Used in <b>SEM</b> (and TEM). Good for composition over <b>larger areas</b> (µm to mm²). Spatial resolution in SEM is about 1 µm (the interaction volume), and it is weak for light elements.</li><li><b>EELS</b> (electron energy loss spectroscopy): measures the <b>energy lost</b> by transmitted electrons in inelastic scattering; each element gives a "fingerprint" edge. Used in <b>TEM/STEM</b> and needs a highly monochromatic beam. Gives <b>atomic-resolution</b> maps across interfaces, is sensitive to light elements, and also gives oxidation state and bonding.</li></ul><p class="why">Exam rule: nm-scale composition across an interface or wall means STEM-EELS. Composition variation over mm² means SEM-EDS.</p>`},
{x:1,q:"Gas adsorption: what does it measure? Compare the Langmuir and BET models.",a:`Gas adsorption measures the <b>specific surface area</b> (m²/g) of powders and porous materials: how many gas molecules (usually N₂ at 77 K) fit on the surface.<br><b>Langmuir isotherm</b>, assumptions:<ul><li>At most <b>one monolayer</b> adsorbs</li><li>All sites are equivalent</li><li>No interaction between adsorbed molecules</li></ul><b>BET</b> (Brunauer, Emmett, Teller), assumptions:<ul><li><b>Multiple layers</b>, with no upper limit; the second layer can start before the first is complete</li><li>Each layer follows the Langmuir model, and there are interactions only between neighbouring layers</li><li>First layer: larger (more negative) adsorption enthalpy, ΔH<sub>ads,1</sub> &lt; ΔH<sub>ads,2</sub></li><li>Second and higher layers behave like condensing liquid: ΔH<sub>ads,2</sub> = −ΔH<sub>vap</sub></li></ul>`},
{q:"How is surface area obtained from an adsorption isotherm?",a:`<ol><li>Measure the adsorbed amount V (or mass) at different gas pressures p, at constant T.</li><li>Fit to the isotherm. Langmuir: θ = V/V<sub>mon</sub> = Kp/(1 + Kp), rearranged to <b>p/V = p/V<sub>mon</sub> + 1/(K V<sub>mon</sub>)</b>. Plot p/V against p: <b>slope = 1/V<sub>mon</sub></b>, intercept = 1/(K V<sub>mon</sub>). (BET uses a similar linearized plot in p/p*.)</li><li>From V<sub>mon</sub>, find the number of molecules in one full monolayer.</li><li>Multiply by the <b>adsorption cross-section</b> of one gas molecule (must be known; N₂ ≈ 0.162 nm²) to get the total surface area, then divide by the sample mass.</li></ol>`}
]});

DECKS.push({id:"props", name:"Nanoscale properties", lec:"L9 · CW 8", cards:[
{q:"What is a catalyst? Relate it to the Arrhenius equation.",a:`A substance that <b>increases the reaction rate by lowering the activation energy</b>, without being consumed. It provides an alternative reaction path, usually via adsorbed intermediates on its surface.<br>For A + B → C + D, rate = k[A]<sup>x</sup>[B]<sup>y</sup>, with the rate constant from Arrhenius:<br><b>k = A₀ exp(−E<sub>a</sub>/RT)</b> (E<sub>a</sub> = ΔG<sup>‡</sup>)<p class="why">E<sub>a</sub> sits in an exponential, so even a modest reduction gives an enormous increase in rate. The catalyst lowers E<sub>a</sub> for both directions and doesn't change the equilibrium.</p>`},
{x:1,q:"Explain the Sabatier principle and the volcano plot.",a:`The interaction between catalyst and adsorbates must be <b>"just right"</b>:<ul><li><b>Too weak binding</b>: reactants don't adsorb or activate, so the rate is <b>limited by adsorption</b> of reactants</li><li><b>Too strong binding</b>: products (or intermediates) don't desorb and they <b>block the active sites</b>, so the rate is <b>limited by desorption</b></li></ul>Plotting catalytic activity against binding energy (e.g. ΔH<sub>f</sub> of the metal formate intermediate for HCOOH → H₂ + CO₂) gives a <b>volcano</b>: rising on the weak-binding side, falling on the strong-binding side, with a <b>maximum at intermediate binding</b>.<p class="why">The top of the volcano is where the two limiting lines (adsorption-limited and desorption-limited) cross. Pt-group metals come out near the top, which is why they are good but expensive catalysts and motivates core–shell particles. (Paul Sabatier, Nobel Prize 1912.)</p>`},
{x:1,q:"Why are heterogeneous catalysts often nanoparticles?",a:`<ul><li><b>Large surface area per mass</b>: catalysis happens at the surface, so more of the atoms do useful work and <b>less expensive material</b> (Pt, Pd, Rh) is needed</li><li><b>More under-coordinated sites</b> (edges, corners, steps), which are often the most active sites. A larger surface area makes it more likely to find highly active sites.</li><li>Size and shape (facets) can be tuned to optimize activity and selectivity; core–shell designs put the expensive element only at the surface</li></ul>`},
{x:1,q:"What are finite-size effects on lattice parameters and phase transitions?",a:`<ul><li><b>Lattice parameters</b>: surface atoms relax inward (metals and covalent), so nanoparticle lattice parameters <b>contract</b> as size decreases. Ionic materials can expand instead (truncated Madelung attraction).</li><li><b>Phase transitions shift down in temperature</b> with decreasing size: melting point (Au), the ferroelectric transition (BaTiO₃, PbTiO₃), magnetic ordering temperatures.</li></ul><p class="why">Reason: the surface atoms are less strongly bound and have a different environment, so the ordered low-temperature phase is destabilized relative to the disordered phase.</p>`},
{q:"How does ferroelectricity change in nanoparticles?",a:`<ul><li><b>Crystal structure determines ferroelectric properties</b>, and <b>crystal structure changes at the nanoscale</b>.</li><li>Ferroelectricity tends to decay through <b>disorder</b> rather than by the displacements simply disappearing. In BaTiO₃ nanoparticles, Ti⁴⁺ remains off-centred locally, but the dipoles become <b>disordered</b>, so the average (long-range) structure looks cubic.</li><li>Material differences: BiFeO₃ shows stronger "structural resilience" than YMnO₃. In BiFeO₃ the polar cation displacements even increase with decreasing size, while the unit cell approaches cubic.</li></ul><p class="why">Understanding this needs a combination of tools: XRD for average structure, PDF for local structure, plus theory.</p>`},
{q:"What are ferroelectricity and multiferroics? Give the examples from the lecture.",a:`<ul><li><b>Ferroelectric</b>: a spontaneous electric polarization that can be <b>switched</b> by an electric field, with a hysteresis loop (remanent polarization P<sub>r</sub>, coercive field E<sub>c</sub>). Above T<sub>C</sub> the material is paraelectric.</li><li><b>Multiferroic</b>: combines two or more ferroic orders (ferroelectric, ferromagnetic, ferroelastic). Magnetoelectric coupling would allow a magnetic state to be switched by an electric field: an "ideal memory".</li></ul>Examples: <b>BiFeO₃</b> (perovskite R3c; ferroelectric T<sub>C</sub> = 830 °C, P<sub>r</sub> ≈ 100 µC/cm², driven by the Bi 6s² lone pair; antiferromagnetic below T<sub>N</sub> = 370 °C) and <b>YMnO₃</b> (hexagonal P6₃cm; improper, geometric ferroelectric, T<sub>C</sub> ≈ 1050 °C).`},
{q:"What is ferromagnetism? Why do magnetic domains form?",a:`Atoms with <b>unpaired electrons</b> have magnetic moments. In a paramagnet the moments are randomly oriented. In a <b>ferromagnet</b>, the moments <b>align spontaneously</b> below the <b>Curie temperature T<sub>C</sub></b>, driven by the quantum-mechanical <b>exchange energy</b>.<br><b>Domains</b>: a uniformly magnetized body produces a large stray field, which costs <b>magnetostatic energy</b>. Splitting into domains with different magnetization directions reduces it. But <b>domain walls</b> cost energy (exchange and anisotropy), so the domain structure is a compromise.<p class="why">The material also prefers certain crystallographic directions for the magnetization: the <b>easy axis</b> (magnetocrystalline anisotropy).</p>`},
{q:"Define saturation, remanent magnetization and coercive field in a magnetic hysteresis loop.",a:`<ul><li><b>Saturation</b> M<sub>s</sub>: all moments aligned by a strong field</li><li><b>Remanent magnetization</b> M<sub>r</sub>: magnetization that remains when the field returns to zero. This "memory" is what stores data bits (0/1).</li><li><b>Coercive field</b> H<sub>c</sub>: the reverse field needed to bring the magnetization back to zero, i.e. to switch the bit</li></ul><p class="why">Hysteresis means the magnetization depends on the previous field history (up or down).</p>`},
{q:"Why do magnetic particles become single-domain below a critical size?",a:`Compare the energies as the particle size r changes:<ul><li><b>Magnetostatic energy</b> saved by forming domains scales with <b>volume, ∝ r³</b></li><li><b>Domain wall energy</b> scales with the <b>wall area, ∝ r²</b></li></ul>As r decreases, r³ falls faster than r². Below a <b>critical size</b>, forming a wall costs more than it saves, so the particle stays <b>single-domain</b>.<p class="why">A single-domain particle has high magnetostatic energy but no wall energy. A multi-domain particle has reduced magnetostatic energy but extra wall and exchange energy.</p>`},
{x:1,q:"Explain why the coercive field goes through a maximum as particle size decreases.",a:`<ul><li><b>Large particles</b> (multi-domain): the magnetization reverses easily by <b>domain wall motion</b>, so the coercivity is low.</li><li><b>Decreasing size</b>: fewer domains, then <b>single-domain</b>. With no walls to move, the whole moment must rotate coherently against the anisotropy barrier, so the <b>coercivity increases</b> and reaches a maximum around the single-domain size.</li><li><b>Even smaller</b>: the anisotropy energy barrier <b>KV</b> shrinks with volume until it becomes comparable to the <b>thermal energy k<sub>B</sub>T</b>. Thermal fluctuations then flip the moment spontaneously, the particle becomes <b>superparamagnetic</b>, and the coercivity drops towards zero.</li></ul>`},
{x:1,q:"What is superparamagnetism?",a:`For very small single-domain particles, the energy barrier for flipping the magnetization is <b>E<sub>ani</sub> = KV</b> (K = anisotropy constant, V = particle volume). When <b>KV ≈ k<sub>B</sub>T</b>, thermal energy is enough to flip the moment of each particle back and forth.<p class="why">The particles then behave like the moments in a <b>paramagnet</b>, but each "moment" is a whole particle with thousands of spins (a giant moment). Result: high magnetization in a field, but <b>no remanence and no coercivity</b> (no hysteresis) at zero field. Example: 2.2 nm Fe particles in Hg. Useful in biomedicine (MRI contrast, drug targeting), but limits how small magnetic storage bits can be.</p>`},
{q:"Single-domain magnetic particle: what happens with the field along the easy axis vs the hard axis?",a:`<ul><li><b>Field along the easy axis</b>: the magnetization stays along the axis and switches abruptly when the field passes the coercive field. A <b>square hysteresis loop</b> with high coercivity.</li><li><b>Field along the hard axis</b>: the magnetization rotates gradually toward the field and <b>rotates back</b> to the easy axis when the field is removed. <b>No hysteresis.</b></li></ul><p class="why">Shape anisotropy (e.g. elongated particles) can define the easy axis.</p>`},
{q:"Why are reactions and processes much faster at the nanoscale?",a:`Solid-state reactions depend on mass transport by <b>diffusion</b>. The time needed for a diffusion process scales with the <b>square</b> of the length:<br><b>t ∝ x² / D</b> (D = diffusion coefficient)<p class="why">Reducing the distance from 1 µm to 10 nm (100× shorter) makes the process about 10 000× faster. "Nano fast, bulk slow". It is one reason nanopowders sinter and react at lower temperatures.</p>`}
]});

DECKS.push({id:"pick", name:"Method picker (exam scenarios)", lec:"Mixed · all lectures", cards:[
{x:1,q:"Which characterization method? Lattice parameters / average crystal structure of a crystalline material.",a:`<b>XRD</b> (WAXS).<p class="why">Peak positions give d-spacings via Bragg's law (2d sin θ = nλ), and from these the lattice parameters. XRD averages over a large volume, which is exactly what "average structure" asks for. TEM electron diffraction is a local alternative.</p>`},
{x:1,q:"Which characterization method? Particle size of colloidal (possibly amorphous) nanoparticles in solution.",a:`<b>SAXS</b> (Guinier analysis gives the radius of gyration).<p class="why">SAXS works in solution and on amorphous particles, and averages over many particles. TEM or SEM images also work but count fewer particles. XRD with Scherrer gives <i>crystallite</i> size and only for crystalline material.</p>`},
{x:1,q:"Which characterization method? Local structure / disorder in amorphous or very small nanoparticles.",a:`<b>PDF</b> (X-ray total scattering).<p class="why">It uses Bragg and diffuse scattering and transforms them to real space, giving interatomic distances even without long-range order. TEM/SAED can give a local look at small regions.</p>`},
{x:1,q:"Which characterization method? Chemical composition variation across an epitaxial interface, grain boundary or domain wall (nm resolution).",a:`<b>STEM + EELS</b> (atom probe tomography also works).<p class="why">The relevant length scale is a few atomic layers, so you need atomic-resolution chemical mapping. SEM-EDS has about µm resolution and can't resolve it.</p>`},
{x:1,q:"Which characterization method? Chemical composition variation over a square millimetre.",a:`<b>EDS (EDX) in an SEM</b>.<p class="why">An SEM can scan large areas quickly, and characteristic X-rays give elemental maps. EELS in TEM covers only tiny, thin areas.</p>`},
{x:1,q:"Which characterization method? Surface morphology of an insulating oxide thin film.",a:`<b>AFM</b>.<p class="why">AFM measures forces, so it works on insulators and gives quantitative 3D topography (roughness). STM needs a conducting sample. SE-SEM needs conductive coating for an insulator and gives no height values.</p>`},
{x:1,q:"Which characterization method? Local electrical conductivity on a film surface.",a:`<b>Conductive AFM (cAFM)</b>.<p class="why">A conducting AFM tip measures current while it scans, giving a conductivity map with topography. STM is a weaker second choice because it needs the whole sample to conduct and mixes topography and electronic signal.</p>`},
{x:1,q:"Which characterization method? Ferroelectric domain structure at a surface.",a:`<b>PFM</b> (piezoresponse force microscopy), an AFM mode.<p class="why">An AC voltage on the tip makes the sample expand and contract piezoelectrically. The phase of the response shows the polarization direction, so domains and walls can be mapped. STM can't be used, and cAFM is not ideal.</p>`},
{x:1,q:"Which characterization method? Local magnetic structure across a surface.",a:`<b>MFM</b> (magnetic force microscopy) or <b>spin-polarized STM</b> (you must say "spin-polarized").<p class="why">MFM uses a magnetic tip to sense stray fields. Spin-polarized STM gives atomic-scale magnetic contrast on conducting surfaces. For bulk magnetic structure, use neutron diffraction.</p>`},
{x:1,q:"Which characterization method? Individual adatoms or vacancies on an atomically flat Pt (metal) surface.",a:`<b>STM</b>.<p class="why">The surface conducts, and STM's exponential current–distance dependence gives true atomic resolution, so individual vacancies and adatoms are visible (as in the Pt example from the lecture).</p>`},
{x:1,q:"Which characterization method? Total surface area of a nanoparticle powder or a mesoporous material.",a:`<b>Gas adsorption, BET isotherm</b>.<p class="why">It directly counts how many gas molecules cover the full surface, including internal pore surfaces. It can also be estimated from particle size (SAXS, XRD), but that misses porosity and is inferior.</p>`},
{x:1,q:"Which characterization method? Thin film thickness.",a:`<b>Ellipsometry</b> is the most elegant (an optical, non-destructive measurement of polarization change). A cross-section in SEM or TEM also works, and so does X-ray reflectivity.`},
{x:1,q:"Which characterization method? Morphology of a nanocrystalline powder.",a:`<b>SEM</b> (shape, agglomeration, surface) or <b>TEM</b> (individual particles, internal structure, size).`},
{q:"Which characterization method? Oxygen positions or H in a heavy-element oxide, or a magnetic structure.",a:`<b>Neutron diffraction</b>, ideally combined with XRD in a joint Rietveld refinement.<p class="why">Neutron scattering lengths don't scale with Z, so O and H are clearly visible next to heavy cations. Neutrons also have a magnetic moment, so they reveal magnetic order.</p>`},
{q:"Which characterization method? Following crystallization during hydrothermal synthesis in real time.",a:`<b>In situ synchrotron XRD</b>.<p class="why">The high brilliance gives patterns in seconds or less, so phases, phase fractions and crystallite sizes can be followed in time while T and p are controlled (e.g. 100–450 °C, 100–300 bar in a flow reactor).</p>`},
{x:1,q:"Which method? Monitoring monolayer-by-monolayer coverage during MBE growth.",a:`<b>RHEED</b> (reflection high-energy electron diffraction).<p class="why">The specular spot intensity oscillates with one period per completed monolayer: maximum for a smooth, complete layer, minimum at half coverage.</p>`},
{x:1,q:"Synthesis pick: cheap, scalable production of large amounts of oxide nanoparticles (e.g. an iron oxide).",a:`Options (all accepted if cheap and scalable):<ul><li><b>Co-precipitation</b> in basic solution: metal salts + base (e.g. Fe²⁺/Fe³⁺ + NH₄OH gives Fe₃O₄), controlled T and atmosphere</li><li><b>Sol-gel</b>: metal precursor + complexing agent, then calcination</li><li><b>Spray pyrolysis</b>: a continuous reactor, aqueous solution, complex stoichiometry possible</li><li>Hydrothermal synthesis</li></ul><p class="why">Always name the key chemicals: solvent + metal precursor, plus a base (co-precipitation) or a complexing agent (sol-gel, spray pyrolysis).</p>`},
{x:1,q:"Synthesis pick: monodisperse metallic nanoparticles (Au, Pt, Pd …) with a narrow size distribution.",a:`<b>Colloidal reduction in dilute solution</b>: metal precursor (e.g. HAuCl₄, H₂PtCl₆) + solvent (water) + reducing agent (citrate, NaBH₄) + capping agent or polymer (PVP, PEG), with heating and stirring under controlled atmosphere.<p class="why">For a narrow distribution, aim for burst nucleation (short LaMer region II) and diffusion-limited growth (dilute solution, polymer layer). Alternative: <b>reverse micelles</b> (water + oil + surfactant, precursor in one microemulsion and reducing agent in another).</p>`},
{x:1,q:"Synthesis pick: polymer nanofibres, porous oxide nanofibres, hollow oxide nanotubes.",a:`<ul><li><b>Polymer nanofibres</b>: <b>electrospinning</b> (fast, cheap, made for polymers)</li><li><b>Porous oxide nanofibres</b>: <b>electrospin</b> a polymer + metal precursor solution (e.g. PVP + Ti or Zn salt), then <b>calcine</b>. Burning off the polymer leaves porosity (surfactants can add more).</li><li><b>Hollow oxide nanotubes</b>: <b>sol-gel coating inside a porous template</b> (AAO from anodized Al), then calcine and dissolve the template (leaching)</li></ul>`},
{x:1,q:"Synthesis pick: semiconductor nanowires (Si, Ge, GaN, InAs) with controlled diameter and length.",a:`<b>VLS</b>: supply the precursor by CVD or MBE, with metal catalyst droplets (e.g. Au) chosen from the phase diagram so they form a liquid alloy.<p class="why">The catalyst droplet size controls the <b>diameter</b>, and the growth time controls the <b>length</b>. Lithographic placement of the catalyst controls the position. SLS is an alternative at lower T.</p>`},
{x:1,q:"Synthesis pick: metal nanowires (Cu, Ag).",a:`<b>Electrodeposition into a porous template</b> (AAO, or a resist patterned by EBL) for Cu or Ag. Or Ag wires by <b>polyol dissolution–condensation</b> (Pt seeds + AgNO₃ in ethylene glycol + PVP).<p class="why">Metals are conductive, so electrodeposition works, and the template sets diameter and length. VLS is generally not suited to metals. PVD/CVD through a lithographic pattern followed by lift-off is another option.</p>`},
{q:"Thin film pick: 100 µm of crystalline conducting oxide on glass (thick, fast).",a:`<b>CVD</b> or <b>sol-gel / spray</b> methods.<p class="why">For a thick layer, growth rate matters most. MBE, PLD and ALD are far too slow for 100 µm. CVD (e.g. APCVD) and solution methods are fast and cheap.</p>`},
{x:1,q:"Thin film pick: a few nm of perfectly stoichiometric, conformal oxide on a 3D structure or powder.",a:`<b>ALD</b>.<p class="why">Self-limiting surface reactions give exact thickness control (one monolayer per cycle) and conformal coverage of trenches, 3D shapes and powders. Its slowness doesn't matter for a few nm.</p>`},
{x:1,q:"Thin film pick: mesoporous oxide layer with regular 2–50 nm pores.",a:`<b>Sol-gel with a surfactant (micelle) template</b>, then calcination to remove the surfactant.<p class="why">The micelle template gives the best control of pore size and regularity. Hydrothermal synthesis is simpler but gives less ordered pores.</p>`},
{x:1,q:"Thin film pick: 20 monolayers of a surfactant-type (amphiphilic) material on top of a device stack.",a:`<b>Langmuir–Blodgett</b>.<p class="why">It transfers ordered monolayers one at a time and relies only on physisorption, so it works on top of a multilayer stack. SAMs need a specific chemical reaction with the surface for each layer, which is difficult here.</p>`},
{x:1,q:"Thin film pick: patterned metal contacts a few nm thick at specific sites.",a:`<b>Sputtering</b> (or evaporation) combined with <b>photolithography</b> to define the pattern, followed by lift-off or etching.<p class="why">Sputtering is the standard method for metal contacts. Lithography defines where they go.</p>`},
{x:1,q:"Thin film pick: high-quality GaAs.",a:`<b>MBE</b> or <b>MOCVD</b>.<p class="why">MBE gives the best epitaxial quality and layer control. MOCVD is the industrial workhorse for III–V semiconductors.</p>`}
]});


</script>
<script>
(function(){
  const KEY="tmt4320-flash-v1";
  let state={};
  try{ state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ state={}; }
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };
  if(!state.marks) state.marks={};
  if(!state.sel) state.sel=DECKS.map(d=>d.id);
  if(!state.filter) state.filter="unknown";
  if(state.starOnly===undefined) state.starOnly=false;

  const ALL=[];
  DECKS.forEach(d=>d.cards.forEach((c,i)=>{ c.id=d.id+"-"+i; c.deck=d; ALL.push(c); }));
  const app=document.getElementById("app");
  const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const check='<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function pick(cards){
    return cards.filter(c=>{
      if(state.starOnly && !c.x) return false;
      const m=state.marks[c.id];
      if(state.filter==="unknown") return m!=="k";
      if(state.filter==="missed") return m==="m";
      return true;
    });
  }

  let session=null, confirmReset=false;

  function home(){
    session=null;
    const known=ALL.filter(c=>state.marks[c.id]==="k").length;
    const missed=ALL.filter(c=>state.marks[c.id]==="m").length;
    const selCards=ALL.filter(c=>state.sel.includes(c.deck.id));
    const nSel=pick(selCards).length, nAll=pick(ALL).length;
    const seg=(v,l)=>`<button type="button" data-filter="${v}" aria-pressed="${state.filter===v}">${l}</button>`;
    app.innerHTML=`
      <header>
        <div class="mono">TMT4320 Nanomaterials · exam practice</div>
        <h1>Flashcards</h1>
        <p class="sub">${ALL.length} cards in ${DECKS.length} topics, from lectures 2–22, your notes and the 2020–2025 exams. ★ marks topics that have come up on past exams.</p>
      </header>
      <div class="stats">
        <div class="stat"><b>${known}</b><span>known</span></div>
        <div class="stat"><b>${missed}</b><span>to repeat</span></div>
        <div class="stat"><b>${ALL.length-known-missed}</b><span>not seen</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="label">Which cards</span>
        <div class="seg" role="group" aria-label="Card filter">${seg("unknown","Not yet known")}${seg("missed","Only missed")}${seg("all","All cards")}</div>
        <div class="seg" role="group" aria-label="Exam filter">
          <button type="button" id="starOff" aria-pressed="${!state.starOnly}">Everything</button>
          <button type="button" id="starOn" aria-pressed="${state.starOnly}">★ Exam topics only</button>
        </div>
      </div>
      <div class="row" style="justify-content:space-between">
        <span class="label">Topics (${state.sel.length} selected)</span>
        <span class="row"><button class="link" id="selAll" type="button">Select all</button><button class="link" id="selNone" type="button">Clear</button></span>
      </div>
      <div class="decks">${DECKS.map(d=>{
        const n=d.cards.length, k=d.cards.filter(c=>state.marks[c.id]==="k").length, m=d.cards.filter(c=>state.marks[c.id]==="m").length;
        const on=state.sel.includes(d.id);
        return `<button type="button" class="deck" data-deck="${d.id}" aria-pressed="${on}">
          <span class="check">${check}</span>
          <span style="min-width:0"><div class="name">${esc(d.name)}</div><div class="meta">${esc(d.lec)}</div>
          <div class="bar"><i class="k" style="width:${k/n*100}%"></i><i class="m" style="width:${m/n*100}%"></i></div></span>
          <span class="count">${k}/${n}</span></button>`;}).join("")}
      </div>
      <div class="actions">
        <button class="btn primary" id="go" type="button" ${nSel?"":"disabled"}>Study selected (${nSel})</button>
        <button class="btn" id="mix" type="button" ${nAll?"":"disabled"}>Mix all topics (${nAll})</button>
      </div>
      ${(!nSel && state.sel.length)?`<p class="note">No cards match this filter in the selected topics. Try "All cards".</p>`:""}
      <div class="foot">
        <span>Cards are shuffled. Tap a card to see the answer, then mark whether you knew it. Progress is saved in this browser only, so your phone and laptop keep separate progress.</span>
        <span>${confirmReset?`<span class="confirm">Erase all progress on this device? <button type="button" id="resetYes">Erase</button><button type="button" class="link" id="resetNo">Cancel</button></span>`:`<button class="link" id="reset" type="button">Reset progress</button>`}</span>
      </div>`;
    app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;save();home();});
    app.querySelector("#starOff").onclick=()=>{state.starOnly=false;save();home();};
    app.querySelector("#starOn").onclick=()=>{state.starOnly=true;save();home();};
    app.querySelectorAll("[data-deck]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.deck; state.sel=state.sel.includes(id)?state.sel.filter(x=>x!==id):[...state.sel,id]; save(); home();});
    app.querySelector("#selAll").onclick=()=>{state.sel=DECKS.map(d=>d.id);save();home();};
    app.querySelector("#selNone").onclick=()=>{state.sel=[];save();home();};
    app.querySelector("#go").onclick=()=>start(pick(selCards),"Selected topics");
    app.querySelector("#mix").onclick=()=>start(pick(ALL),"All topics");
    const r=app.querySelector("#reset"); if(r) r.onclick=()=>{confirmReset=true;home();};
    const ry=app.querySelector("#resetYes"); if(ry) ry.onclick=()=>{state.marks={};confirmReset=false;save();home();};
    const rn=app.querySelector("#resetNo"); if(rn) rn.onclick=()=>{confirmReset=false;home();};
  }

  function start(cards,label){
    if(!cards.length) return;
    session={cards:shuffle(cards),i:0,shown:false,label,res:{k:0,m:0},missed:[]};
    window.scrollTo(0,0); card();
  }

  function card(){
    const s=session, c=s.cards[s.i];
    app.innerHTML=`
      <div class="topbar"><button class="back" id="back" type="button">← Topics</button><span class="mono">${esc(s.label)}</span><span class="pos">${s.i+1} / ${s.cards.length}</span></div>
      <div class="prog"><i style="width:${(s.i)/s.cards.length*100}%"></i></div>
      <article class="card fade" id="card" tabindex="0" aria-live="polite">
        <div class="tagrow"><span class="mono">${esc(c.deck.name)} · ${esc(c.deck.lec.split("·")[0].trim())}</span>${c.x?'<span class="star">★ exam topic</span>':""}</div>
        <div class="q">${c.q}</div>
        ${s.shown?`<div class="answer fade">${c.a}</div>`:`<div class="hint">Answer in your head, then tap to reveal</div>`}
      </article>
      <div class="grade">${s.shown
        ?`<button class="no" id="no" type="button">Didn't know</button><button class="yes" id="yes" type="button">Knew it</button>`
        :`<button class="reveal" id="rev" type="button">Show answer</button>`}</div>
      <div class="kbd">Space: show answer · ← didn't know · → knew it</div>`;
    app.querySelector("#back").onclick=home;
    app.querySelector("#card").onclick=()=>{ if(!s.shown){s.shown=true;card();} };
    const rev=app.querySelector("#rev"); if(rev) rev.onclick=()=>{s.shown=true;card();};
    const no=app.querySelector("#no"); if(no) no.onclick=()=>grade("m");
    const yes=app.querySelector("#yes"); if(yes) yes.onclick=()=>grade("k");
  }

  function grade(v){
    const s=session, c=s.cards[s.i];
    state.marks[c.id]=v; save();
    s.res[v]++; if(v==="m") s.missed.push(c);
    s.i++; s.shown=false;
    if(s.i>=s.cards.length) done(); else { card(); window.scrollTo(0,0); }
  }

  function done(){
    const s=session;
    app.innerHTML=`
      <div class="topbar"><button class="back" id="back" type="button">← Topics</button><span class="mono">${esc(s.label)}</span></div>
      <section class="done">
        <h2>Round finished</h2>
        <div class="nums"><div style="background:var(--good-soft);color:var(--good)"><b>${s.res.k}</b>knew it</div><div style="background:var(--bad-soft);color:var(--bad)"><b>${s.res.m}</b>to repeat</div></div>
        <div class="actions">
          ${s.missed.length?`<button class="btn primary" id="again" type="button">Repeat the ${s.missed.length} I missed</button>`:`<p class="note">You knew every card in this round.</p>`}
          <button class="btn" id="home" type="button">Back to topics</button>
        </div>
      </section>`;
    app.querySelector("#back").onclick=home;
    app.querySelector("#home").onclick=home;
    const a=app.querySelector("#again"); if(a) a.onclick=()=>start(s.missed,"Repeat missed");
  }

  document.addEventListener("keydown",e=>{
    if(!session || session.i>=session.cards.length) return;
    if(e.target.closest && e.target.closest("button") && (e.key===" "||e.key==="Enter")) return;
    if(e.key===" "||e.key==="Enter"){ if(!session.shown){e.preventDefault();session.shown=true;card();} }
    else if(session.shown && (e.key==="ArrowLeft"||e.key==="1")) grade("m");
    else if(session.shown && (e.key==="ArrowRight"||e.key==="2")) grade("k");
  });

  home();
})();
</script>
