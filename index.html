{x:1,q:"What is the main problem with sol-gel films (spin or dip coating), what causes it, and how is it avoided?",a:`<b>Cracking.</b> Causes:<ul><li>Gel shrinkage from solvent evaporation</li><li>Polymerization and cross-linking of the gel</li><li>Tensile stress from capillary forces</li><li>Thermal expansion mismatch between film and substrate</li></ul>Avoid it by reducing the solvent fraction at solidification and making <b>thinner layers</b> (several coats).`},
{q:"Advantages and disadvantages of sol-gel film deposition.",a:`<b>+</b> simple, cheap, low temperature, handles large or complex shapes (dip), easy to scale, good composition control, homogeneous, wide range of substrates.<br><b>−</b> film thickness limited by cracking, sols have a short lifetime, final densification heat treatment needed.`},
{x:1,q:"Chemical solution deposition: what is the role of heterogeneous vs homogeneous nucleation in getting an epitaxial film?",a:`After the gel is deposited, the final crystal must nucleate.<ul><li><b>Homogeneous</b> nucleation inside the gel gives randomly oriented grains, so a <b>polycrystalline</b> film.</li><li><b>Heterogeneous</b> nucleation at the gel–substrate interface lets the substrate set the orientation, which is needed for <b>epitaxial</b> (textured) growth.</li></ul>`}
]},

{id:"carbon", name:"Carbon nanomaterials", lec:"L15 · CW 6.2", cards:[
{q:"Compare diamond and graphite in hybridization, coordination and properties.",a:`<ul><li><b>Diamond</b>: sp³, tetrahedral, CN 4, 109.5°. 3D network, very hard, wide band gap insulator.</li><li><b>Graphite</b>: sp², trigonal, CN 3, 120° in layers. The p<sub>z</sub> electron is delocalized, so it is (semi)metallic in-plane. Weak van der Waals bonding between layers.</li></ul>Other allotropes: fullerenes, CNTs, graphene, amorphous carbon.`},
{x:1,q:"Use Euler's formula to explain why every fullerene has exactly 12 pentagons.",a:`For a convex polyhedron: <b>V − E + F = 2</b>. Each C has 3 bonds, so E = 3V/2. With p pentagons and h hexagons: F = p + h and 2E = 5p + 6h.<br>Substituting gives <b>p = 12</b>, independent of h.<p class="why">Pentagons are needed to give curvature and close the cage. Hexagons alone make a flat sheet.</p>`},
{x:1,q:"Give the formula for the number of atoms in a fullerene C<sub>a</sub>. How many hexagons do C₆₀ and C₇₀ have?",a:`<b>a = 2(n + 10)</b>, where n is the number of hexagons.<br>C₆₀: n = 20 (+ 12 pentagons). C₇₀: n = 25 (oval "rugby ball" with an equatorial belt of hexagons).`},
{x:1,q:"What is the isolated pentagon rule, and how does chemical bonding explain it?",a:`Every pentagon must be <b>surrounded by hexagons</b>, so no two pentagons share an edge or corner.<p class="why">sp² covalent bonds are directional and prefer 120°. Adjacent pentagons would force strongly strained bond angles and lengths, which is energetically unfavourable.</p>`},
{x:1,q:"Why is C₆₀ the smallest stable fullerene? Consider geometry and bonding.",a:`With 12 pentagons, <b>C₆₀ is the smallest cage where all pentagons are separated by hexagons</b> (isolated pentagon rule). Any smaller cage must have pentagons sharing edges or corners, giving unfavourable strain on the sp² bonds.`},
{x:1,q:"Describe the structure of C₆₀.",a:`A truncated icosahedron ("football"): <b>12 pentagons + 20 hexagons</b>. Each pentagon is surrounded by 5 hexagons. All 60 C atoms are equivalent and highly symmetric (2-, 3- and 5-fold axes). C–C angles are close to 120°.<br>Discovered in 1985 by Curl, Smalley and Kroto (Nobel Prize in Chemistry 1996).`},
{x:1,q:"How are fullerenes synthesized and isolated?",a:`<b>Arc discharge</b> (a PVD method): two graphite rods in about 200 torr <b>He</b>. The current heats the contact point to 2500–3000 °C and carbon evaporates. Soot condenses on water-cooled walls and contains up to about 15 % fullerenes (≈ 13 % C₆₀, 2 % C₇₀).<br>Extract the soluble fullerenes with a solvent, then separate them by <b>chromatography</b>.`},
{q:"How does gel permeation chromatography separate fullerenes?",a:`By <b>molecular size</b>. Porous beads in a column: <b>large molecules</b> can't enter the pores, pass between the beads and elute <b>first</b>. Small molecules enter the pores and travel slower.<br>Important parameters: pore size and bead size.`},
{x:1,q:"Name applications of fullerenes and of carbon nanotubes.",a:`<b>Fullerenes</b>: drug delivery, antiviral agents, antioxidants (skin creams), solar cells, protective eyewear, H₂ storage, molecular optoelectronics.<br><b>CNTs</b>: composites (e.g. XC skis), transistors, sensors, battery electrodes, Vantablack, membranes for desalination.`},
{q:"SWCNT vs MWCNT. Who discovered CNTs, and when?",a:`<ul><li><b>SWCNT</b>: a single rolled-up graphene cylinder</li><li><b>MWCNT</b>: several concentric graphene cylinders</li></ul>Diameter: a few nm. Length: up to several µm. Iijima in 1991 (on an arc-discharge cathode). SWCNTs followed in 1993.`},
{x:1,q:"How is the structure of a SWCNT related to graphene? Define the chiral vector.",a:`A SWCNT is a graphene sheet <b>rolled up</b> along a direction given by the <b>chiral (roll-up) vector C<sub>h</sub> = n·a₁ + m·a₂</b> (n, m integers; a₁, a₂ the graphene unit vectors).<br>Diameter d = |C<sub>h</sub>|/π. The structure (n, m) determines the electronic properties.`},
{x:1,q:"Name the three SWCNT geometries with their (n, m) and chiral angle.",a:`<ul><li><b>Armchair</b>: n = m, θ = 30°</li><li><b>Zigzag</b>: m = 0, θ = 0°</li><li><b>Chiral</b>: n ≠ m, 0 &lt; θ &lt; 30°</li></ul>`},
{x:1,q:"When is a SWCNT metallic? What fraction are metallic?",a:`Metallic when <b>2n + m = 3q</b> (q an integer), which is equivalent to (n − m) divisible by 3. Otherwise semiconducting.<br>About <b>1/3 metallic, 2/3 semiconducting</b>. Armchair tubes are always metallic.`},
{x:1,q:"Classify and predict conductivity: (6,6), (8,0), (9,0), (7,4), (6,4).",a:`<ul><li>(6,6): armchair, <b>metallic</b></li><li>(8,0): zigzag, 2·8 + 0 = 16, <b>semiconducting</b></li><li>(9,0): zigzag, 18 = 3·6, <b>metallic</b></li><li>(7,4): chiral, 18, <b>metallic</b></li><li>(6,4): chiral, 16, <b>semiconducting</b></li></ul>`},
{x:1,q:"Describe the mechanical and electrical properties of CNTs qualitatively.",a:`<b>Mechanical</b>: extremely high tensile strength and Young's modulus along the axis (sp² σ bonds, comparable to or above diamond). Low density and flexible.<br><b>Electrical</b>: metallic or semiconducting depending on chirality. Very high mobility and ballistic transport. High thermal conductivity. Strongly anisotropic.`},
{x:1,q:"List the three main CNT synthesis methods with key conditions.",a:`<ul><li><b>Arc discharge</b>: graphite electrodes, about 20 V and 50–100 A, 2000–3000 °C. MWCNTs grow on the water-cooled cathode; metal catalyst is needed for SWCNTs.</li><li><b>Laser ablation</b>: graphite target with about 1 % Co/Ni in a 1200 °C furnace, Ar at about 500 Torr. Mainly <b>SWCNTs</b>, collected on a cold finger.</li><li><b>CVD / PECVD</b>: hydrocarbons (CH₄, CO, C₂H₂) cracked by heat or plasma on Fe/Co/Ni catalyst particles. Allows aligned growth on substrates.</li></ul>`},
{x:1,q:"Tip-growth vs base-growth of CNTs: what determines which occurs?",a:`<ul><li><b>Tip growth</b>: <b>weak</b> catalyst–substrate interaction. Hydrocarbon decomposes on top of the particle, carbon diffuses through it (supersaturation) and precipitates below, pushing the particle up. Growth stops when the metal is covered with carbon.</li><li><b>Base growth</b>: <b>strong</b> catalyst–substrate interaction. Carbon precipitates as a dome on top and extends upward, and the particle stays rooted at the base.</li></ul>`},
{x:1,q:"Design a synthesis of an ordered array of vertically aligned CNTs with controlled position, diameter and height.",a:`<ol><li><b>Catalyst pattern</b>: use lithography (e.g. EBL or photolithography + lift-off) to place Fe/Ni/Co dots (PVD or sputtering), or dewet a thin film by heating. The pattern sets <b>position and spacing</b>, and particle size sets <b>diameter</b>. Small particles favour SWCNTs.</li><li><b>Growth</b>: (PE)CVD with a hydrocarbon precursor (CH₄, C₂H₂). Carbon dissolves into the catalyst and precipitates as a tube (VLS-like). The plasma gives reactive radicals, a lower growth T and better alignment.</li><li><b>Height</b>: set by growth time. Stop by removing the precursor.</li></ol>If no catalyst is visible on the tops, the tubes grew by base growth.`},
{x:1,q:"What general method can produce both fullerenes and CNTs? Mention important conditions.",a:`<b>Arc discharge</b> with graphite electrodes (or another carbon source): high current, very high temperature at the arc, inert gas (He or Ar) at controlled low pressure, and high purity. A metal catalyst gives SWCNTs.`},
{q:"What are carbon nanocones, and what determines their geometry?",a:`Graphene with one or more <b>60° wedges</b> cut out and closed into a cone. They form as a by-product of carbon black production (CₙHₘ → nC + m/2 H₂ in a plasma at about 1600 °C).<br><b>The number of pentagons at the tip equals the number of 60° wedges removed</b>, so only specific apex angles are possible.`}
]},

{id:"twod", name:"Graphene & 2D materials", lec:"L16 · CW 5–6", cards:[
{x:1,q:"Describe the crystal structure of graphene.",a:`A one-atom-thick <b>2D hexagonal honeycomb</b> lattice of sp²-bonded C. 120° bond angles, CN 3, <b>2 atoms per unit cell</b>.`},
{x:1,q:"Explain how chemical bonding gives graphene its anisotropic electrical and mechanical properties (compare with diamond).",a:`<ul><li><b>In-plane sp² σ bonds</b> (strong, covalent): exceptional strength and stiffness</li><li>The singly occupied <b>p<sub>z</sub> orbital</b> forms delocalized π bands, giving <b>high conductivity</b> and very high mobility</li><li><b>Weak van der Waals</b> bonds out of plane (between sheets): low stiffness and poor conduction along z</li></ul>Diamond has sp³ bonds in 3D corner-sharing tetrahedra: isotropic, insulating and hard.`},
{x:1,q:"Describe the electronic properties of graphene.",a:`A <b>semimetal</b> (zero-gap semiconductor). The valence and conduction bands touch at the <b>Dirac cones</b>, which are linear and steep. That gives a very small effective mass, <b>extremely high mobility</b> and ballistic transport. It is easily doped n- or p-type, and its polarity can be changed by local fields.`},
{x:1,q:"Name two outstanding physical properties of graphene.",a:`In-plane <b>mechanical strength</b> ("stronger than steel"; flexible) and <b>electrical conductivity / electron mobility</b>. Also high thermal conductivity and a wide optical absorption range.`},
{q:"How was graphene first isolated, and what happened with twisted bilayers?",a:`2004: Geim and Novoselov used the "scotch tape" mechanical exfoliation of graphite and transferred single layers onto a substrate (Nobel Prize in Physics 2010).<br>2018: twisted bilayer graphene at a "magic angle" of about 1.1° shows superconductivity. The moiré period is λ = a / (2 sin(θ/2)), so 1.1° gives λ ≈ 52a.`},
{q:"Why is '2D' not strictly correct? What is the preferred term?",a:`The material has a finite thickness and exists in 3D space. Only its <b>periodicity</b> is two-dimensional, so the preferred term is a <b>subperiodic</b> structure.`},
{x:1,q:"What is unique about 2D materials compared with a very thin layer of a bulk material?",a:`<ul><li><b>No dangling bonds</b> on the surfaces (layers are saturated), and only weak van der Waals bonds between layers, so single layers can be exfoliated</li><li><b>Electrons are confined in the plane</b>, giving highly anisotropic properties</li><li>Easy chemical/surface tailoring and electronic tailoring by the number of layers</li><li>Unique quantum properties: topological insulators, quantum Hall effect</li></ul>`},
{x:1,q:"What type of chemical bonding must be present in 2D materials, and why?",a:`<b>Covalent bonding within the layers</b>, because covalent bonds are <b>directional</b> and can stabilize a strongly anisotropic layered structure. Metallic and ionic bonds are non-directional. Between layers the bonding is <b>van der Waals</b> (sometimes weakly ionic).`},
{x:1,q:"Why do many 2D materials have hexagonal symmetry?",a:`sp² covalent bonding prefers 120° angles, which favours hexagonal (honeycomb) layers, and close packing in 2D is hexagonal (important for partly metallic or ionic layers).`},
{q:"How are 2D materials classified?",a:`<ul><li><b>Layered van der Waals solids</b>: graphene, h-BN, transition metal chalcogenides</li><li><b>Surface-assisted, non-layered solids</b> grown on a substrate: Xenes (silicene, germanene), which have stability issues</li><li><b>Layered ionic solids</b>: oxides, perovskites</li></ul>`},
{x:1,q:"What makes hexagonal boron nitride (h-BN) special as a 2D material?",a:`It has the same honeycomb structure as graphene but is a <b>wide band gap insulator</b> (about 5–6 eV, a white compound) and very stable. Most other 2D materials are metallic or small-gap semiconductors. It is used as a dielectric and as a substrate for other 2D materials.`},
{x:1,q:"How can C contamination make h-BN p-type or n-type?",a:`<ul><li>C on an <b>N</b> site (C has one fewer electron than N): <b>acceptor</b>, giving <b>p-type</b></li><li>C on a <b>B</b> site (C has one more electron than B): <b>donor</b>, giving <b>n-type</b></li></ul>`},
{x:1,q:"Transition metal dichalcogenides (TMDs): give examples and describe the structure.",a:`MX₂ such as <b>MoS₂</b>, MoSe₂, MoTe₂, WS₂, WSe₂. Strong covalent M–X bonds within each layer and weak van der Waals bonds between layers.<br>Polytypes: <b>1H/2H trigonal prismatic</b> (semiconducting) and <b>1T octahedral</b> (metallic).`},
{q:"How does the band gap of MoS₂ change with the number of layers?",a:`From an <b>indirect</b> band gap in bulk or multilayers to a <b>direct</b> band gap in a monolayer. This makes it interesting for optoelectronics and transistors (high mobility, but interfaces matter a lot).`},
{q:"Relate band curvature to effective mass and mobility.",a:`For a free electron, E = ħ²k²/2m (parabolic). In real bands, 1/m* = (1/ħ²)·d²E/dk², and mobility μ = eτ/m*.<ul><li><b>Steep, strongly curved bands</b>: small m*, "light" electrons, high mobility (e.g. graphene Dirac cones)</li><li><b>Flat bands</b>: heavy, localized electrons (d and f electrons)</li></ul>`},
{q:"What are reciprocal space and the first Brillouin zone?",a:`The wavevector k lives in <b>reciprocal space</b> (units of inverse length), which is what diffraction experiments observe. The <b>first Brillouin zone</b> is the primitive unit cell of the reciprocal lattice. Band structures are plotted along its high-symmetry points.`},
{q:"What is a topological insulator?",a:`An insulator in the bulk with "protected", <b>dissipation-free conducting states at its surface</b> (or edges). Magnetic topological insulators, which would carry spin currents without dissipation, are a current "holy grail".`},
{x:1,q:"What is exfoliation? Give examples, with pros and cons.",a:`Separating single or few sheets from a layered bulk crystal.<ul><li><b>Mechanical</b> (scotch tape): easy, high quality, low yield. Depends on interlayer surface energy.</li><li><b>Liquid/chemical</b>: <b>intercalate</b> ions or molecules between layers, then <b>sonicate</b>. Scalable, but destructive, giving smaller flakes.</li></ul>`},
{q:"Besides exfoliation, how are 2D materials synthesized?",a:`<ul><li><b>CVD</b>: scalable, with control of termination (e.g. graphene on Cu foil by LPCVD)</li><li><b>Epitaxial growth from vapour</b> (MBE, sputtering, PLD): often a few layers thick; stoichiometry is difficult because of different vapour pressures</li></ul>`}
]},

{id:"special", name:"Epitaxy, porous & core–shell", lec:"L17 · CW 6", cards:[
{q:"Define epitaxy. Homoepitaxy vs heteroepitaxy?",a:`A <b>crystalline film growing on a crystalline substrate</b> with a defined orientation relationship (Greek: epi = above, taxis = order).<ul><li><b>Homoepitaxy</b>: same material (e.g. for purification, or doped layers for p–n junctions)</li><li><b>Heteroepitaxy</b>: different materials. This is the general case, and it can impose <b>strain</b> on the film.</li></ul>`},
{x:1,q:"Define misfit strain. When is it compressive and when tensile?",a:`<b>ε = (a<sub>sub</sub> − a<sub>film</sub>) / a<sub>film</sub></b><ul><li><b>Compressive</b>: ε &lt; 0, a<sub>sub</sub> &lt; a<sub>film</sub></li><li><b>Tensile</b>: ε &gt; 0, a<sub>sub</sub> &gt; a<sub>film</sub></li></ul>`},
{x:1,q:"What is epitaxial strain, and what happens to a film under compressive or tensile strain?",a:`Elastic strain from the lattice mismatch across a <b>coherent</b> interface. The film adopts the substrate's <b>in-plane</b> lattice parameter.<ul><li>Compressive in-plane: the out-of-plane parameter <b>elongates</b></li><li>Tensile in-plane: the out-of-plane parameter <b>contracts</b></li></ul>`},
{x:1,q:"What is the critical thickness, and how does it depend on misfit?",a:`The thickness above which it becomes favourable to <b>relax the strain by forming misfit dislocations</b>. Below it the film is coherently strained.<br>It is <b>inversely related to the misfit</b>. At more than about 10 % misfit, h<sub>c</sub> is less than a monolayer and the film grows fully relaxed.`},
{x:1,q:"Which structural and chemical mechanisms can accommodate epitaxial strain?",a:`<ul><li>Changes in <b>bond lengths and bond angles</b> (in perovskites, <b>rotation/tilting of the oxygen octahedra</b>)</li><li>Change of <b>crystal symmetry</b> or phase</li><li><b>Dislocations</b> (misfit, line defects)</li><li><b>Point defects</b>: anion (oxygen) and cation vacancies</li><li><b>Segregation</b> of elements or dopants</li></ul>`},
{x:1,q:"What are possible consequences of epitaxial strain for a film's properties?",a:`Changed bond angles and lengths can change the crystal structure and symmetry, shift physical properties and induce <b>phase transitions</b> (e.g. to or from ferroelectric order). Strain can also create misfit dislocations, point defects or segregation.`},
{q:"Give examples of strain engineering from the lecture.",a:`<ul><li><b>BaTiO₃</b> under compressive strain: ferroelectric T<sub>C</sub> increases strongly</li><li><b>SrTiO₃</b> (paraelectric in bulk) under tensile strain on DyScO₃: ferroelectric at room temperature</li><li><b>La₂₋ₓSrₓCuO₄</b> with about 0.5 % compression on SrLaAlO₄: superconducting T<sub>C</sub> almost doubles (≈ 49 K)</li><li><b>SrRuO₃</b>: tensile strain increases resistivity, compressive decreases it</li></ul>`},
{q:"Domain-matching epitaxy and selective epitaxial growth: what are they?",a:`<ul><li><b>Domain matching</b>: integral multiples of lattice planes match even when the misfit is very large (e.g. nitrides on Si with about 22.5 % misfit)</li><li><b>Selective epitaxy</b>: nucleation, and therefore growth, happens only on the Si areas and not on the dielectric. Widely used in electronics.</li></ul>`},
{q:"Why does tensile strain promote oxygen vacancies in oxides like CaMnO₃? (chemical expansion)",a:`Each oxygen vacancy leaves two electrons that reduce Mn⁴⁺ (0.53 Å) to the <b>larger</b> Mn³⁺ (0.645 Å), so vacancies expand the lattice locally. A lattice already stretched by tensile strain accommodates the larger ions more easily, so the <b>vacancy formation energy decreases</b>.`},
{x:1,q:"Classify porous materials by pore diameter.",a:`<ul><li><b>Microporous</b>: d &lt; 2 nm (zeolites)</li><li><b>Mesoporous</b>: 2–50 nm (MCM-41, xerogels)</li><li><b>Macroporous</b>: d &gt; 50 nm</li></ul>`},
{x:1,q:"Explain how surfactants are used to make ordered mesoporous materials.",a:`<ol><li><b>Template</b>: surfactant concentration well <b>above the CMC</b>. The concentration and water/oil ratio decide whether you get spherical micelles, cylinders (hexagonal), lamellae or onions.</li><li><b>Sol-gel</b>: an inorganic precursor (e.g. TEOS) hydrolyses and condenses <b>around</b> the template.</li><li><b>Remove the template</b> by calcination (burning off the organics) or solvent extraction, leaving ordered pores.</li></ol>Result: uniform pores, pore volume up to about 70 %, surface area &gt; 700 m²/g.`},
{q:"What are MCM-41 and MCM-48, and what are mesoporous materials used for?",a:`The first ordered mesoporous materials (Mobil):<ul><li><b>MCM-41</b>: silica with a hexagonal array of 1D pores, 1.5–10 nm</li><li><b>MCM-48</b>: aluminosilicate with a 3D pore system, about 3 nm</li></ul>Uses: catalyst supports, adsorbents, molecular sieves, nanoscale reactors. A patterned substrate can even set the pore structure (epitaxy in mesoporous films).`},
{q:"What are zeolites, and how are they made?",a:`<b>Crystalline aluminosilicates</b> with a 3D framework of TO₄ tetrahedra and uniform <b>molecular-size pores</b> (microporous). Ring size sets the pore size: 8-ring ≈ 0.41 nm, 10-ring ≈ 0.55 nm, 12-ring ≈ 0.74 nm.<br>Made by <b>hydrothermal synthesis</b> (pressurized water above 100 °C) with water, a silica source, an alumina source, a <b>mineralizing agent</b> (OH⁻ or F⁻) and a <b>structure-directing agent</b> (organic template).`},
{x:1,q:"How are silica-coated Au nanoparticles (Au@SiO₂) made, and why is a functionalization step needed?",a:`<ol><li>Au nanoparticles by citrate reduction of HAuCl₄ (about 20 nm).</li><li><b>Functionalize with APS</b> ((3-aminopropyl)trimethoxysilane). Au has no passivating oxide or –OH groups, so silica won't bind directly. The amine lone pair anchors to Au and the methoxysilane end is left free.</li><li>Grow the <b>silica shell</b> by sol-gel (Stöber-type) condensation onto the silane groups.</li></ol>`},
{x:1,q:"Outline routes to core–shell particles: (a) metal@metal, (b) metal@oxide, (c) hollow oxide shell.",a:`<ul><li>(a) Colloidal synthesis of the core metal, then reduce the second metal onto it under conditions that favour heterogeneous nucleation (or PVD/CVD of the core, then the shell)</li><li>(b) Colloidal metal core, then sol-gel, CVD or PVD of the oxide nucleating on the core (often with a coupling agent)</li><li>(c) Make a core that dissolves more easily than the shell oxide, coat it, then <b>leach out the core</b></li></ul>`},
{q:"Why make core–shell particles at all?",a:`To protect or stabilize the core (against oxidation, agglomeration or dissolution), <b>combine functions</b> (e.g. magnetic core + optical or catalytic shell), save expensive elements (only the catalytic surface uses Pt), tune optical (plasmonic) properties, and use the shell as an epitaxial "thin film" with an engineered lattice.`},
{q:"Outline the Au–Ag binary nanoparticle synthesis from the lecture.",a:`<ol><li>Au core by sodium citrate reduction.</li><li>Deposit Ag by reducing silver nitrate.</li><li>Add HAuCl₄ in the presence of CTAB, which forms a shell of an Au–Ag alloy.</li></ol>`}
]},

{id:"litho", name:"Lithography, soft litho & SPM", lec:"L8 · L18 · L21–22 · CW 7", cards:[
{q:"What is the common principle of lithography, and why is it needed?",a:`Transfer of a <b>pattern from a sacrificial layer (resist)</b> to the material. Plain layers don't make a device. Patterning creates components (transistors, sensors) and new functionality (metamaterials, photonic crystals).`},
{x:1,q:"Classify lithography techniques by the radiation used.",a:`<ul><li><b>Photons</b>: photolithography (UV, DUV, EUV), X-ray lithography</li><li><b>Electrons</b>: electron beam lithography (EBL)</li><li><b>Ions</b>: focused ion beam (FIB)</li><li>Also: imprint (mechanical, hard mould) and near-field (tip–resist interaction)</li></ul>`},
{q:"What two parts make up a resist?",a:`<ul><li><b>Matrix</b>: insensitive to the radiation; provides the mechanical properties</li><li><b>Active component</b>: sensitive to the radiation; changes the dissolution rate and defines the pattern</li></ul>`},
{x:1,q:"Positive vs negative resist?",a:`<ul><li><b>Positive</b>: exposure makes it <b>more soluble</b> (chain scission), so the developer removes the exposed areas. The pattern is the <b>same as the mask</b>.</li><li><b>Negative</b>: exposure makes it <b>less soluble</b> (cross-linking, hardening), so the developer removes the unexposed areas. The pattern is the <b>inverse of the mask</b>.</li></ul>`},
{q:"List the photolithography process steps.",a:`Clean wafer + adhesion promoter, spin-coat resist, soft bake (90–100 °C), expose through a mask, (post-exposure bake), develop, hard bake (more resistant to etchants), then etch or deposit, and finally strip the resist.`},
{q:"Contact vs proximity vs projection printing: pros and cons.",a:`<ul><li><b>Contact</b>: simple, cheap, good resolution (not limited by diffraction). But the mask degrades and contamination defects occur.</li><li><b>Proximity</b>: less mask damage and contamination, but poorer resolution from diffraction.</li><li><b>Projection</b>: a lens images (and reduces) the mask. Highest resolution, no mask damage. But only small areas at a time, and focus errors can occur.</li></ul>`},
{q:"What limits resolution in projection lithography, and how has industry improved it?",a:`Rayleigh: <b>R = k₁λ/NA</b>, depth of focus DOF = k₂λ/NA². Better resolution means less depth of focus.<br>Shorter wavelengths over time: Hg lamps (436, 365 nm), excimer lasers (KrF 248 nm, ArF 193 nm), EUV (13.5 nm). Also phase-shift masks and immersion lithography.`},
{q:"X-ray lithography: wavelength, mask design and how the resist is exposed.",a:`λ ≈ 0.01–10 nm, so far less diffraction (first used with proximity printing).<br>Mask: a thin (&lt; 2 µm) <b>low-Z membrane</b> (SiC) is transparent, and a <b>high-Z absorber</b> (Au, W, Ta) forms the pattern.<br>Absorbed X-rays create <b>photoelectrons</b>, and those drive the chemistry in the resist.`},
{x:1,q:"Electron beam lithography: principle, pros, cons and use.",a:`A focused electron beam <b>writes</b> the pattern directly in an electron-sensitive resist (PMMA, positive).<ul><li>+ <b>Highest resolution</b> of the methods covered; <b>maskless</b> (computer-controlled, flexible)</li><li>− <b>Slow</b>: sequential writing</li></ul>Used for making <b>masks</b> for optical lithography, and for R&amp;D. Resolution is limited by electron scattering in the resist and substrate (proximity effect), not by diffraction.`},
{x:1,q:"Which radiation gives (a) the best lithographic resolution and (b) the fastest and cheapest patterning of large areas?",a:`(a) <b>Electrons</b> (EBL)<br>(b) <b>Photons</b> (photolithography through a mask)`},
{q:"What is lift-off?",a:`Pattern the resist (e.g. by EBL), deposit metal over everything, then dissolve the resist. The metal on top of the resist lifts off, and only metal in the exposed openings remains.`},
{q:"Focused ion beam: ion source and three operating modes.",a:`<b>Liquid metal ion source</b>: a W tip wetted by liquid Ga (melting point ≈ 30 °C). A high field (about 15 V/nm) pulls it into a <b>Taylor cone</b> that emits ions.<ol><li><b>Imaging</b> from secondary electrons</li><li><b>Milling</b>: a high-current beam removes material</li><li><b>Deposition</b>: CVD-like. The ion beam decomposes adsorbed precursor gas locally.</li></ol>Also used to cut TEM lamellae. Drawbacks: damage (amorphization), Ga implantation, slow.`},
{x:1,q:"What is soft lithography? Name the three main types.",a:`Non-photolithographic micro/nanofabrication using an <b>elastomer</b> (mechanically soft, e.g. <b>PDMS</b>) or an AFM tip. Well suited to polymers, gels and organic monolayers.<ol><li><b>Microcontact printing (µCP)</b></li><li><b>Nanoimprint lithography (NIL)</b></li><li><b>Dip-pen nanolithography (DPN)</b></li></ol>`},
{x:1,q:"Describe microcontact printing.",a:`<ol><li>Cast and cure PDMS on a <b>master</b> (made by photolithography) to make a stamp.</li><li>"Ink" the stamp with SAM molecules (e.g. alkanethiol).</li><li>Press it onto the substrate (e.g. Au). The thiols chemisorb (Au–S) only where the stamp touches.</li></ol>The SAM pattern then serves as an etch mask or template. Works with flat or rolling stamps and on curved substrates.`},
{x:1,q:"Describe nanoimprint lithography.",a:`Mechanical deformation of a resist, like a waffle iron:<ol><li>Spin-coat a thermoplastic (PMMA, polycarbonate).</li><li>Press the mould in at a temperature <b>above T<sub>g</sub></b>.</li><li>Cool and remove the mould.</li><li>Remove the thin <b>residual layer</b> by anisotropic etching, then transfer the pattern (etch or lift-off).</li></ol>Cheap, high throughput and high resolution.`},
{x:1,q:"Describe dip-pen nanolithography.",a:`An <b>AFM tip</b> is the "pen" and a molecular solution (e.g. octadecanethiol, ODT) is the "ink". Water condenses into a <b>meniscus</b> between tip and substrate, molecules are transported through it, and <b>chemisorption</b> drives their transfer to the substrate. Dot size grows with contact time (r ∝ √t).<br>+ ambient conditions, AFM-level resolution, "write and read" with the same tip, many ink types.`},
{x:1,q:"Give one advantage and one typical application for each soft lithography type.",a:`<ul><li><b>µCP</b>: cheap and scalable over large areas. Printing SAMs for sensors or biochips.</li><li><b>NIL</b>: high resolution, cheap, high throughput. Microfluidics, lab-on-a-chip, large-area optoelectronic patterns.</li><li><b>DPN</b>: flexible, ambient, high resolution, but slow. Prototyping, testing patterns, fundamental science.</li></ul>For <b>developing</b> a pattern, choose DPN. For <b>mass production</b>, choose µCP or NIL (the mould takes time to make, then copying is fast).`},
{q:"SPM history: who invented STM and AFM, and when?",a:`STM: 1981, Binnig and Rohrer (IBM). Nobel Prize 1986, shared with Ruska (electron microscope). AFM: 1986, Binnig, Quate and Gerber.`},
{x:1,q:"Explain the principle of STM. Why is its vertical resolution so good?",a:`A sharp <b>conducting</b> tip (W or Pt–Ir) on a piezo scanner is held 0.2–0.6 nm above a <b>conducting</b> sample, and electrons <b>tunnel</b> between them (0.1–10 nA).<br>I ∝ exp(−2κz): the current changes about <b>10× per Å</b>, giving atomic resolution (≈ 0.01 nm in xy, 0.002 nm in z).<br>Modes: <b>constant current</b> (feedback adjusts height, most common) or constant height (faster, needs very flat samples). Example: Si(111) 7×7 in UHV.`},
{x:1,q:"Explain the principle of AFM and its modes. What can it do that STM can't?",a:`A cantilever with a sharp tip (Si or SiN) is scanned over the surface. Tip–sample forces bend the cantilever, and a <b>laser</b> reflected onto a photodiode measures the deflection. Usually the force is kept constant by feedback.<br><b>It works on insulators</b> (STM needs conducting samples).<ul><li>Contact (repulsive regime): high resolution but can damage soft samples</li><li>Non-contact (attractive): shift in resonance frequency</li><li>Tapping: brief contact once per oscillation, good for soft or biological samples</li></ul>`},
{x:1,q:"Name AFM/SPM variants for local functional properties.",a:`<ul><li><b>cAFM</b> (conductive AFM): local electrical conductivity</li><li><b>PFM</b> (piezoresponse force microscopy): ferroelectric domains</li><li><b>MFM</b> (magnetic force microscopy) or spin-polarized STM: magnetic structure</li><li>Also SNOM (near-field optical), scanning SQUID, scanning thermal microscopy</li></ul>`},
{x:1,q:"How can scanning probe microscopes be used for nanomanipulation? Give examples.",a:`They can push, pull or slide atoms, molecules, nanoparticles and wires into patterns that self-assembly can't make, or locally write, oxidize, reduce or deposit to create metastable structures.<ul><li>IBM 1990: 35 Xe atoms positioned on Ni by STM (4 K, UHV)</li><li>Quantum corral: a ring of Fe atoms on Cu(111) traps surface electrons as standing waves</li><li>STM chemistry: two C₆H₅ radicals from iodobenzene joined into biphenyl</li><li>AFM pushing a 30 nm Au particle; cyclo[18]carbon made by removing CO groups</li></ul>`},
{x:1,q:"What forces drive the self-assembly of nanoparticles?",a:`Hydrophobic/hydrophilic interactions, <b>electrostatic</b> forces, <b>capillary</b> forces, chemisorption, <b>van der Waals</b> forces and magnetic interactions.`},
{x:1,q:"How do capillary forces drive self-assembly? Describe template-assisted self-assembly (TASA).",a:`A liquid meniscus bridges particles, and its surface tension pulls them together into close-packed structures once the liquid film becomes thinner than the particle diameter.<br><b>TASA</b>: a colloid of spheres (e.g. polystyrene) flows through a fluidic cell over a template with holes (patterned photoresist). As the liquid front recedes, capillary forces push the spheres into the holes. The <b>hole/sphere diameter ratio D/d</b> sets the cluster size (single, dimer, trimer …).`},
{q:"What is the 2D electron gas at the LaAlO₃/SrTiO₃ interface?",a:`Two insulators (LAO, E<sub>g</sub> 5.6 eV; STO, 3.2 eV) give a <b>conducting interface</b> when LAO is grown epitaxially on TiO₂-terminated STO (for more than about 4 unit cells).<br>STO has neutral layers, while LAO has ±1 charged layers. This <b>polar discontinuity</b> would make the potential diverge (the "polar catastrophe"). It is avoided by <b>electronic reconstruction</b>: 0.5 e⁻ per unit cell moves to the interface (Ti⁴⁺ → Ti³·⁵⁺), giving an n-type 2DEG.`},
{q:"What are ferroelectric domain walls, and why can charged walls conduct?",a:`The boundary between domains with different polarization direction. It is only a few unit cells thick, a natural 2D nano-object.<br><b>Charged walls</b> (head-to-head or tail-to-tail) need screening charge. Head-to-head walls attract electrons, and tail-to-tail walls attract holes or oxygen vacancies. So their conductivity differs from the domains, and they can be written, moved and erased by electric fields for reconfigurable nanoelectronics.`}
]},

{id:"char", name:"Characterization", lec:"L19–L20 · CW 8", cards:[
{q:"What is the general requirement for characterizing at the nanoscale? Which two approaches exist?",a:`You must use a <b>probe on the same length scale</b> as the property you want to measure.<ol><li><b>Natural nanosized probes</b>: electromagnetic radiation (X-rays), particles (electrons, neutrons, ions)</li><li><b>Miniaturized probes</b>: SPM (AFM, STM)</li></ol>`},
{q:"What three kinds of experiment can X-rays be used for?",a:`<ul><li><b>Microscopy</b>: imaging</li><li><b>Diffraction / scattering</b>: interference of waves gives structure</li><li><b>Spectroscopy</b>: intensity vs wavelength or energy (e.g. XPS, characteristic X-rays)</li></ul>`},
{x:1,q:"Name three advantages of synchrotron X-rays over a lab diffractometer.",a:`<ul><li><b>Much higher brilliance</b>, so data that takes days in the lab takes minutes at a synchrotron</li><li><b>Extreme time resolution</b> (down to ns–ps), enabling in situ and time-resolved studies (e.g. hydrothermal synthesis)</li><li><b>Tunable wavelength</b>, enabling a range of techniques</li></ul>Plus higher resolution.`},
{x:1,q:"WAXS/XRD vs SAXS vs PDF: what does each tell you?",a:`<ul><li><b>WAXS / XRD</b>: <b>average long-range</b> atomic structure, lattice parameters, phases, crystallite size</li><li><b>SAXS</b> (2θ &lt; about 5°): <b>particle size and shape/morphology</b> (also of amorphous particles, proteins, pores)</li><li><b>PDF</b> (total scattering): <b>average local</b> atomic structure, disorder, amorphous phases</li></ul>`},
{q:"Give Bragg's law and the Laue condition, and how Q relates to d.",a:`<b>Bragg</b>: 2d sin θ = nλ. Constructive interference from planes spaced d apart.<br><b>Laue</b>: Q = G<sub>hkl</sub>. Diffraction happens when the scattering vector equals a reciprocal lattice vector.<br>|Q| = 4π sin θ / λ = 2π/d<sub>hkl</sub>`},
{x:1,q:"What three types of information does each Bragg peak in XRD give?",a:`<ul><li><b>Position</b> (2θ): d-spacing, and from that the lattice parameters (and thermal expansion)</li><li><b>Intensity</b> (area): structure factor, so atom types and positions in the unit cell (and thermal vibrations)</li><li><b>Width</b> (FWHM): crystallite size (Scherrer), strain, and instrumental broadening</li></ul>`},
{x:1,q:"What does the Scherrer equation give? What is a common misconception?",a:`<b>D = Kλ / (β cos θ)</b>, where β is the FWHM in radians and K ≈ 1 (shape factor).<br>D is the <b>crystallite size, not the particle size</b>. A particle can contain several crystallites. Strain and the instrument also broaden peaks.`},
{q:"How do you tell cubic from tetragonal symmetry with XRD? Why is it harder for nanoparticles?",a:`Tetragonal (c ≠ a) <b>splits</b> reflections that coincide in cubic, e.g. (100)/(010) vs (001), using d<sub>hkl</sub>.<br>For nanoparticles, <b>size broadening</b> can hide a small splitting (nano BaTiO₃ can look cubic in XRD), so local probes such as PDF are needed.`},
{q:"Write the structure factor. Why are light elements hard to see with X-rays?",a:`F<sub>hkl</sub> = Σ f<sub>i</sub> exp[2πi(hx<sub>i</sub> + ky<sub>i</sub> + lz<sub>i</sub>)], and I ∝ |F|².<br>The X-ray form factor f<sub>i</sub> scales roughly with <b>Z</b> (number of electrons), so light atoms scatter weakly. Oxygen in PbTiO₃ is nearly invisible, and neighbours like Fe and Mn are hard to tell apart.`},
{q:"List the information XRD gives, plus its strengths and weaknesses.",a:`<b>Gives</b>: crystalline phases (peak positions), phase fractions (intensity scaling), crystallite size (Scherrer), stoichiometry (relative intensities). Rietveld refinement fits a full structure model.<br><b>+</b> widely available, easy to use, lots of information.<br><b>−</b> only crystalline material; an <b>average</b> over a large volume (not local); weak for light elements; little chemical information.`},
{x:1,q:"X-rays vs neutrons for diffraction: when do you need neutrons?",a:`<b>Neutrons</b> need a reactor or spallation source and interact weakly (large samples needed). But:<ul><li>The scattering length is <b>not proportional to Z</b> (it varies by isotope), so light elements (H, O, Li) are visible</li><li>Neutrons carry a <b>magnetic moment</b>, so you can see <b>magnetic structures</b></li></ul>Best: use both. X-rays give lattice parameters and heavy atoms, neutrons give oxygen positions.`},
{q:"What is PDF (total scattering) analysis used for?",a:`It uses <b>all</b> the scattering, Bragg peaks plus diffuse scattering (short λ ≈ 0.5 Å), Fourier-transformed into a real-space distribution of interatomic distances. It probes the <b>local structure</b>: disorder, amorphous phases, nanoparticles.<br>Example: nano BaTiO₃ is locally tetragonal even when the long-range structure looks cubic.`},
{q:"SAXS: what samples, and what information (Guinier, Porod)?",a:`Scattering at very small angles (2θ &lt; about 5°) reflects <b>large features</b>. Samples: colloidal nanoparticles, proteins in solution, mesoporous materials, amorphous particles.<ul><li><b>Guinier</b> analysis: radius of gyration, i.e. average particle size</li><li><b>Porod</b> analysis: average shape / aspect ratio</li></ul>`},
{q:"Why are electrons good nanoscale probes? What is their wavelength?",a:`λ = h / √(2m<sub>e</sub>eU), well below 1 nm at typical accelerating voltages.<ol><li>High energy</li><li>Easy to make intense beams</li><li>Easy to manipulate (electromagnetic lenses)</li><li>Interact strongly with matter</li></ol>`},
{x:1,q:"Which electron–matter signals are used in SEM, TEM and STEM, and what does each tell you?",a:`<ul><li><b>Secondary electrons</b> (SEM): topography, 3D-like images</li><li><b>Backscattered electrons</b> (SEM): composition (Z-contrast), grain orientation</li><li><b>Characteristic X-rays</b>: <b>EDS</b> chemical composition</li><li><b>Elastically scattered</b> (TEM): diffraction and imaging, crystal structure, defects</li><li><b>Inelastically scattered</b> (TEM/STEM): <b>EELS</b> chemical composition</li></ul>`},
{q:"SEM: sample requirements, and secondary vs backscattered electrons.",a:`Easier sample prep than TEM (no transmission needed), but the sample must be <b>electrically conductive</b>, or coated (e.g. sputter-coated with Au).<ul><li><b>SE</b>: low energy, from the surface, show <b>topography</b></li><li><b>BSE</b>: from the beam, give <b>Z/composition contrast</b></li></ul>`},
{q:"TEM: sample thickness, diffraction vs image mode, bright vs dark field.",a:`The sample must be <b>very thin</b> (&lt; 100 nm). The intermediate lens chooses whether the <b>diffraction pattern</b> or the <b>image</b> is projected. A selected-area aperture picks the region (SAED). The <b>objective aperture</b> selects the direct beam (<b>bright field</b>) or a diffracted beam (<b>dark field</b>, where grains diffracting into that spot light up).`},
{q:"STEM: how does it differ from TEM, and what do BF and (HA)ADF show?",a:`A focused probe is <b>scanned</b>, and the image is built point by point from the transmitted or diffracted signal.<ul><li><b>BF</b>: weak scatterers (light atoms like O) visible</li><li><b>ADF/HAADF</b>: <b>Z-contrast</b>, so heavy atoms like Sr appear bright</li></ul>Combined with EELS it maps composition with <b>atomic resolution</b>.`},
{x:1,q:"EDS vs EELS: when do you use which?",a:`<ul><li><b>EDS/EDX</b>: characteristic X-rays, in SEM or TEM. Composition over <b>larger areas</b> (µm–mm). Weak for light elements.</li><li><b>EELS</b>: energy lost by transmitted electrons in TEM/STEM (needs a monochromatic beam). <b>Atomic-resolution</b> maps across interfaces, sensitive to light elements and oxidation state.</li></ul>`},
{x:1,q:"Gas adsorption: what does it measure? Compare the Langmuir and BET models.",a:`It measures the <b>specific surface area</b> (m²/g) of powders and porous materials.<ul><li><b>Langmuir</b>: at most one monolayer, all sites equivalent, no interaction between adsorbed molecules</li><li><b>BET</b>: multiple layers, the next layer can start before the first is complete. Each layer follows Langmuir, the first layer has a more negative ΔH<sub>ads</sub>, and higher layers have ΔH<sub>ads</sub> = −ΔH<sub>vap</sub>.</li></ul>`},
{q:"How is surface area obtained from an adsorption isotherm?",a:`<ol><li>Measure the adsorbed volume V at different pressures p (constant T).</li><li>Fit the isotherm (Langmuir: plot p/V vs p; slope = 1/V<sub>mon</sub>).</li><li>Get the number of molecules in one monolayer from V<sub>mon</sub>.</li><li>Multiply by the <b>adsorption cross-section</b> of the gas molecule (must be known, e.g. N₂) to get the total area.</li></ol>`}
]},

{id:"props", name:"Nanoscale properties", lec:"L9 · CW 8", cards:[
{q:"What is a catalyst? Relate it to the Arrhenius equation.",a:`A substance that increases the reaction rate by <b>lowering the activation energy</b> without being consumed.<br>k = A·exp(−E<sub>a</sub>/RT), so a lower E<sub>a</sub> gives an exponentially larger rate constant.`},
{x:1,q:"Explain the Sabatier principle and the volcano plot.",a:`Catalyst–adsorbate binding must be <b>"just right"</b>:<ul><li>Too weak: reactants don't adsorb, so the rate is <b>adsorption-limited</b></li><li>Too strong: products don't desorb and block the sites, so the rate is <b>desorption-limited</b></li></ul>Plotting activity against binding energy gives a <b>maximum</b> (volcano) at intermediate binding. Pt-group metals come out near the top.`},
{x:1,q:"Why are heterogeneous catalysts often nanoparticles?",a:`<ul><li><b>Large surface area</b> per mass, so less of the expensive material (Pt, Pd) is needed</li><li>Many under-coordinated edge, corner and step sites, more likely to give highly active sites</li><li>Core–shell designs put the expensive element only at the surface</li></ul>`},
{x:1,q:"What are finite-size effects on lattice parameters and phase transitions?",a:`<ul><li>Surface relaxation inwards, so nanoparticle lattice parameters <b>contract</b> (metals and covalent; ionic expand)</li><li><b>Phase transitions shift to lower T</b> with decreasing size (melting of Au, the ferroelectric transition in BaTiO₃/PbTiO₃)</li></ul>`},
{q:"How does ferroelectricity change in nanoparticles?",a:`Crystal structure determines ferroelectric properties, and the structure changes at the nanoscale. Ferroelectricity tends to decay through <b>disorder</b> rather than by the displacements disappearing: off-centred Ti⁴⁺ in BaTiO₃ persists locally but the dipoles become disordered. This needs local probes (PDF) to understand.`},
{q:"What is ferromagnetism? Why do magnetic domains form?",a:`<b>Spontaneous alignment</b> of magnetic moments below the Curie temperature T<sub>C</sub>, driven by the <b>exchange energy</b>.<br>Domains form to reduce the stray-field (<b>magnetostatic</b>) energy, but domain walls cost energy. Materials have a preferred "easy axis" (magnetic anisotropy).`},
{q:"Define remanent magnetization and coercive field in a hysteresis loop.",a:`<ul><li><b>Saturation</b>: all moments aligned</li><li><b>Remanent magnetization</b>: magnetization left at zero field (this is the memory, bits 0/1)</li><li><b>Coercive field</b>: the reverse field needed to reorient the magnetization (switch the bit)</li></ul>`},
{q:"Why do magnetic particles become single-domain below a critical size?",a:`Magnetostatic energy scales with volume (∝ r³), while domain wall energy scales with area (∝ r²). Below a critical size, the wall costs more than it saves, so the particle stays <b>single-domain</b>.`},
{x:1,q:"Explain why the coercive field goes through a maximum as particle size decreases.",a:`<ul><li>As size decreases, particles become <b>single-domain</b>. Switching can no longer happen by easy domain wall motion, so the whole moment must rotate and <b>coercivity increases</b>.</li><li>Even smaller: the anisotropy energy <b>KV</b> becomes comparable to <b>k<sub>B</sub>T</b>. Thermal energy flips the moment and the particle becomes <b>superparamagnetic</b>, so coercivity drops towards zero.</li></ul>`},
{x:1,q:"What is superparamagnetism?",a:`When the anisotropy energy <b>E = KV ≈ k<sub>B</sub>T</b>, thermal energy is enough to flip the moment of each single-domain particle. The particles behave like a paramagnet with very large ("giant") moments: no remanence and no coercivity (e.g. 2.2 nm Fe particles).`},
{q:"Single-domain magnetic particle: what happens with the field along the easy axis vs the hard axis?",a:`<ul><li><b>Easy axis</b>: magnetic switching with a square hysteresis loop and high coercivity</li><li><b>Hard axis</b>: the magnetization rotates and returns when the field is removed. No hysteresis.</li></ul>`},
{q:"Why are reactions and processes much faster at the nanoscale?",a:`Solid-state reactions depend on <b>diffusion</b>, and the time to diffuse a distance x scales as <b>t ∝ x²/D</b>. Nano is fast, bulk is slow.`}
]},

{id:"pick", name:"Method picker (exam scenarios)", lec:"Mixed · all lectures", cards:[
{x:1,q:"Which characterization method? Lattice parameters / average crystal structure of a crystalline material.",a:`<b>XRD</b> (WAXS). Peak positions give d-spacings and lattice parameters. TEM diffraction is a local alternative.`},
{x:1,q:"Which characterization method? Particle size of colloidal (possibly amorphous) nanoparticles in solution.",a:`<b>SAXS</b> (Guinier). Alternatives: TEM or SEM images. XRD Scherrer gives crystallite size only for crystalline material.`},
{x:1,q:"Which characterization method? Local structure / disorder in amorphous or very small nanoparticles.",a:`<b>PDF</b> (X-ray total scattering). TEM/SAED for a local look.`},
{x:1,q:"Which characterization method? Chemical composition variation across an epitaxial interface, grain boundary or domain wall (nm resolution).",a:`<b>STEM + EELS</b>. Not SEM-EDS, whose resolution is far too coarse. Atom probe tomography is also possible.`},
{x:1,q:"Which characterization method? Chemical composition variation over a square millimetre.",a:`<b>EDS (EDX) in an SEM</b>. Not EELS, which covers tiny areas.`},
{x:1,q:"Which characterization method? Surface morphology of an insulating oxide thin film.",a:`<b>AFM</b>. STM needs a conducting sample. SE-SEM is a weaker option for an insulator, since it needs coating.`},
{x:1,q:"Which characterization method? Local electrical conductivity on a film surface.",a:`<b>Conductive AFM (cAFM)</b>. STM is second best.`},
{x:1,q:"Which characterization method? Ferroelectric domain structure at a surface.",a:`<b>PFM</b> (piezoresponse force microscopy), an AFM mode. STM can't be used, and cAFM isn't ideal.`},
{x:1,q:"Which characterization method? Local magnetic structure across a surface.",a:`<b>MFM</b> (magnetic force microscopy) or <b>spin-polarized STM</b>. For bulk magnetic structure: neutron diffraction.`},
{x:1,q:"Which characterization method? Individual adatoms or vacancies on an atomically flat Pt (metal) surface.",a:`<b>STM</b>. It gives atomic resolution on a conducting surface.`},
{x:1,q:"Which characterization method? Total surface area of a nanoparticle powder or a mesoporous material.",a:`<b>Gas adsorption, BET isotherm</b>. It can also be estimated from particle size (SAXS/XRD), but that is inferior.`},
{x:1,q:"Which characterization method? Thin film thickness.",a:`<b>Ellipsometry</b> is the most elegant. A cross-section in SEM or TEM also works, and so does X-ray reflectivity.`},
{x:1,q:"Which characterization method? Morphology of a nanocrystalline powder.",a:`<b>SEM</b> or <b>TEM</b>.`},
{q:"Which characterization method? Oxygen positions or H in a heavy-element oxide, or a magnetic structure.",a:`<b>Neutron diffraction</b>, ideally combined with XRD in a joint Rietveld refinement.`},
{q:"Which characterization method? Following crystallization during hydrothermal synthesis in real time.",a:`<b>In situ synchrotron XRD</b> (high brilliance enables fast time resolution).`},
{x:1,q:"Which method? Monitoring monolayer-by-monolayer coverage during MBE growth.",a:`<b>RHEED</b> intensity oscillations.`},
{x:1,q:"Synthesis pick: cheap, scalable production of large amounts of oxide nanoparticles (e.g. an iron oxide).",a:`<b>Co-precipitation</b> in basic solution, <b>sol-gel</b>, <b>spray pyrolysis</b> or hydrothermal synthesis, with controlled T and atmosphere. You need a solvent + metal precursor, plus a base (co-precipitation) or a complexing agent (sol-gel, spray pyrolysis).`},
{x:1,q:"Synthesis pick: monodisperse metallic nanoparticles (Au, Pt, Pd …) with a narrow size distribution.",a:`<b>Colloidal reduction in dilute solution</b>: precursor + solvent + reducing agent + capping agent/polymer, with burst nucleation (short LaMer region II). Or a <b>reverse micelle</b> microemulsion (water + oil + surfactant + precursor + reducing agent).`},
{x:1,q:"Synthesis pick: polymer nanofibres, porous oxide nanofibres, hollow oxide nanotubes.",a:`<ul><li>Polymer nanofibres: <b>electrospinning</b></li><li>Porous oxide nanofibres: <b>electrospin</b> a polymer + metal precursor, then <b>calcine</b> away the polymer</li><li>Hollow oxide nanotubes: <b>sol-gel coating inside a porous template</b> (AAO), then calcine and dissolve the template</li></ul>`},
{x:1,q:"Synthesis pick: semiconductor nanowires (Si, Ge, GaN, InAs) with controlled diameter and length.",a:`<b>VLS</b> (CVD or MBE precursor + metal catalyst droplets). Diameter from catalyst size, length from growth time.`},
{x:1,q:"Synthesis pick: metal nanowires (Cu, Ag).",a:`<b>Electrodeposition into a porous template</b> (AAO or a lithographically patterned resist), or Ag wires by <b>polyol dissolution–condensation</b> with seeds + PVP.`},
{q:"Thin film pick: 100 µm of crystalline conducting oxide on glass (thick, fast).",a:`<b>CVD</b> or <b>sol-gel / spray</b> methods. They are much faster for thick layers than MBE, PLD or ALD.`},
{x:1,q:"Thin film pick: a few nm of perfectly stoichiometric, conformal oxide on a 3D structure or powder.",a:`<b>ALD</b>: self-limiting and conformal, with precise thickness.`},
{x:1,q:"Thin film pick: mesoporous oxide layer with regular 2–50 nm pores.",a:`<b>Sol-gel with a surfactant (micelle) template</b>, then calcination. Hydrothermal is simpler but less ordered.`},
{x:1,q:"Thin film pick: 20 monolayers of a surfactant-type (amphiphilic) material on top of a device stack.",a:`<b>Langmuir–Blodgett</b>: it relies only on physisorption and builds layers one by one. A SAM needs a specific surface reaction for each layer.`},
{x:1,q:"Thin film pick: patterned metal contacts a few nm thick at specific sites.",a:`<b>Sputtering</b> (or evaporation) through a <b>photolithographic</b> pattern, then lift-off.`},
{x:1,q:"Thin film pick: high-quality GaAs.",a:`<b>MBE</b> or <b>MOCVD</b>.`}
]}
];

</script>
<script>
(function(){
  const KEY="tmt4320-flash-v1";
  let state={};
  try{ state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ state={}; }
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };
  if(!state.marks) state.marks={};
  if(!state.sel) state.sel=DECKS.map(d=>d.id);
  if(!state.filter) state.filter="unknown";
  if(state.starOnly===undefined) state.starOnly=false;

  const ALL=[];
  DECKS.forEach(d=>d.cards.forEach((c,i)=>{ c.id=d.id+"-"+i; c.deck=d; ALL.push(c); }));
  const app=document.getElementById("app");
  const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const check='<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function pick(cards){
    return cards.filter(c=>{
      if(state.starOnly && !c.x) return false;
      const m=state.marks[c.id];
      if(state.filter==="unknown") return m!=="k";
      if(state.filter==="missed") return m==="m";
      return true;
    });
  }

  let session=null, confirmReset=false;

  function home(){
    session=null;
    const known=ALL.filter(c=>state.marks[c.id]==="k").length;
    const missed=ALL.filter(c=>state.marks[c.id]==="m").length;
    const selCards=ALL.filter(c=>state.sel.includes(c.deck.id));
    const nSel=pick(selCards).length, nAll=pick(ALL).length;
    const seg=(v,l)=>`<button type="button" data-filter="${v}" aria-pressed="${state.filter===v}">${l}</button>`;
    app.innerHTML=`
      <header>
        <div class="mono">TMT4320 Nanomaterials · exam practice</div>
        <h1>Flashcards</h1>
        <p class="sub">${ALL.length} cards in ${DECKS.length} topics, from lectures 2–22, your notes and the 2020–2025 exams. ★ marks topics that have come up on past exams.</p>
      </header>
      <div class="stats">
        <div class="stat"><b>${known}</b><span>known</span></div>
        <div class="stat"><b>${missed}</b><span>to repeat</span></div>
        <div class="stat"><b>${ALL.length-known-missed}</b><span>not seen</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="label">Which cards</span>
        <div class="seg" role="group" aria-label="Card filter">${seg("unknown","Not yet known")}${seg("missed","Only missed")}${seg("all","All cards")}</div>
        <div class="seg" role="group" aria-label="Exam filter">
          <button type="button" id="starOff" aria-pressed="${!state.starOnly}">Everything</button>
          <button type="button" id="starOn" aria-pressed="${state.starOnly}">★ Exam topics only</button>
        </div>
      </div>
      <div class="row" style="justify-content:space-between">
        <span class="label">Topics (${state.sel.length} selected)</span>
        <span class="row"><button class="link" id="selAll" type="button">Select all</button><button class="link" id="selNone" type="button">Clear</button></span>
      </div>
      <div class="decks">${DECKS.map(d=>{
        const n=d.cards.length, k=d.cards.filter(c=>state.marks[c.id]==="k").length, m=d.cards.filter(c=>state.marks[c.id]==="m").length;
        const on=state.sel.includes(d.id);
        return `<button type="button" class="deck" data-deck="${d.id}" aria-pressed="${on}">
          <span class="check">${check}</span>
          <span style="min-width:0"><div class="name">${esc(d.name)}</div><div class="meta">${esc(d.lec)}</div>
          <div class="bar"><i class="k" style="width:${k/n*100}%"></i><i class="m" style="width:${m/n*100}%"></i></div></span>
          <span class="count">${k}/${n}</span></button>`;}).join("")}
      </div>
      <div class="actions">
        <button class="btn primary" id="go" type="button" ${nSel?"":"disabled"}>Study selected (${nSel})</button>
        <button class="btn" id="mix" type="button" ${nAll?"":"disabled"}>Mix all topics (${nAll})</button>
      </div>
      ${(!nSel && state.sel.length)?`<p class="note">No cards match this filter in the selected topics. Try "All cards".</p>`:""}
      <div class="foot">
        <span>Cards are shuffled. Tap a card to see the answer, then mark whether you knew it. Progress is saved in this browser only, so your phone and laptop keep separate progress.</span>
        <span>${confirmReset?`<span class="confirm">Erase all progress on this device? <button type="button" id="resetYes">Erase</button><button type="button" class="link" id="resetNo">Cancel</button></span>`:`<button class="link" id="reset" type="button">Reset progress</button>`}</span>
      </div>`;
    app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;save();home();});
    app.querySelector("#starOff").onclick=()=>{state.starOnly=false;save();home();};
    app.querySelector("#starOn").onclick=()=>{state.starOnly=true;save();home();};
    app.querySelectorAll("[data-deck]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.deck; state.sel=state.sel.includes(id)?state.sel.filter(x=>x!==id):[...state.sel,id]; save(); home();});
    app.querySelector("#selAll").onclick=()=>{state.sel=DECKS.map(d=>d.id);save();home();};
    app.querySelector("#selNone").onclick=()=>{state.sel=[];save();home();};
    app.querySelector("#go").onclick=()=>start(pick(selCards),"Selected topics");
    app.querySelector("#mix").onclick=()=>start(pick(ALL),"All topics");
    const r=app.querySelector("#reset"); if(r) r.onclick=()=>{confirmReset=true;home();};
    const ry=app.querySelector("#resetYes"); if(ry) ry.onclick=()=>{state.marks={};confirmReset=false;save();home();};
    const rn=app.querySelector("#resetNo"); if(rn) rn.onclick=()=>{confirmReset=false;home();};
  }

  function start(cards,label){
    if(!cards.length) return;
    session={cards:shuffle(cards),i:0,shown:false,label,res:{k:0,m:0},missed:[]};
    window.scrollTo(0,0); card();
  }

  function card(){
    const s=session, c=s.cards[s.i];
    app.innerHTML=`
      <div class="topbar"><button class="back" id="back" type="button">← Topics</button><span class="mono">${esc(s.label)}</span><span class="pos">${s.i+1} / ${s.cards.length}</span></div>
      <div class="prog"><i style="width:${(s.i)/s.cards.length*100}%"></i></div>
      <article class="card fade" id="card" tabindex="0" aria-live="polite">
        <div class="tagrow"><span class="mono">${esc(c.deck.name)} · ${esc(c.deck.lec.split("·")[0].trim())}</span>${c.x?'<span class="star">★ exam topic</span>':""}</div>
        <div class="q">${c.q}</div>
        ${s.shown?`<div class="answer fade">${c.a}</div>`:`<div class="hint">Answer in your head, then tap to reveal</div>`}
      </article>
      <div class="grade">${s.shown
        ?`<button class="no" id="no" type="button">Didn't know</button><button class="yes" id="yes" type="button">Knew it</button>`
        :`<button class="reveal" id="rev" type="button">Show answer</button>`}</div>
      <div class="kbd">Space: show answer · ← didn't know · → knew it</div>`;
    app.querySelector("#back").onclick=home;
    app.querySelector("#card").onclick=()=>{ if(!s.shown){s.shown=true;card();} };
    const rev=app.querySelector("#rev"); if(rev) rev.onclick=()=>{s.shown=true;card();};
    const no=app.querySelector("#no"); if(no) no.onclick=()=>grade("m");
    const yes=app.querySelector("#yes"); if(yes) yes.onclick=()=>grade("k");
  }

  function grade(v){
    const s=session, c=s.cards[s.i];
    state.marks[c.id]=v; save();
    s.res[v]++; if(v==="m") s.missed.push(c);
    s.i++; s.shown=false;
    if(s.i>=s.cards.length) done(); else { card(); window.scrollTo(0,0); }
  }

  function done(){
    const s=session;
    app.innerHTML=`
      <div class="topbar"><button class="back" id="back" type="button">← Topics</button><span class="mono">${esc(s.label)}</span></div>
      <section class="done">
        <h2>Round finished</h2>
        <div class="nums"><div style="background:var(--good-soft);color:var(--good)"><b>${s.res.k}</b>knew it</div><div style="background:var(--bad-soft);color:var(--bad)"><b>${s.res.m}</b>to repeat</div></div>
        <div class="actions">
          ${s.missed.length?`<button class="btn primary" id="again" type="button">Repeat the ${s.missed.length} I missed</button>`:`<p class="note">You knew every card in this round.</p>`}
          <button class="btn" id="home" type="button">Back to topics</button>
        </div>
      </section>`;
    app.querySelector("#back").onclick=home;
    app.querySelector("#home").onclick=home;
    const a=app.querySelector("#again"); if(a) a.onclick=()=>start(s.missed,"Repeat missed");
  }

  document.addEventListener("keydown",e=>{
    if(!session || session.i>=session.cards.length) return;
    if(e.target.closest && e.target.closest("button") && (e.key===" "||e.key==="Enter")) return;
    if(e.key===" "||e.key==="Enter"){ if(!session.shown){e.preventDefault();session.shown=true;card();} }
    else if(session.shown && (e.key==="ArrowLeft"||e.key==="1")) grade("m");
    else if(session.shown && (e.key==="ArrowRight"||e.key==="2")) grade("k");
  });

  home();
})();
</script>
