<style>
/* Layout: one narrow column (max 640px); home = deck list, study = one card + answer buttons pinned below */
:root{
  --bg:#f5f4f7; --surface:#ffffff; --surface-2:#eeecf2; --fg:#1d1a24; --muted:#615b6e; --line:#dcd8e3;
  --accent:#a8213d; --accent-ink:#ffffff; --accent-soft:#f6e3e7;
  --good:#1f7a55; --good-soft:#e1f2ea; --bad:#b4472c; --bad-soft:#f8e6e0; --star:#b07a12;
  --f-display:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141218; --surface:#1d1a23; --surface-2:#26222e; --fg:#ece9f2; --muted:#a39db0; --line:#36313f;
  --accent:#f0708a; --accent-ink:#1a0d11; --accent-soft:#3a1d25;
  --good:#5cc79a; --good-soft:#173328; --bad:#f08a6c; --bad-soft:#3a2119; --star:#e2b44a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1d1a23; --surface-2:#26222e; --fg:#ece9f2; --muted:#a39db0; --line:#36313f;
  --accent:#f0708a; --accent-ink:#1a0d11; --accent-soft:#3a1d25;
  --good:#5cc79a; --good-soft:#173328; --bad:#f08a6c; --bad-soft:#3a2119; --star:#e2b44a; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.15}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.deck:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 0;min-width:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}

.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.label{font-size:.8rem;color:var(--muted);font-weight:500}

.decks{display:flex;flex-direction:column;gap:8px}
.deck{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.deck[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.deck[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px;stroke:var(--accent-ink);opacity:0}
.deck[aria-pressed="true"] .check svg{opacity:1}
.deck .name{font-weight:600;font-size:.98rem;min-width:0}
.deck .meta{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);letter-spacing:.03em;margin-top:2px}
.bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:7px;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)} .bar .m{background:var(--bad)}
.count{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);text-align:right;white-space:nowrap}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;flex:1 1 160px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:.85rem}
.note{font-size:.82rem;color:var(--muted)}
.foot{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}

/* study */
.topbar{display:flex;align-items:center;gap:10px}
.topbar .back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:.88rem}
.topbar .pos{margin-left:auto;font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.prog{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 22px;min-height:min(56vh,440px);
  display:flex;flex-direction:column;gap:14px;cursor:pointer;box-shadow:0 1px 2px rgba(20,10,30,.05),0 8px 24px -12px rgba(20,10,30,.18)}
.card .tagrow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.star{color:var(--star);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase}
.q{font-family:var(--f-display);font-weight:600;font-size:1.22rem;line-height:1.3;text-wrap:pretty}
.answer{border-top:1px dashed var(--line);padding-top:14px;font-size:.98rem;min-width:0;overflow-wrap:anywhere}
.answer ul,.answer ol{margin:6px 0;padding-left:1.25em}
.answer li{margin:3px 0}
.answer p{margin:8px 0 0}
.answer .why{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:.9rem;color:var(--fg)}
.answer b{font-weight:600}
.hint{margin-top:auto;color:var(--muted);font-size:.85rem;text-align:center}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.prog i{transition:none}}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.grade button{border-radius:14px;padding:14px 10px;font-weight:600;border:1.5px solid}
.grade .no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grade .yes{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.grade .reveal{grid-column:1 / -1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kbd{font-size:.75rem;color:var(--muted);text-align:center}
@media (hover:none){.kbd{display:none}}

/* end */
.done{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.done .nums{display:flex;gap:10px}
.done .nums div{flex:1;border-radius:12px;padding:12px}
.done .nums b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.confirm button{border:1px solid var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:5px 10px}
</style>

<script>
// x:1 marks concepts that have been asked (in some form) on TMT4320 exams 2020–2025
const DECKS = [
{id:"intro", name:"Why nano is special", lec:"L1 · L9 · CW 1", cards:[
{x:1,q:"What is the simplest definition of a nanomaterial?",a:`A material with <b>at least one dimension between 1 and 100 nm</b>.<p class="why">For scale: an atom is about 0.2–0.3 nm, so a 1 nm particle contains only a few tens of atoms.</p>`},
{q:"0D, 1D, 2D and 3D nanomaterials: how many dimensions are on the nanoscale in each? Give an example of each.",a:`<ul><li><b>0D</b>: all 3 dimensions nanoscale. Nanoparticles, quantum dots.</li><li><b>1D</b>: 2 dimensions nanoscale. Nanowires, nanorods, nanotubes.</li><li><b>2D</b>: 1 dimension nanoscale. Thin films, graphene.</li><li><b>3D</b>: none nanoscale, but built from nano building blocks. Nanocrystalline solids, nanocomposites.</li></ul><p class="why">Common trap: "1D" means <i>two</i> nanoscale dimensions, because one dimension is long.</p>`},
{x:1,q:"Name the four known origins of size-dependent properties in nanomaterials.",a:`<ol><li>Large fraction of surface atoms</li><li>Large surface area and surface energy</li><li>Spatial (quantum) confinement, e.g. quantum dots</li><li>Fewer defects, giving nearly ideal strength and much lower electrical resistance (ballistic electron transport)</li></ol>`},
{x:1,q:"How does the fraction of surface atoms scale with particle radius r? Show it quickly.",a:`It scales as <b>1/r</b>.<br>V<sub>surface</sub>/V<sub>sphere</sub> ≈ 4πr²Δt / (4/3 πr³) = <b>3Δt/r</b>, where Δt ≈ 0.2 nm is one atomic layer.<ul><li>r = 1 µm: about 0.06 % surface atoms</li><li>r = 1 nm: about 60 %</li></ul>`},
{q:"A volume V is divided into cubes of edge a. How does the total surface area scale?",a:`A<sub>tot</sub> = N·6a² = (V/a³)·6a² = <b>6V/a</b>, so a·S is constant.<br>1 cm³: 6 cm² (a = 1 cm), 60 cm² (a = 1 mm), 6·10⁷ cm² (a = 1 nm).`},
{x:1,q:"What is the main difference between 1 g of bulk powder and 1 g of nanocrystalline powder of the same material?",a:`The nanocrystalline powder has a <b>much larger surface area</b> and a much higher fraction of surface atoms, so it is much more reactive and has a much higher total surface energy.`},
{x:1,q:"Compare top-down and bottom-up synthesis: examples, advantages and disadvantages.",a:`<b>Top-down</b> (refining or reducing bulk): ball milling, etching, attrition, lithography.<ul><li>+ high yield, easy to scale up, cheap</li><li>− broad size distribution, varied morphology, impurities from the mechanical process, defects</li></ul><b>Bottom-up</b> (building from atoms or molecules): colloidal synthesis, sol-gel, hydrothermal, spray pyrolysis, CVD.<ul><li>+ controlled size, morphology and composition; high purity; few defects</li><li>− can have low yield, more complicated, sometimes hard to scale up</li></ul>`},
{q:"What is the 'eternal challenge' of nanoparticle work, and what drives it?",a:`Achieving <b>uniformity</b> (size and shape) and <b>avoiding agglomeration</b>.<p class="why">It is driven by the high surface energy. Nanoparticles are metastable and will try to reduce their total surface area.</p>`},
{x:1,q:"Why do smaller particles melt at lower temperature?",a:`Surface atoms have fewer neighbours and are more weakly bound. When a large fraction of the atoms sits at the surface, less thermal energy is needed to melt the particle. T<sub>m</sub> decreases roughly as 1/r (for Au it drops sharply below about 5 nm).`},
{q:"What is surface plasmon resonance (SPR), and what does it depend on?",a:`A <b>collective oscillation of conduction electrons</b> at the surface of metallic nanoparticles, in resonance with incoming light. It amplifies absorption and scattering at a specific wavelength.<ul><li>Depends on <b>size and shape</b>. Au spheres absorb around 520 nm (red colour). Au nanorods get an extra longitudinal peak that shifts towards near-IR as the aspect ratio increases.</li><li>Example: the Lycurgus cup (Ag/Au nanoparticles in glass, red in transmitted light, green in reflected light)</li></ul>`},
{q:"What is quantum confinement, and how does it show up in quantum dots?",a:`When particle size becomes comparable to the electron's de Broglie wavelength (for semiconductors, the exciton Bohr radius), energy levels become discrete and the <b>band gap increases as size decreases</b>. That is why quantum dots change colour with size.`},
{q:"Define nanoparticle, nanocrystal and quantum dot.",a:`<ul><li><b>Nanoparticle</b>: all three dimensions in the nanoscale (0D)</li><li><b>Nanocrystal</b>: a crystalline nanoparticle</li><li><b>Quantum dot</b>: a semiconductor nanocrystal with (size-dependent) fluorescent properties</li></ul>`},
{x:1,q:"Name properties that change with decreasing particle size, and the direction they usually change.",a:`<ul><li>Lattice parameter / unit cell volume: <b>decreases</b> for metals and covalent materials, <b>increases</b> for ionic</li><li>Melting temperature: down</li><li>Vapour pressure and solubility: up</li><li>Phase transition temperatures (ferroelectric, magnetic): usually down</li><li>Optical band gap: up (quantum confinement)</li><li>Surface area: up</li><li>Magnetism: single-domain, then superparamagnetic</li></ul>`},
{x:1,q:"Name two properties that do NOT change monotonically with size but go through a maximum or minimum.",a:`<ul><li><b>Magnetic coercive field</b>: maximum around the single-domain size, then drops as particles become superparamagnetic</li><li><b>Mechanical yield strength</b> of nanocrystalline materials: maximum at a certain grain size</li></ul>`},
{q:"List the internal morphologies a binary (A+B) nanoparticle can have. What does Cu@Ag mean?",a:`Mixed/alloy, <b>core–shell</b>, layered, heterodimer ("dumbbell", side by side), satellite.<br><b>Cu@Ag</b> means a Cu core with an Ag shell (core@shell notation).`},
{x:1,q:"Binary metallic nanoparticles: is each morphology stabilized by enthalpy or entropy? (a) disordered alloy (b) core–shell (c) dumbbell",a:`<ul><li>(a) Disordered alloy: <b>entropy</b> (configurational mixing entropy)</li><li>(b) Core–shell: <b>enthalpy</b></li><li>(c) Dumbbell: <b>enthalpy</b></li></ul><p class="why">Ordered or segregated arrangements lower entropy, so they must be favoured by bonding or interface and surface energies.</p>`},
{x:1,q:"All bottom-up methods rely on self-assembly. Is the driving force enthalpy or entropy? Explain.",a:`<b>Enthalpy.</b> Configurational entropy decreases when atoms or molecules order themselves (ΔS &lt; 0). For ΔG = ΔH − TΔS &lt; 0, the enthalpy gain (bond formation) must outweigh the −TΔS penalty.<p class="why">Consequence: self-assembly is favoured at low T. At high T, entropy wins.</p>`}
]},

{id:"surface", name:"Surface energy & curvature", lec:"L2 · CW 2.2–2.3", cards:[
{x:1,q:"Define (specific) surface energy γ.",a:`The energy (work) needed to create a <b>unit area of new surface</b>:<br>γ = (∂G/∂A)<sub>n,T,p</sub> = dW/dA. It is always positive.`},
{x:1,q:"What is the microscopic origin of surface energy?",a:`Surface atoms have <b>fewer nearest neighbours</b> (lower coordination number) than bulk atoms, so they have unsatisfied <b>dangling bonds</b>. They feel a net inward force from the bulk.<p class="why">Consequence: nanomaterials are meta- or unstable and always try to lower their total surface energy.</p>`},
{x:1,q:"What is the difference between surface tension and surface energy?",a:`<ul><li><b>Surface tension</b>: force per unit length at a liquid–gas surface</li><li><b>Surface energy</b>: energy cost of creating a unit area of (solid) surface</li></ul>`},
{q:"Give the broken-bond estimate of surface energy and explain each term. Why the factor ½?",a:`γ ≈ ½ · N<sub>b</sub> · ε · ρ<sub>a</sub><ul><li>N<sub>b</sub>: broken bonds per surface atom</li><li>ε: bond strength (J)</li><li>ρ<sub>a</sub>: surface atomic density (m⁻²)</li></ul><p class="why">The ½ appears because breaking a bond creates <b>two</b> surfaces. Surfaces come in pairs.</p>`},
{x:1,q:"For an fcc crystal, rank γ for {100}, {110} and {111}. Why is {111} lowest?",a:`γ<sub>111</sub> ≈ 3.46 ε/a² &lt; γ<sub>110</sub> ≈ 3.54 ε/a² &lt; γ<sub>100</sub> = 4.00 ε/a²<p class="why">{111} is the most densely packed plane, so each surface atom loses only 3 of 12 bonds. ({100}: 4 broken, {110}: 5 broken.) In general, low Miller indices give low γ. This is only a "rigid surface" estimate, since relaxation and restructuring change it. There is a typo in CW eq. 2.5: γ<sub>111</sub> = 2√3 ε/a².</p>`},
{x:1,q:"What structural factors determine the surface energy of a specific crystallographic facet?",a:`Mainly the <b>atomic density of the plane</b>, and therefore the density of broken bonds per area. Bond strength (type of atoms) is the chemical factor.`},
{x:1,q:"What would hypothetically happen if a solid's surface energy suddenly became negative?",a:`Creating surface would lower the energy, so the material would spontaneously maximize its surface area and <b>disintegrate</b> (dissolve or turn into a gas of atoms).`},
{x:1,q:"List all the mechanisms by which nanostructures reduce total surface energy, grouped into three levels.",a:`<b>Surface with fixed area:</b> relaxation, restructuring (reconstruction), adsorption, compositional segregation.<br><b>Shape of an individual particle:</b> minimize surface area (sphere), form low-energy facets.<br><b>Overall system:</b> sintering, Ostwald ripening, agglomeration.`},
{x:1,q:"Surface relaxation: what is it, and how does it differ for metallic, covalent and ionic materials?",a:`Surface atoms shift (mainly normal to the surface), changing bond lengths.<ul><li><b>Metals and covalent</b>: inward relaxation, <b>contraction</b></li><li><b>Ionic</b>: <b>expansion</b></li></ul>`},
{x:1,q:"Give a microscopic explanation for why ionic oxide nanoparticles expand while metal and semiconductor nanoparticles contract as size decreases.",a:`<ul><li><b>Metallic/covalent</b>: valence electrons are shared. Surface atoms have fewer bonds, so the same electrons are distributed over fewer bonds. That gives higher electron density per bond, shorter bonds and a <b>lattice contraction</b>.</li><li><b>Ionic</b>: there is full charge transfer and cohesion comes from the long-range attractive <b>Madelung potential</b>. At small sizes the Madelung sum is <b>truncated</b>, so attraction is weaker and the lattice <b>expands</b>.</li></ul>`},
{x:1,q:"How do you expect the unit cell volume to change with decreasing particle size for GaAs, LiF and Au?",a:`<ul><li>GaAs (mainly covalent): <b>shrinks</b></li><li>LiF (ionic): <b>expands</b></li><li>Au (metallic): <b>shrinks</b></li></ul>`},
{x:1,q:"Why do covalent materials reconstruct their surfaces while metals and ionic materials mainly relax?",a:`Covalent bonds are <b>directional</b>. Dangling bonds at the surface can lower the energy by bending and pairing up into new bonds (e.g. dimers on Si{100}, 7×7 on Si{111}). Metallic and ionic bonding are non-directional (isotropic), so atoms only relax in position.`},
{q:"Give an example of surface adsorption lowering the surface energy.",a:`Dangling bonds are saturated by species from the surroundings, e.g. –H or –OH termination of Si or diamond surfaces. Si oxidizes instantly in air because its surface is so reactive. Adsorption works together with relaxation and reconstruction.`},
{q:"What is compositional segregation at a surface?",a:`Enrichment of impurities, or of one component in an alloy, at the surface (or grain boundary) by <b>solid-state diffusion</b>, because this lowers the total energy. It is not relevant for pure materials.`},
{x:1,q:"What is the equilibrium shape of an amorphous nanoparticle (or a liquid droplet), and why?",a:`<b>Spherical.</b> Its surface energy is isotropic, so the lowest total surface energy is reached by minimizing area.`},
{x:1,q:"What determines the equilibrium shape of a crystalline nanoparticle? State the Wulff construction.",a:`The <b>anisotropic surface energies</b> of the facets. Wulff: the distance h<sub>i</sub> from a fixed centre to each facet is proportional to its surface energy, <b>γ<sub>i</sub> = C·h<sub>i</sub></b>.<p class="why">Low-energy facets lie closer to the centre and therefore take up a <b>larger</b> share of the surface area. That minimizes Σγ<sub>i</sub>A<sub>i</sub>.</p>`},
{x:1,q:"What energetic factor drives a crystalline nanoparticle to deviate from a spherical shape?",a:`<b>Crystallinity itself.</b> Planes with different Miller indices have different atomic densities and therefore different γ. The more anisotropic the crystal structure, the more the shape deviates from a sphere (Wulff).`},
{q:"Why are nanoparticles grown at high temperature often spherical rather than faceted?",a:`<b>Surface roughening transition:</b> at high T the equilibrium surfaces are no longer atomically smooth, and the energy difference between facets disappears. Kinetic factors (fast growth) can also prevent facets from forming.`},
{x:1,q:"Sintering: what happens, at what temperature, and what is the result?",a:`Individual particles in contact <b>merge</b> by solid-state diffusion (neck formation) at about <b>70 % of T<sub>m</sub></b>. The solid–vapour interface is replaced by a solid–solid interface (grain boundaries), so the product is <b>polycrystalline</b>.`},
{x:1,q:"Ostwald ripening: what happens, at what temperature, and what is the result?",a:`Large particles grow at the expense of small ones until the small ones disappear. Mass is transported through the medium (dissolution, diffusion, deposition). It happens at <b>relatively low temperature</b>, and each grown particle is a <b>single crystal</b>.`},
{x:1,q:"Agglomeration: how does it differ from sintering and Ostwald ripening?",a:`Particles cluster together through chemical or physical bonds <b>without any mass transport</b>, so the individual particles stay unchanged. The smaller the particles, the stronger the bonding forces.`},
{x:1,q:"What is the main driving force for nanoparticle agglomeration?",a:`<b>Reduction of the total surface area</b>, and with it the total surface energy.`},
{x:1,q:"A dispersion of nanoparticles in a liquid at room temperature: in which ways can the system lower its total energy?",a:`<b>Ostwald ripening</b> and <b>agglomeration</b>. Sintering is unlikely at room temperature in a liquid, since it needs high temperature and particle contact.`},
{x:1,q:"Write the Young–Laplace equation for chemical potential and define the terms.",a:`Δμ = γΩ(1/R₁ + 1/R₂) = <b>2γΩ/R</b> for a sphere (R₁ = R₂)<ul><li>Δμ: chemical potential relative to a flat surface</li><li>γ: surface energy</li><li>Ω: atomic volume</li><li>R: radius of curvature</li></ul>`},
{x:1,q:"Compare convex and concave surfaces in terms of chemical potential, solubility and vapour pressure.",a:`<ul><li><b>Convex</b> (R &gt; 0; particles, droplets): μ <b>higher</b> than flat, higher solubility and vapour pressure</li><li><b>Concave</b> (R &lt; 0; pores, bubbles): μ <b>lower</b>, lower solubility and vapour pressure</li></ul><p class="why">Atoms therefore have a driving force to move from convex to concave regions.</p>`},
{x:1,q:"Use the Young–Laplace equation to explain Ostwald ripening.",a:`Δμ = 2γΩ/R, so <b>smaller particles have higher chemical potential</b>, which means higher solubility and vapour pressure. Atoms dissolve from small particles, diffuse through the medium and deposit on large particles, where μ is lower. This lowers both the chemical potential of the atoms and the total surface area. The larger the difference in radius, the stronger the driving force.`},
{x:1,q:"How do melting temperature and vapour pressure scale with decreasing particle size?",a:`Melting temperature <b>decreases</b>, and vapour pressure (and solubility) <b>increases</b>, both roughly as 1/r.`},
{x:1,q:"A faceted cubic nanocrystal starts to dissolve. Where is dissolution fastest? Where is a vacancy most stable?",a:`Both happen at the <b>corners (apices)</b> first, then edges, and slowest on low-energy facets.<p class="why">Corner atoms have the lowest coordination number, so the fewest bonds must be broken to remove them. This is the reverse of adatoms preferring sites where they form the most bonds.</p>`},
{x:1,q:"In a core–shell nanoparticle of two metals, how can surface energy predict which metal forms the shell?",a:`The metal with the <b>lowest surface energy</b> goes to the <b>shell</b>, and the one with the highest surface energy forms the core. This minimizes the total energy.`},
{q:"Define chemical potential μ in the context of surface curvature.",a:`The incremental change in (surface) energy when <b>one more atom</b> is added to the surface. It depends strongly on curvature: convex surfaces have higher μ than concave ones.`}
]},

{id:"stab", name:"Stabilization of dispersions", lec:"L3 · CW 2.4–2.6", cards:[
{x:1,q:"What are the two main ways to prevent agglomeration, and what kind of stability does each give?",a:`<ul><li><b>Electrostatic stabilization</b>: <b>kinetically</b> stable</li><li><b>Steric stabilization</b> (polymers, surfactants): <b>thermodynamically</b> stable</li></ul>Combining them gives <b>electrosteric</b> stabilization.`},
{x:1,q:"Why is electrostatic stabilization called 'kinetic' and steric stabilization 'thermodynamic'?",a:`<ul><li><b>Electrostatic</b>: agglomeration would still lower the total energy, but an <b>energy barrier</b> (DLVO) blocks it as long as Brownian motion can't supply enough energy to cross it.</li><li><b>Steric</b>: separated particles are the actual <b>equilibrium (lowest G) state</b>, because overlapping polymer layers would cost configurational entropy. No barrier is needed.</li></ul>`},
{q:"List five ways a solid surface in a liquid can acquire surface charge.",a:`<ol><li>Preferential adsorption of ions (chemical or physical)</li><li>Dissociation of surface charged species (e.g. –OH → –O⁻ + H⁺)</li><li>Isomorphic substitution of ions (e.g. Na⁺ substituting for Ti⁴⁺)</li><li>Accumulation or depletion of electrons at the surface</li><li>Physical adsorption of charged species</li></ol>`},
{x:1,q:"Write the surface potential of an oxide in water as a function of pH. What are the charge-determining ions?",a:`From the Nernst equation: <b>E = 2.303RT/F · (PZC − pH)</b><br>The charge-determining ions are <b>H⁺/OH⁻</b>, with [H⁺] = 10<sup>−pH</sup>.`},
{x:1,q:"What is the PZC, and why does it matter for dispersion stability?",a:`<b>Point of zero charge</b>: the pH at which the oxide surface has zero net charge.<ul><li>pH &lt; PZC: surface <b>positive</b> (H⁺ adsorbed)</li><li>pH &gt; PZC: surface <b>negative</b> (OH⁻ / deprotonated)</li></ul><p class="why">At pH = PZC there is no electrostatic repulsion, only van der Waals attraction, so the dispersion agglomerates. You must work at a pH well away from the PZC.</p>`},
{x:1,q:"SiO₂ has a low PZC (≈2) and MgO a high PZC (≈12). At what pH is each stabilized, and with what charge?",a:`<ul><li>SiO₂: stable at pH &gt; PZC, with a <b>negative</b> surface charge</li><li>MgO: stable at pH &lt; PZC, with a <b>positive</b> surface charge</li></ul>`},
{x:1,q:"Mixed dispersion at pH 7: TiO₂ (PZC ≈ 6) and Fe₂O₃ (PZC ≈ 8.6). Give each surface charge and charge-determining species. Which stabilization would you choose?",a:`<ul><li>TiO₂: pH &gt; PZC, so <b>negative</b> (OH⁻ / –O⁻)</li><li>Fe₂O₃: pH &lt; PZC, so <b>positive</b> (H⁺)</li></ul>Choose <b>steric (thermodynamic)</b> stabilization with polymers. This is a multi-phase system with different PZCs, and the oppositely charged particles would even attract each other.`},
{x:1,q:"Describe the electric double layer near a charged surface in a liquid.",a:`<ul><li><b>Stern layer</b>: counter-ions tightly bound to the surface</li><li><b>Diffuse layer</b>: counter-ion concentration decreases with distance into the solution</li><li><b>Shear plane</b>: the boundary of liquid that moves with the particle. The potential here is the <b>zeta potential ζ</b>.</li></ul>`},
{x:1,q:"Which factors determine the thickness of the double layer (κ⁻¹)?",a:`κ⁻¹ ∝ √(ε<sub>r</sub>ε₀kT / Σ C<sub>i</sub>z<sub>i</sub>²)<ul><li>Concentration of counter-ions (higher gives thinner)</li><li>Charge (valence) of counter-ions (higher gives thinner)</li><li>Dielectric constant of the solvent</li><li>Temperature</li></ul>`},
{x:1,q:"How does the ion concentration in the solution affect the stability of an electrostatically stabilized dispersion?",a:`Higher ion concentration gives a <b>thinner double layer</b>, a lower repulsive energy barrier and a <b>less stable</b> dispersion. A low ionic strength gives the best stability, which can seem counterintuitive.`},
{q:"How is the zeta potential measured?",a:`<ol><li>Apply an electric field.</li><li>Measure particle velocity V, e.g. from the Doppler shift of scattered laser light.</li><li>Electrophoretic mobility μ<sub>e</sub> = V/E.</li><li>Convert with a model, e.g. Smoluchowski: <b>μ<sub>e</sub> = ε<sub>r</sub>ε₀ζ/η</b>.</li></ol>`},
{q:"Why do two charged particles repel each other? Give the repulsive potential.",a:`<ol><li>Equal charges repel.</li><li>Osmotic flow: when the double layers overlap (S &lt; 2 double-layer thicknesses), the local ion concentration rises and solvent flows in to separate the particles.</li></ol>Φ<sub>R</sub> = 2πε<sub>r</sub>ε₀ r E² exp(−κS)`},
{q:"Give the van der Waals attraction between two spheres at short separation. What is A?",a:`Φ<sub>A</sub> ≈ −Ar / 12S (for S ≪ r)<br>A is the <b>Hamaker constant</b>, about 10⁻²⁰–10⁻¹⁹ J.`},
{x:1,q:"DLVO theory: what are the attractive and repulsive terms, and what does the total potential curve look like?",a:`Φ = Φ<sub>A</sub> (van der Waals attraction) + Φ<sub>R</sub> (electrostatic double-layer repulsion)<ul><li><b>Primary minimum</b> at contact: deep, irreversible agglomeration</li><li><b>Energy barrier</b> (maximum): this is the kinetic stabilization</li><li><b>Secondary minimum</b> at larger distance: weak, reversible flocculation</li></ul>DLVO stands for Derjaguin, Landau, Verwey, Overbeek.`},
{x:1,q:"List the limitations of electrostatic stabilization.",a:`<ol><li>Works only for <b>dilute</b> systems</li><li><b>Electrolyte sensitive</b></li><li>Agglomerated particles are close to impossible to re-disperse</li><li>Hard to apply to <b>multi-phase</b> systems, since different solids have different PZC and surface charge</li></ol>Advantage: simple, and no large macromolecules need to be removed afterwards.`},
{x:1,q:"Advantages and disadvantages of steric stabilization?",a:`<b>Advantages</b>:<ol><li>Thermodynamic stabilization</li><li>Works for non-dilute (concentrated) systems</li><li>Not electrolyte sensitive</li><li>Suitable for multi-phase systems</li><li>Polymers can add functionality</li></ol><b>Disadvantage</b>: the polymers may be hard to remove or unwanted in the final application.`},
{x:1,q:"Explain the fundamental difference between steric and electrostatic stabilization in terms of what keeps particles apart.",a:`<ul><li><b>Electrostatic</b>: the double layer from adsorbed ions creates an <b>energy barrier</b> (DLVO). Agglomeration is only hindered kinetically.</li><li><b>Steric</b>: when the polymer layers on two particles overlap, chains lose freedom, so <b>configurational entropy decreases</b> (ΔG = ΔH − TΔS &gt; 0). The local polymer concentration also rises, giving an <b>osmotic pressure</b>. Agglomeration is thermodynamically unfavourable.</li></ul>`},
{q:"Steric stabilization: compare a good solvent and a poor solvent.",a:`<ul><li><b>Good solvent</b>: the polymer expands (solvent–polymer contacts are favourable). Overlapping layers repel, giving good stabilization.</li><li><b>Poor solvent</b>: the polymer coils up or collapses. Polymer–polymer contact can be favourable (ΔH &lt; 0), giving attraction and possible agglomeration.</li></ul>`},
{q:"Anchored vs adsorbed polymers in steric stabilization?",a:`<ul><li><b>Anchored</b> (grafted or chemisorbed): strong and <b>irreversible</b>, bound at one end only</li><li><b>Adsorbed</b>: weak and <b>reversible</b>, but bound at multiple points along the chain</li></ul>Free, unattached macromolecules can also stabilize (depletion stabilization).`},
{q:"What is electrosteric stabilization? Give the two variants.",a:`Electrostatic + steric combined:<ul><li>Charged particles with uncharged polymers</li><li>Uncharged particles with charged polymers (polyelectrolytes)</li></ul>`}
]},

{id:"nucl", name:"Nucleation & metal nanoparticles", lec:"L4–L5 · CW 3.1–3.3", cards:[
{x:1,q:"What is the difference between homogeneous and heterogeneous nucleation?",a:`<ul><li><b>Homogeneous</b>: no interface. It needs a <b>high</b> degree of supersaturation.</li><li><b>Heterogeneous</b>: occurs at an interface (foreign surface, seed, container wall). It needs <b>lower</b> supersaturation and is the most common in nature.</li></ul>The fundamentals are the same in gases, liquids and solids.`},
{q:"What is supersaturation, and why does it drive nucleation?",a:`The solute concentration <b>exceeds its equilibrium solubility</b>. A supersaturated solution has high Gibbs free energy, which is reduced by precipitating a new solid phase.<br>ΔG<sub>v</sub> = −(kT/Ω) ln(C/C₀) = −(kT/Ω) ln(1 + σ), where σ = (C − C₀)/C₀<p class="why">Note the error in CW eq. 3.1.</p>`},
{x:1,q:"If the Gibbs free energy is lowered, why doesn't nucleation always happen spontaneously in a supersaturated solution?",a:`Because of the <b>surface energy</b>. ΔG(r) = 4/3πr³·ΔG<sub>v</sub> + 4πr²·γ. At small r the positive surface term (∝ r²) dominates the negative volume term (∝ r³), so there is an <b>energy barrier</b> to forming a stable nucleus.`},
{q:"Give the critical radius r* and the energy barrier ΔG*. What happens to nuclei smaller or larger than r*?",a:`r* = −2γ/ΔG<sub>v</sub><br>ΔG* = 16πγ³ / (3ΔG<sub>v</sub>²)<br>Nuclei with r &lt; r* dissolve. Nuclei with r &gt; r* are stable and grow.<p class="why">Note the error in CW eq. 3.6.</p>`},
{q:"How can you reduce r* and ΔG* to get small nanoparticles from a supersaturated medium?",a:`<ol><li><b>Reduce γ</b> (solvent choice, surfactants; lower T also tends to reduce γ)</li><li>Make ΔG<sub>v</sub> <b>more negative</b> by increasing the supersaturation σ</li></ol>`},
{x:1,q:"Explain regions I, II and III in the LaMer diagram (concentration vs time). How do you get a narrow size distribution?",a:`<ul><li><b>I</b>: concentration rises above solubility but below the minimum for nucleation. No nucleation.</li><li><b>II</b>: the critical concentration for homogeneous nucleation is exceeded. Burst nucleation plus growth lowers the concentration.</li><li><b>III</b>: concentration is below the nucleation threshold. <b>Only growth</b>, until equilibrium solubility.</li></ul>For a <b>narrow distribution</b>, keep region II <b>as short as possible</b> so all nuclei form at the same time, then let them grow together.`},
{x:1,q:"How can you control particle size and size distribution through homogeneous nucleation?",a:`Supersaturation (via concentration and temperature) controls nucleation. The <b>time spent in the nucleation regime</b> controls the size distribution, and the <b>time allowed for growth</b> afterwards controls the final size. Heterogeneous nucleation complicates this.`},
{x:1,q:"What determines the nucleation rate and the growth rate in solution?",a:`<ul><li>Nucleation rate: <b>degree of supersaturation</b> and <b>temperature</b></li><li>Growth rate: <b>concentration</b> and <b>temperature</b> (diffusion, surface reaction)</li></ul>`},
{x:1,q:"Name ways to stop nanoparticle growth abruptly.",a:`<ul><li>Add a <b>capping agent</b> that blocks the growth surface</li><li><b>Quench</b> (rapid cooling) to stop the kinetics</li><li>Rapid dilution (less abrupt)</li></ul>`},
{x:1,q:"Why can the size distribution of a nanoparticle batch be important?",a:`Properties are size-dependent (band gap, optical absorption, magnetic behaviour, melting point). A broad size distribution gives a <b>distribution of properties</b> instead of the same property for every particle.`},
{x:1,q:"What is the general method for colloidal synthesis of metallic nanoparticles? Which chemical roles are needed?",a:`<b>Reduction of metal complexes in dilute solution.</b><ul><li>Metal <b>precursor</b> (salt or metal-organic, e.g. HAuCl₄)</li><li><b>Solvent</b> (often water, very dilute)</li><li><b>Reducing agent</b> (citrate, NaBH₄, H₂, ethylene glycol)</li><li><b>Capping agent / polymer stabilizer</b> (PVP, PVA, PEG, citrate)</li></ul>Heating, stirring, and often a controlled atmosphere.`},
{q:"How are monosized metallic nanoparticles achieved in most colloidal syntheses, and why does this work?",a:`A combination of a <b>low solute concentration</b> and a <b>polymeric monolayer</b> on the growth surface. Both hinder diffusion of growth species, so growth becomes <b>diffusion-limited</b>.<p class="why">In diffusion-limited growth, small particles grow relatively faster than large ones, so the size distribution narrows.</p>`},
{q:"Outline the classic citrate synthesis of Au nanoparticles.",a:`<ol><li>Dissolve HAuCl₄ in about 20 mL water, giving a very dilute ≈ 2.5·10⁻⁴ M solution.</li><li>Bring to a boil and add 1 mL of 0.5 % sodium citrate (reducing agent, which also stabilizes).</li><li>Keep at 100 °C until the colour changes to red.</li></ol>The result is a stable sol of about 20 nm, uniform particles.`},
{q:"Outline the Pd nanoparticle synthesis from PdCl₂ shown in the lecture.",a:`Dilute aqueous PdCl₂ with polyvinyl alcohol (PVA) as polymer stabilizer.<ol><li>Hydrolysis with Na₂CO₃: PdCl₂ + 2OH⁻ → Pd(OH)₂ + 2Cl⁻</li><li>Reduction with H₂ gas: Pd(OH)₂ + H₂ → Pd + 2H₂O</li></ol>`},
{x:1,q:"How does the strength of the reducing agent affect nanoparticle size?",a:`<ul><li><b>Strong</b> reducing agent (e.g. NaBH₄): fast reaction, many nuclei at once, <b>smaller</b> particles</li><li><b>Weak</b> reducing agent (e.g. citrate): slow reaction, <b>larger</b> particles</li></ul>Type, concentration and pH of the reducing agent affect size, size distribution and morphology.`},
{q:"Sodium citrate vs citric acid as reducing agent: what morphology does each give?",a:`<ul><li>Sodium citrate: <b>spherical</b> particles</li><li>Citric acid: <b>faceted</b> particles (trigons or thin trigonal platelets with {111} facets)</li></ul>`},
{x:1,q:"What three functions can polymers have during nanoparticle synthesis?",a:`<ol><li><b>Stabilization agents</b>: form a monolayer that prevents agglomeration</li><li><b>Growth-limiting agents</b>: require full surface coverage</li><li><b>Growth-directing agents</b>: bind selectively to certain facets. The effect depends on the surface chemistry, solvent and temperature (e.g. Pt shapes change with the sodium polyacrylate:Pt ratio).</li></ol>`},
{q:"Electrochemical synthesis of metal nanoparticles (Pd, Ni, Co): how does it work, and how is size controlled?",a:`<ol><li>Apply an electric field.</li><li>The metal anode dissolves.</li><li>Metal ions migrate through the electrolyte, are reduced at the cathode and stabilized by additives in the electrolyte.</li></ol><b>Higher current density gives smaller nanoparticles.</b>`},
{x:1,q:"What measures favour homogeneous nucleation and suppress heterogeneous nucleation in a synthesis?",a:`Clean, flaw-free glassware, high-purity chemicals with no dust or seeds, and a <b>rapid increase in concentration</b> so the critical supersaturation for homogeneous nucleation is reached quickly.`},
{x:1,q:"Write Young's equation for a nucleus on a substrate and explain the terms.",a:`<b>γ<sub>sv</sub> = γ<sub>fs</sub> + γ<sub>vf</sub> cos θ</b><ul><li>γ<sub>sv</sub>: substrate–vapour</li><li>γ<sub>fs</sub>: nucleus (film)–substrate</li><li>γ<sub>vf</sub>: vapour–nucleus</li><li>θ: contact angle, which depends only on the surface properties of the phases</li></ul>`},
{x:1,q:"What is wetting, and how does it affect the competition between heterogeneous and homogeneous nucleation?",a:`Wetting is how well a phase spreads on a surface, measured by the contact angle θ. Good wetting (small θ) lowers the heterogeneous nucleation barrier:<br>ΔG*<sub>het</sub> = f(θ)·ΔG*<sub>hom</sub>, f(θ) = (2 − 3cos θ + cos³θ)/4 ≤ 1<p class="why">So good wetting favours heterogeneous nucleation.</p>`},
{x:1,q:"Wetting factor f(θ): what happens at θ = 180°, 0 < θ < 180°, and θ = 0°?",a:`<ul><li>θ = 180° (no wetting): f = 1, so ΔG*<sub>het</sub> = ΔG*<sub>hom</sub>. Hetero and homo are <b>equally favoured</b>.</li><li>0 &lt; θ &lt; 180° (partial wetting): f &lt; 1, heterogeneous is favoured</li><li>θ = 0° (complete wetting): f = 0, no barrier</li></ul>`},
{q:"Explain the stable, metastable and labile zones in a solubility–supersolubility diagram, and how to move from stable to labile.",a:`<ul><li><b>Stable</b> (undersaturated): crystallization impossible</li><li><b>Metastable</b>: spontaneous crystallization improbable, but growth on seeds is possible (heterogeneous)</li><li><b>Labile</b>: spontaneous (homogeneous) crystallization probable</li></ul>Move from stable to labile by: (1) cooling at constant solvent content, (2) evaporating solvent, or (3) a combination.`},
{x:1,q:"Propose a synthesis of bimetallic A–B nanoparticles (core–shell or dumbbell) based on heterogeneous nucleation.",a:`<ol><li>Make seeds of metal A by colloidal synthesis (precursor + reducing agent + capping agent), then clean them.</li><li>Disperse the seeds and add the B precursor with a <b>mild</b> reducing agent.</li><li>Keep supersaturation <b>low</b> (in the metastable zone, controlled T and slow addition), so B nucleates on A instead of forming separate particles.</li></ol>Example from the lecture: Fe₃O₄ seeds + Ag acetate + oleylamine in toluene give Fe–Ag particles.`},
{q:"Outline the synthesis of Fe nanoparticles by thermal decomposition from the lecture.",a:`Precursor: <b>iron oleate</b>. Reducing and stabilizing agent: <b>oleic acid</b>. Reaction medium: <b>octadecene</b>. The precursor decomposes at high temperature, followed by nucleation and growth.`},
{q:"What are the two categories of bottom-up nanoparticle synthesis?",a:`<ol><li><b>Thermodynamic equilibrium approach</b>: nucleation followed by growth (colloidal, sol-gel)</li><li><b>Kinetic approach</b>: confine the amount of precursor or space (microemulsions/micelles, aerosol/spray pyrolysis, template-based deposition, growth termination)</li></ol>`}
]},

{id:"solgel", name:"Sol-gel, micelles & kinetic control", lec:"L5–L6 · CW 3.2.4–3.6", cards:[
{q:"What is sol-gel processing, and what is it mostly used for?",a:`A wet-chemical route where a colloidal solution (<b>sol</b>) is generated and then converted into a viscous <b>gel</b> and finally a solid. It proceeds by <b>hydrolysis and polycondensation</b> of precursors (often metal alkoxides M(OR)<sub>n</sub>). It is mostly used for <b>metal oxides</b> (SiO₂, TiO₂ …).`},
{x:1,q:"Explain briefly: hydrolysis, oxolation, alkoxolation.",a:`<ul><li><b>Hydrolysis</b>: water breaks an M–OR bond and an –OR group is replaced by –OH: M–OR + H₂O → M–OH + ROH (partial or complete)</li><li><b>Oxolation</b>: condensation where the <b>leaving group is water</b>: M–OH + HO–M → M–O–M + H₂O</li><li><b>Alkoxolation</b>: condensation where the <b>leaving group is an alcohol</b>: M–OR + HO–M → M–O–M + ROH</li></ul>Both condensations form <b>metal–oxo bridges</b>.`},
{q:"List the six steps of sol-gel processing.",a:`<ol><li><b>Sol</b>: stable solution via hydrolysis and partial condensation</li><li><b>Gel</b>: formation of metal–oxo bonds into a 3D network</li><li><b>Aging</b>: condensation continues, the gel shrinks and densifies, solvent is expelled</li><li><b>Drying</b>: water and volatiles removed</li><li><b>Dehydration</b>: surface M–OH removed by calcination at about 800 °C</li><li><b>Thermal treatment</b> (&gt; 800 °C): densification by sintering and grain growth</li></ol>`},
{x:1,q:"Xerogel vs aerogel: how is each made, and what are they like?",a:`<ul><li><b>Xerogel</b>: solvent removed by <b>evaporation</b>. Extreme shrinkage (&gt; 90 %), densification.</li><li><b>Aerogel</b>: solvent removed by <b>supercritical drying</b>. The gel keeps its structure, shrinkage &lt; 15 %, very low density.</li></ul>`},
{x:1,q:"What conditions are needed to make an aerogel, and why?",a:`<b>Supercritical drying.</b> Above the critical point there is no liquid–gas interface and therefore no surface tension. That avoids the capillary forces from a receding meniscus, which would otherwise collapse and densify the gel network.`},
{x:1,q:"Why can't you make metallic nanoparticles by a typical sol-gel route? What is sol-gel ideal for?",a:`Gel formation builds <b>M–O–M (metal–oxo) bridges</b>, so the product is an oxide. Sol-gel is ideal for <b>metal oxides</b> (and hybrid organic–inorganic materials).`},
{q:"Effect of pH on sol-gel: acid- vs base-catalysed.",a:`<ul><li><b>Acid-catalysed</b>: hydrolysis is fast and condensation slower. Gives linear, weakly branched chains and polymeric gels (good for films and fibres).</li><li><b>Base-catalysed</b>: condensation is fast. Gives highly branched clusters and discrete colloidal particles (as in the Stöber process).</li></ul>`},
{q:"Describe the Stöber process. What controls the particle size?",a:`Controlled synthesis of <b>spherical SiO₂ particles</b> (50 nm–2 µm). Ethanol + water + <b>ammonia (catalyst)</b>, then <b>TEOS</b> (tetraethyl orthosilicate) is added at room temperature. TEOS hydrolyses and condenses into Si–O–Si (siloxane) bonds.<br>Size is controlled by the precursor, solvent, and amounts of water and ammonia. <b>Higher NH₄OH concentration gives larger particles.</b>`},
{q:"List the advantages of sol-gel processing.",a:`<ul><li>Versatile: control of porosity and particle size; can incorporate nanoparticles and organics</li><li>Extended composition range, including hybrid organic–inorganic materials</li><li>Better homogeneity (mixing at the molecular level) and high purity</li><li>Low processing temperature, so less energy</li><li>Many product forms: coatings, films, monoliths, fibres, powders, membranes</li><li>Inexpensive equipment</li></ul>`},
{q:"Vapour-phase nanoparticle synthesis: key principles.",a:`<ul><li>The same nucleation fundamentals as in liquids</li><li>Needs elevated temperature and often vacuum</li><li>Particles nucleate homogeneously once sufficient supersaturation is reached, often depositing on a substrate</li><li>Nucleation relieves the supersaturation, then growth follows</li><li><b>Rapid quenching</b> stops growth (remove the source or slow the kinetics)</li><li>Long deposition times lead to agglomerates on the surface</li></ul>`},
{x:1,q:"What does 'kinetically confined' synthesis mean? List the categories.",a:`Growth is limited by a <b>finite amount of precursor</b> or a <b>finite amount of space</b>.<ul><li>Liquid droplets in a liquid (micelles, microemulsions)</li><li>Liquid droplets in a gas (aerosol, spray pyrolysis)</li><li>Template-based synthesis</li><li>Growth termination / self-terminating synthesis (capping)</li></ul>`},
{q:"Define surfactant, micelle, microemulsion and colloidal system.",a:`<ul><li><b>Surfactant</b>: molecule with a hydrophilic polar head and a hydrophobic hydrocarbon tail (e.g. CTAB, AOT, SDS)</li><li><b>Micelle</b>: an aggregate of surfactant molecules dispersed in a liquid</li><li><b>Microemulsion</b>: a <b>thermodynamically stable</b> dispersion of two immiscible liquids, stabilized by surfactant</li><li><b>Colloidal system</b>: a multiphase system where at least one phase consists of particles smaller than 1 µm</li></ul>`},
{q:"What do surfactants lower? Name the four surfactant types.",a:`They lower the surface tension of a liquid, the interfacial tension between two liquids, and the interfacial tension between a liquid and a solid.<br>Types: <b>nonionic, anionic, cationic, amphoteric</b>.`},
{x:1,q:"What is the critical micelle concentration (CMC)?",a:`The <b>minimum surfactant concentration at which micelles form</b>. It is reached once the surface/interface is saturated with surfactant and the solubility of single surfactant molecules in the bulk is exceeded.`},
{x:1,q:"Micelles vs reverse micelles: what's the difference, and which is normally used for nanoparticle synthesis? Why?",a:`<ul><li><b>Micelle</b>: in a polar (water) phase. Tails point inward, heads outward.</li><li><b>Reverse micelle</b>: water droplets in oil. Heads point inward to the water core, tails outward into the oil.</li></ul><b>Reverse micelles</b> are normally used. Metal precursors and reducing agents dissolve easily in the aqueous core, which acts as a size-limited nanoreactor.`},
{x:1,q:"Is (reverse) micelle formation enthalpy- or entropy-driven? Does the CMC increase or decrease on heating?",a:`<b>Enthalpy-driven</b>, because configurational entropy decreases when the surfactants assemble. On heating, the −TΔS term becomes more important, so the <b>CMC increases</b>.`},
{q:"Which factors control the structures surfactants form (micelles, cylinders, lamellae, 'onions')?",a:`<ul><li>Surfactant <b>shape</b> (head and tail geometry, single or multi-branched)</li><li><b>Water/oil phase ratio</b></li><li><b>Surfactant concentration</b>: enough to cover the interface? Higher concentration gives cylinders, lamellar phases, onion phases</li><li><b>Temperature and pressure</b></li></ul>`},
{x:1,q:"How do reverse micelles act as nanoreactors?",a:`Reverse micelles undergo <b>Brownian motion</b>. When they collide, they can merge, <b>exchange their aqueous content</b>, and then re-form into two micelles. If one set contains the metal precursor and the other the reducing agent, reduction happens inside the confined water droplets.<br>Two routes: <b>two microemulsions</b> mixed, or <b>one microemulsion</b> with the precursor to which the reducing agent is added.`},
{x:1,q:"Which chemicals are needed for metallic nanoparticle synthesis with reverse micelles? State the purpose of each.",a:`<ul><li><b>Metal precursor</b>: metal source</li><li><b>Reducing agent</b>: reduces the metal ions</li><li><b>Water</b>: dissolves the precursor and reducing agent (micelle core)</li><li><b>Oil</b>: continuous matrix phase outside the micelles</li><li><b>Surfactant</b> (± co-surfactant such as butanol): forms the micelles</li></ul>Example: water / isooctane / AOT with PdCl₂ + NaBH₄ gives Pd nanocrystals.`},
{x:1,q:"How can you control particle size in reverse-micelle synthesis?",a:`Through the <b>water-to-surfactant ratio w = [H₂O]/[surfactant]</b> (and the water/oil/surfactant ratios), which sets the micelle size, and the precursor concentration.<p class="why">w &lt; 10: water is "bound" to the surfactant heads. w &gt; 10: "free" water.</p>`},
{x:1,q:"Propose a method for making large quantities of multi-cation oxide nanoparticles (e.g. for sintering ceramics). Justify it.",a:`<b>Spray pyrolysis</b>: a precursor solution (usually aqueous salts) is atomized into droplets, which are carried through a hot furnace where they dry and decompose. <b>Each droplet becomes one particle</b> (kinetically confined, droplets in gas).<p class="why">It is a continuous reactor, so it scales well. Mixing at the solution level gives complex stoichiometries. Size is set by the nozzle and furnace temperature. Sol-gel, co-precipitation or hydrothermal routes are also reasonable.</p>`},
{q:"Growth termination: explain the CdS example.",a:`Colloidal CdS from cadmium acetate + sodium sulfide in methanol/water, a single phase. <b>Thiophenol</b> acts as a capping agent that binds to the surface and stops growth. <b>Higher capping-agent concentration gives smaller particles.</b>`},
{x:1,q:"Discuss different approaches to controlling nanoparticle size and size distribution during synthesis.",a:`<ul><li><b>Thermodynamic</b>: control nucleation (supersaturation, burst nucleation, LaMer) and growth time</li><li><b>Kinetic confinement</b>: limit volume or precursor with reverse micelles, aerosol droplets or templates</li><li><b>Temperature</b>: quench to stop growth</li><li><b>Capping agents</b>, polymers and surfactants: limit or direct growth</li></ul>`},
{q:"How did the lecture make magnetic-core / silica-shell (hybrid) particles?",a:`Disperse Fe₂O₃ nanoparticles with <b>CTAB</b> (surfactant) in ethanol/water, add <b>TEOS</b> and run a sol-gel reaction (ultrasound + shaking), hydrothermal treatment (120 °C, 48 h), then calcination (400 °C, 8 h) to remove the CTAB. The result is magnetic nanoparticles in a (porous) silica matrix.`}
]},

{id:"oned", name:"1D nanostructures", lec:"L7–L8 · CW 4", cards:[
{q:"Give approximate aspect ratios (L/d) for nanorods, nanotubes and nanowires.",a:`Rods: L/d ≈ 3–10<br>Tubes: L/d ≈ 10–20<br>Wires/fibres: L/d &gt; 100`},
{q:"List the main synthesis approaches for 1D nanostructures.",a:`<ul><li><b>Spontaneous growth</b> (bottom-up): evaporation–condensation (VS), dissolution–condensation, VLS, SLS, stress-induced recrystallization</li><li><b>Template-based</b> (bottom-up): electrochemical and electrophoretic deposition, template filling</li><li><b>Electrospinning</b> (bottom-up)</li><li><b>Lithography</b> (top-down/hybrid)</li></ul>`},
{q:"What drives spontaneous growth, and what is needed for 1D growth specifically?",a:`A reduction of Gibbs free energy (or chemical potential), via recrystallization or a decrease in supersaturation. For 1D, growth must be <b>anisotropic</b>: faster in one direction than the others.`},
{x:1,q:"How can anisotropic (1D) growth be achieved?",a:`<ul><li><b>Anisotropic surface energy</b>: different facets grow at different rates</li><li><b>Crystal imperfections</b>, especially screw dislocations</li><li>Preferential accumulation or <b>poisoning</b> of specific sites (impurities, capping agents)</li><li>A <b>catalyst</b> droplet directing the growth (VLS)</li></ul>`},
{q:"List the six elementary steps of crystal growth from a vapour or solution.",a:`<ol><li>Diffusion of growth species from the medium to the surface</li><li>Adsorption (and desorption) on the surface</li><li>Surface diffusion</li><li>Irreversible incorporation into the crystal (rate-limiting at low supersaturation)</li><li>Desorption of by-products</li><li>Diffusion of by-products away</li></ol>`},
{x:1,q:"Adsorption-limited vs surface-growth-limited growth: what's the difference, and what happens if you keep increasing the concentration?",a:`<ul><li><b>Adsorption/desorption-limited</b> (low concentration): rate depends on concentration. Species have time to find high-energy sites, giving uniform coverage and anisotropic growth.</li><li><b>Surface-growth-limited</b> (high concentration): rate is independent of concentration. Species stick anywhere, giving defects and secondary and heterogeneous nucleation.</li></ul>If the concentration keeps increasing, you eventually get <b>homogeneous nucleation in the medium</b>, which makes nanoparticles instead of wires or films.`},
{x:1,q:"Why and how can a screw dislocation give rise to 1D growth?",a:`An adatom is most stable where it forms the <b>most bonds</b> (kink &gt; step &gt; terrace). A screw dislocation that comes out at the surface gives a <b>step that never disappears</b> as atoms are added. Growth spirals around it continuously in one direction, so the crystal grows fast along the dislocation axis.`},
{x:1,q:"Describe the vapour–solid (evaporation–condensation) growth mechanism.",a:`Growth species are evaporated (high T), transported, and condense directly on a substrate <b>without a catalyst</b>. Nucleation happens at a surface defect or step (often a screw dislocation), which allows anisotropic growth. Examples: Sn nanowires, ZnO nanobelts.<p class="why">By analogy, VS growth is like homogeneous nucleation and VLS like heterogeneous nucleation.</p>`},
{q:"What is dissolution–condensation growth? Give the Ag nanowire example.",a:`Growth species first dissolve in a solvent, diffuse through it and deposit on a surface.<br><b>Ag nanowires (polyol):</b> PtCl₂ is reduced by ethylene glycol at about 160 °C to Pt seeds. AgNO₃ is reduced by ethylene glycol, and Ag nucleates heterogeneously on the Pt (close lattice match). <b>PVP</b> directs growth into uniform wires with aspect ratio up to about 1000.`},
{q:"How are Au nanorods made by seed-mediated growth?",a:`<ol><li>Make seeds by reducing HAuCl₄ to small Au crystals.</li><li>Make a growth solution with HAuCl₄ (mildly reduced) in the presence of <b>CTAB</b>.</li><li>Add the seeds. CTAB binds selectively to certain facets and <b>directs anisotropic growth</b> into rods (or bipyramids and other shapes).</li></ol>`},
{x:1,q:"Explain the VLS (vapour–liquid–solid) mechanism step by step.",a:`<ol><li>A metal catalyst nanoparticle (e.g. Au) is deposited on the substrate.</li><li>The substrate is heated, and the catalyst forms <b>liquid droplets</b> (often a eutectic alloy with the growth species, e.g. Au–Si).</li><li>Growth species from the vapour dissolve into the droplet.</li><li>When the droplet becomes <b>supersaturated</b>, the solid precipitates at the liquid–solid interface, giving one-directional growth.</li></ol>The droplet size stays about the same and acts as a template that limits lateral growth.`},
{x:1,q:"In VLS growth, how do you control the diameter and the length of the nanowires?",a:`<ul><li><b>Diameter</b>: set by the <b>catalyst droplet size</b></li><li><b>Length</b>: set by the <b>growth time</b> (and supersaturation / precursor flux)</li></ul>`},
{q:"What requirements must a VLS catalyst meet?",a:`<ul><li>It forms a <b>liquid solution/alloy</b> with the growth species at the growth temperature (check the phase diagram, e.g. the Au–Si eutectic)</li><li>The growth species is more soluble in the liquid than in the solid</li><li>It is preferably <b>inert</b> and does not react with the gas precursor</li></ul>`},
{x:1,q:"Compare VLS and VS growth: advantages and limitations.",a:`<b>VLS</b>: the catalyst lowers the activation energy, so growth happens at <b>lower T</b> and is easier to control in size and morphology. It is the most successful route to single-crystal nanowires. Drawback: catalyst contamination.<br><b>VS</b>: no catalyst and a simpler, more scalable setup. But it needs <b>higher T</b>, gives poor control of diameter, length, position and orientation, and is prone to secondary nucleation.`},
{x:1,q:"What is SLS (solution–liquid–solid) growth, and when could it be preferred over VLS?",a:`It works like VLS, but the precursor is supplied from a <b>solution</b> and growth happens at <b>lower T</b> (e.g. InP wires: In(t-Bu)₃ + PH₃ with In droplets as catalyst).<br>Prefer SLS when no suitable volatile or stable gas precursors exist, when the product is not stable at VLS temperatures, or when a suitable catalyst for VLS is lacking.`},
{q:"How can a thin metal film be turned into catalyst particles for VLS or CNT growth?",a:`Heat it. The film <b>dewets</b> and breaks up into droplets (Rayleigh instability) to lower its surface/interface energy. The film thickness controls the droplet size.`},
{x:1,q:"Pick a 1D growth method for each and justify: (a) Ge or InAs wires (b) Cu or Ag wires (c) polymer nanofibres (d) complex oxide (e.g. YBCO, PbTiO₃) rods",a:`<ul><li>(a) Covalent semiconductors: <b>VLS</b> (CVD or MBE precursor + metal catalyst). Catalyst size gives diameter, time gives length.</li><li>(b) Metals: <b>electrochemical deposition into a template</b> (AAO or a lithographic pattern), or dissolution–condensation with seeds + PVP. VLS is generally not suitable for metals.</li><li>(c) Polymers: <b>electrospinning</b>. Fast and cheap.</li><li>(d) Complex oxides: <b>sol-gel template filling</b> (or electrophoretic deposition) into a porous template, then calcination and template removal.</li></ul>`},
{q:"What is template-based synthesis? Give examples of templates.",a:`The template is a skeleton that the material grows inside or around, giving a complementary shape. It is <b>removed at the end</b>.<ul><li>Membranes with nano-channels (anodic alumina AAO, track-etched polycarbonate)</li><li>Self-assembled surfactants or block copolymers</li><li>Biotemplates (e.g. butterfly wing scales)</li><li>Step edges on a substrate surface</li></ul>`},
{q:"What are the requirements for a good template?",a:`<ul><li>Compatible with the process conditions</li><li>Chemically and thermally inert</li><li>Good wettability by the precursor</li><li>Provides a starting point for deposition</li><li>Possible to remove afterwards</li></ul>A diffusion-limited process is preferred. Note the trade-off: inertness and good wetting can be hard to combine.`},
{q:"Electrochemical deposition into a template: mechanism, materials, and the Cu nanowire example.",a:`Charged species diffuse through the solution under an applied field and are <b>reduced at the electrode</b>. It only works for <b>electrically conductive</b> materials (metals, alloys, semiconductors, conductive polymers).<br><b>Cu nanowires:</b> anodize Al (sulphuric/oxalic acid) to porous alumina (AAO), electrodeposit Cu from CuSO₄/H₃BO₃, then etch the alumina away with H₃PO₄. Result: wires about 35–40 nm wide and 14–16 µm long.`},
{x:1,q:"Electrophoretic vs electrochemical deposition: how do they differ?",a:`<b>Electrophoresis</b>: <b>charged colloidal particles</b> (a sol) move in an electric field. Velocity depends on the zeta potential, and the particles coagulate at the electrode when their double layer collapses.<ul><li>Needs a <b>higher voltage</b></li><li>The material does <b>not need to be conductive</b></li></ul>Example: TiO₂ sol into a polycarbonate membrane on Cu (0.3–0.8 V), then dried and annealed at 500 °C, which also burns away the membrane.`},
{x:1,q:"Template filling: principle, important considerations, and techniques.",a:`A liquid precursor fills the template pores and is then heat-treated to solidify. It is the most straightforward and versatile method. <b>Capillary forces</b> drive the filling.<br>Considerations: good wetting, chemical inertness, interaction between filling and walls.<br>Techniques: colloidal dispersion filling, melt or solution filling, CVD, centrifugation.`},
{x:1,q:"Outline a template route to oxide nanotubes (e.g. TiO₂), including how the template is made and removed.",a:`<ol><li>Make an <b>AAO template</b> by anodizing aluminium (porous channels).</li><li>Prepare a sol, e.g. a Ti alkoxide with a complexing agent.</li><li>Fill or coat the pore walls (dipping or electrophoresis). Partial filling of the walls gives tubes, full filling gives rods.</li><li>Dry and gel, then <b>calcine</b> to crystalline TiO₂.</li><li><b>Remove the template</b> by dissolving the alumina (strong base or acid such as NaOH or H₃PO₄).</li></ol><p class="why">A template is needed because there is no driving force for TiO₂ to self-assemble into tubes.</p>`},
{x:1,q:"Explain the principle of electrospinning. What materials can it make?",a:`A precursor solution is pushed through a metallic tip connected to a <b>high voltage</b>. The field deforms the droplet into a <b>Taylor cone</b>. When the electric force overcomes the <b>surface tension</b>, a thin jet is ejected, stretches and whips, the solvent evaporates, and fibres collect on a grounded substrate (the counter-electrode).<br>Materials: <b>polymers</b> directly. <b>Ceramic fibres</b> come from polymer + metal salt (e.g. PVP + zinc acetate in DMF), then calcination gives ZnO fibres, which can be porous.`}
]},

{id:"films1", name:"Thin films: growth & PVD", lec:"L11–L12 · CW 5.1–5.4", cards:[
{q:"Which two processes do all thin film deposition methods have in common?",a:`<ol><li><b>Transfer of material</b> to the substrate (depends on the method)</li><li><b>Heterogeneous nucleation and growth</b> at the surface (general): adsorption, surface diffusion, clustering, growth</li></ol>`},
{q:"How does the nucleation rate affect thin film morphology?",a:`<ul><li><b>High</b> nucleation rate: many small nuclei, a fine-grained film that becomes continuous early</li><li><b>Low</b> nucleation rate: few nuclei that grow into large islands or grains</li></ul>`},
{x:1,q:"Describe the three thin film growth modes and relate each to wetting.",a:`<ul><li><b>Volmer–Weber (island)</b>: growth species bind more strongly to each other than to the substrate. <b>Poor wetting, large θ.</b></li><li><b>Frank–van der Merwe (layer-by-layer)</b>: species bind strongly to the substrate. <b>Good wetting, small θ.</b></li><li><b>Stranski–Krastanov (layer, then island)</b>: layers first, then islands after a <b>critical thickness h<sub>c</sub></b>, often due to built-up strain energy.</li></ul>`},
{x:1,q:"Which growth mode(s) give (a) a very flat transparent conductor for touch screens and (b) a rough, superhydrophobic surface?",a:`<ul><li>(a) <b>Frank–van der Merwe</b> (layer-by-layer)</li><li>(b) <b>Volmer–Weber</b> or <b>Stranski–Krastanov</b> (island growth gives mesoscopic roughness)</li></ul>`},
{q:"Which conditions give single-crystal, polycrystalline and amorphous films?",a:`<ul><li><b>Single crystal</b>: close lattice match with the substrate, few impurities, <b>high T</b> (high surface mobility), <b>low growth rate</b></li><li><b>Amorphous</b>: low T and/or high growth rate</li><li><b>Polycrystalline</b>: intermediate conditions</li></ul>`},
{x:1,q:"What is the main difference between PVD, CVD and chemical solution deposition (CSD)?",a:`<ul><li><b>PVD</b>: gas-phase species from a physical source (evaporation, sputtering, ablation). <b>No chemical reaction intended.</b></li><li><b>CVD</b>: volatile precursors that <b>react chemically</b> at or near the substrate</li><li><b>CSD</b>: precursors in a <b>liquid solvent</b>, with chemical reaction or precipitation, then heat treatment</li></ul>`},
{x:1,q:"What are the four most common ways of generating vapour from a solid target?",a:`<ol><li>Thermal heating (evaporation)</li><li>Electron beam</li><li>Pulsed laser (ablation)</li><li>Ion sputtering</li></ol>`},
{q:"Thermal evaporation: principle, typical pressure, and main challenge.",a:`Evaporation and condensation at low pressure (10⁻³–10⁻¹⁰ Torr), where the mean free path is very long and molecules don't collide.<br>Challenge: <b>complex materials</b>, because the vapour can have a different composition than the solid.`},
{q:"What is the mean free path, and which deposition parameters does it influence?",a:`The average distance a particle travels between collisions. It influences:<ul><li>direction of evaporated particles (line of sight)</li><li>their energy</li><li>rate of nucleation and deposition</li></ul>`},
{x:1,q:"Describe MBE. Give its strengths and weaknesses.",a:`<b>Molecular beam epitaxy</b>: evaporation from separate elemental <b>effusion (Knudsen) cells</b> in UHV ("atomic spray painting"). Single crystals grow layer by layer.<ul><li>+ the best defect control and purity; atomic-level control; artificial structures via shutters</li><li>− slow (≈ 3 Å/s), very expensive. Oxides are tricky and need ozone.</li></ul>Mainly used for semiconductors (GaAs, GaN), plus oxides and 2D materials in research.`},
{q:"MBE: adsorption-controlled vs shuttered growth?",a:`<ul><li><b>Adsorption-controlled</b>: excess of a volatile species. Only the equilibrium composition sticks, so stoichiometry is self-regulated (e.g. BiFeO₃ with Bi always open, Fe dosed).</li><li><b>Shuttered</b>: open each source in sequence, monolayer by monolayer. Allows artificial or metastable layering (e.g. SrO/TiO₂ layers in SrTiO₃).</li></ul>`},
{q:"Why is ozone used in oxide MBE?",a:`Oxides need strongly oxidizing conditions, but MBE needs low pressure (long mean free path). O₃ has <b>higher oxidizing power per molecule</b> than O₂, so oxides form while the pressure stays low.`},
{x:1,q:"How can layer coverage and film thickness be monitored in situ during growth?",a:`<b>RHEED</b> (reflection high-energy electron diffraction). The specular intensity <b>oscillates</b>, with one period per completed monolayer during layer-by-layer growth.`},
{x:1,q:"Pulsed laser deposition: principle and advantages.",a:`A pulsed laser ablates a target, creating a <b>plasma plume</b> that deposits on the substrate.<ol><li>Versatile: any stable material</li><li>Homogeneous (congruent) evaporation, which preserves the <b>stoichiometry</b> of complex materials</li><li>Fast (tens of nm/min)</li><li>Works over a wide range of background gas pressures, not only UHV</li></ol>Typical use: complex oxides (YBCO, ferroelectrics).`},
{x:1,q:"Explain sputtering, magnetron sputtering, DC vs RF, and reactive sputtering.",a:`An Ar gas plasma forms. <b>Ar⁺</b> ions are accelerated into the target (cathode) and knock atoms loose by <b>momentum transfer</b> (not evaporation). The atoms fly to the substrate.<ul><li><b>Magnetron</b>: a magnetic field confines electrons near the target, sustaining the plasma at lower pressure and increasing the rate</li><li><b>DC</b>: for conductive targets. <b>RF</b>: prevents charge build-up on insulating targets.</li><li><b>Reactive</b>: add O₂ or N₂ to deposit oxides or nitrides</li></ul>`},
{q:"What is preferential sputtering, and why does film composition still come out right?",a:`Some elements sputter more efficiently. The target surface then becomes depleted in those elements until a <b>steady state</b> is reached where the sputtered flux matches the bulk target composition.`},
{q:"E-beam evaporation: one advantage and one disadvantage.",a:`<ul><li>+ Very low contamination from the crucible (only the target spot is heated)</li><li>− Elements evaporate at different rates, so stoichiometry is hard to control for multi-element materials (unlike PLD)</li></ul>`},
{x:1,q:"For a multi-cation oxide film, compare MBE, PLD and chemical solution deposition (quality, cost, rate).",a:`<ul><li><b>Quality/purity</b>: MBE outstanding (needs ozone) &gt; PLD &gt; CSD (varies)</li><li><b>Cost</b>: MBE very expensive, PLD quite expensive, CSD cheap and flexible with respect to substrate geometry</li><li><b>Rate</b>: MBE slow, PLD faster. CSD depends on the type (spin coating gives thin layers, dip coating thicker, spray is continuous).</li></ul>`},
{x:1,q:"Spell out: MBE, PLD, MOCVD, PECVD, LPCVD, ALD, CSD, SAM, LB.",a:`Molecular beam epitaxy · Pulsed laser deposition · Metal-organic CVD · Plasma-enhanced CVD · Low-pressure CVD · Atomic layer deposition · Chemical solution deposition · Self-assembled monolayer · Langmuir–Blodgett (film)`},
{x:1,q:"Suggest a method for growing high-quality epitaxial complex-oxide films, e.g. LaAlO₃ on SrTiO₃ or an oxide superlattice.",a:`<b>MBE or PLD</b>, which give layer-by-layer epitaxial control and stoichiometry. Sputtering or ALD are acceptable. Liquid-based methods (sol-gel, SAM, LB) are not suited to high-quality epitaxy.`}
]},

{id:"films2", name:"CVD, ALD & liquid-phase films", lec:"L12–L14 · CW 5.5–5.11", cards:[
{q:"Define CVD and list its basic steps.",a:`Chemically reacting a <b>volatile precursor</b> (with another gas) to produce a non-volatile solid that deposits on a substrate.<ol><li>Reactive gases enter the chamber</li><li>Activation by heat or plasma</li><li>Reaction at the substrate surface</li><li>Transport of by-products ("waste") away</li></ol>`},
{q:"Name types of CVD and typical CVD reaction types.",a:`<b>Types:</b> MOCVD (metal-organic), PECVD (plasma-enhanced), LPCVD (low pressure), LACVD (laser-assisted), AACVD (aerosol-assisted).<br><b>Reactions:</b> pyrolysis (e.g. SiH₄ → Si + 2H₂), reduction, oxidation, compound formation, disproportionation, reversible transfer.`},
{x:1,q:"What are the common rate-limiting steps in CVD?",a:`Mass transport of reactants to the surface, adsorption, surface diffusion, surface reaction, and desorption or removal of by-products.`},
{x:1,q:"CVD: mass-transport-limited vs reaction-rate-limited regime.",a:`<ul><li><b>Mass-transport limited</b> (high T): reaction is faster than gas delivery. Controlled by gas flow, and uniformity depends on mass transport across the substrate.</li><li><b>Reaction-rate limited</b> (low T / low p): reaction is slower than delivery. Controlled by <b>temperature</b>, and uniformity depends on temperature uniformity.</li></ul>`},
{q:"Compare atmospheric, low-pressure and UHV CVD.",a:`<ul><li><b>APCVD</b>: turbulent flow, very fast (µm/s), mass-transport limited. Can approach homogeneous gas-phase nucleation (nanoparticle production). One wafer at a time.</li><li><b>LPCVD</b>: laminar flow, better gas diffusion, more uniform films, reaction-limited. Wafers can be stacked for higher throughput.</li><li><b>UHVCVD</b>: molecular flow and no gas-phase reactions.</li></ul>`},
{q:"Hot-wall vs cold-wall CVD reactors?",a:`<ul><li><b>Hot wall</b>: heated externally. Uniform temperature, but deposition also on the walls.</li><li><b>Cold wall</b>: only the substrate is heated, so less wall deposition and fewer gas-phase reactions.</li></ul>`},
{x:1,q:"What is PECVD, and what are its main advantages?",a:`A plasma between electrodes (RF or DC) contains energetic electrons that dissociate precursors into reactive <b>radicals</b>, which adsorb and react at the surface.<ul><li><b>Lower deposition temperature</b> (&lt; 300 °C)</li><li>Can deposit materials, or use substrates, with low thermal stability</li><li>Higher reactivity and growth rate; fewer thermally induced defects</li></ul>Examples: diamond films, vertically aligned CNTs.`},
{q:"Compare PVD and CVD.",a:`<ul><li>CVD involves a chemical reaction with the surface (chemisorption). PVD is condensation.</li><li>CVD runs much hotter (≈ 450–1050 °C, unless plasma-enhanced)</li><li>CVD gives good conformal uniformity. PVD is "line of sight" (sputtering is better).</li><li>CVD films are often slightly rougher and polycrystalline</li><li>CVD is cheaper, but uses toxic gases. PVD is "greener".</li></ul>`},
{x:1,q:"Explain ALD with an example.",a:`A <b>cyclic, self-limiting</b> method that adds one monolayer per cycle:<ol><li>Pulse precursor A (e.g. TiCl₄). It reacts with the surface –OH groups until all are used up, then <b>stops</b>.</li><li><b>Purge</b> excess precursor and by-products (HCl).</li><li>Pulse precursor B (H₂O). It hydrolyses the bound Ti–Cl and condensation forms Ti–O–Ti, regenerating –OH.</li><li>Purge, and repeat.</li></ol>Another example: ZnCl₂ / H₂S gives ZnS.`},
{x:1,q:"Advantages and disadvantages of ALD compared with other thin film methods.",a:`<b>+</b> precise thickness control (one monolayer per cycle), <b>conformal coverage</b> of 3D shapes and even powders, low temperature, gentle deposition.<br><b>−</b> slow (≈ 0.5 Å per cycle), and above all the <b>strict precursor requirements</b>, which limit which materials can be grown. By-products may be toxic or corrosive.`},
{x:1,q:"List the requirements for ALD precursors.",a:`<ul><li>Volatile (gas or liquid)</li><li><b>No self-decomposition</b> (or growth is no longer self-limiting)</li><li>Aggressive and complete reactions (short cycles)</li><li>Not corrosive to the film or substrate (no competing reactions)</li><li>Must not dissolve the film</li><li>Non-reactive by-products</li><li>Sufficient purity</li></ul>Bonus: cheap, easy to handle, non-toxic.`},
{q:"Typical materials per deposition method (from the lecture)?",a:`<ul><li><b>MBE</b>: III–V semiconductors, 2D materials, oxides</li><li><b>CVD</b>: poly-Si, SiO₂, Si nitride, tungsten, carbon materials</li><li><b>ALD</b>: high-k oxides (HfO₂, ZrO₂), TiN, TaN, Cu interconnects, noble metals, TiO₂</li><li><b>PLD</b>: complex oxides (YBa₂Cu₃O₇), battery materials</li><li><b>Sputtering</b>: metals and contacts, complex oxides, 2D materials</li></ul>`},
{x:1,q:"What types of sorption exist on a substrate?",a:`<ul><li><b>Adsorption</b>: accumulation on the surface<ul><li><b>Chemisorption</b>: strong ionic or covalent bond with the surface</li><li><b>Physisorption</b>: weak van der Waals or electrostatic interaction</li></ul></li><li><b>Absorption</b>: the substance diffuses <i>into</i> the liquid or solid</li><li><b>Desorption</b>: the reverse of both</li></ul>`},
{x:1,q:"What is a self-assembled monolayer (SAM), and what are the three parts of a SAM molecule?",a:`A molecular monolayer formed by <b>immersing a substrate in a solution of an active surfactant</b> in an organic solvent. Strong <b>chemisorption</b> pins the head group to specific surface sites.<ol><li><b>Head group</b>: binds to the substrate</li><li><b>Alkyl chain</b>: spacer, ordered by van der Waals forces</li><li><b>Terminal functional group</b>: sets the new surface chemistry</li></ol>`},
{q:"Name the three chemisorption bond types for SAMs, with substrate examples.",a:`<ul><li><b>Covalent Si–O</b>: organosilanes (alkyl-/chlorosilanes) on hydroxylated surfaces (SiO₂ on Si, Al₂O₃, glass, TiO₂)</li><li><b>Polar covalent S–metal</b>: alkanethiols and sulfides on Au, Ag, Pt, Cu</li><li><b>Ionic</b>: carboxylic acids, amines or alcohols on metals or ionic substrates (e.g. carboxylic acid on Al₂O₃)</li></ul>`},
{q:"How does an alkylsilane SAM form, and how does an alkanethiol SAM on gold form?",a:`<ul><li><b>Alkylsilane</b> RSiX₃ (X = Cl or alkoxy) in an organic solvent (≈ 5 mM, 2–3 min) on a hydroxylated surface. Si–O–surface bonds form, plus Si–O–Si cross-links between neighbours (surface polymerization).</li><li><b>Alkanethiol</b> X–(CH₂)<sub>n</sub>–SH on Au: oxidative reaction. The S–H bond is cleaved, giving a covalent Au–S bond and H₂.</li></ul>`},
{q:"How can SAMs be stacked into multilayers, and what limits this?",a:`The terminal group of each monolayer must be converted to a <b>hydroxylated</b> surface so the next SAM can bind by condensation. Quality degrades quickly as the number of layers increases.`},
{x:1,q:"What are Langmuir–Blodgett films, and how are they deposited?",a:`Monolayers or multilayers of <b>amphiphilic</b> molecules transferred from a <b>liquid–gas (water–air) interface</b> to a solid substrate.<ol><li>Spread amphiphiles (in a volatile solvent, e.g. CHCl₃) on water.</li><li>A moving <b>barrier compresses</b> them into a dense monolayer (surface pressure kept constant during transfer).</li><li>Transfer by vertical dipping. <b>Hydrophilic substrate: emersion (retraction)</b>, the most common, with heads binding to the surface. <b>Hydrophobic substrate: immersion.</b> Horizontal lifting is used for very rigid films.</li></ol>`},
{x:1,q:"SAM vs Langmuir–Blodgett: what's the key difference, and which suits building a multilayer stack?",a:`<ul><li><b>SAM</b>: molecules <b>chemisorb</b> (react) with a specific substrate from solution</li><li><b>LB</b>: a pre-ordered monolayer is transferred mechanically and held by <b>physisorption</b></li></ul>For many layers on a sensitive device stack, <b>LB</b> is easier since it needs no specific surface reaction. SAMs need a reactive surface for each layer.`},
{q:"Electrodeposition of thin films: key requirement and process variants.",a:`Cations are reduced at the electrode (Mⁿ⁺ + ne⁻ → M) while a corresponding oxidation happens at the other electrode. The <b>deposit must be electrically conductive</b> so further layers can deposit (metals, semiconductors, conductive polymers). It can run at constant or pulsed current or voltage, and post-treatment (heating) may be needed.`},
{x:1,q:"Which thin film methods are combined with sol-gel chemistry?",a:`Chemical solution deposition: <b>spin coating, dip coating, spray coating</b>.`},
{x:1,q:"Dip coating: what sets the film thickness? Does faster withdrawal give a thinner or thicker film?",a:`H = c₁ (ηU₀ / ρg)<sup>1/2</sup>, a balance between viscous drag and gravity.<br><b>Higher withdrawal speed gives a THICKER film.</b> Higher viscosity also gives a thicker film.<br>Other parameters: wetting, immersion time, pH, number of layers, sol age, drying and heat treatment.`},
{q:"Spin coating: stages, and what controls thickness?",a:`Deposit excess solution, spin up (liquid pushed to the edge), spin at constant speed (thinning by fluid ejection), then solvent evaporation thins it further.<br><b>Higher rotation speed or a more dilute (less viscous) sol gives a thinner film.</b> Spin time, acceleration and amount deposited also matter.`},
