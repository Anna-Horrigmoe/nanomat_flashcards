{x:1,q:"Describe the vapour–solid (evaporation–condensation) growth mechanism.",a:`<ol><li>The source material is evaporated at high temperature (e.g. Sn vapour at 700 °C and about 4 kPa).</li><li>The vapour is transported to a cooler substrate where it is supersaturated.</li><li>Species adsorb and diffuse to growth sites, typically a <b>surface defect or step</b>, most often a screw dislocation, which gives anisotropic growth.</li></ol><b>No catalyst</b> is involved. Examples: single-crystal Sn nanowires on Si; ZnO nanobelts (which can roll up into helices and rings to minimize polarization and elastic energy).<p class="why">VS growth is analogous to homogeneous nucleation, and VLS to heterogeneous nucleation.</p>`},
{q:"What is dissolution–condensation growth? Give the Ag nanowire example.",a:`The growth species first <b>dissolve</b> into a solvent or solution, diffuse through it, and <b>deposit</b> onto the growing surface. Only the growth medium differs from evaporation–condensation.<br><b>Ag nanowires (polyol process):</b><ol><li>Pt seeds: PtCl₂ reduced by ethylene glycol at about 160 °C (homogeneous nucleation).</li><li>Ag is produced by reducing AgNO₃ with ethylene glycol.</li><li>Pt and Ag have a close match in crystal structure and lattice constant, so Ag nucleates <b>heterogeneously</b> on the Pt seeds.</li><li>The polymer <b>PVP</b> binds to the side facets and directs growth into uniform nanowires with aspect ratio up to about 1000.</li></ol>`},
{q:"How are Au nanorods made by seed-mediated growth?",a:`<ol><li><b>Seeds</b>: reduce HAuCl₄ quickly (strong reducing agent) to small Au crystals.</li><li><b>Growth solution</b>: HAuCl₄ partly reduced (mild reducing agent) in the presence of <b>CTAB</b>, so it is supersaturated but below the homogeneous nucleation threshold.</li><li><b>Add the seeds</b>: Au deposits only on the seeds. CTAB binds preferentially to certain side facets and <b>directs anisotropic growth</b> into rods. Other conditions give hexahedra, bipyramids and other shapes.</li></ol>`},
{x:1,q:"Explain the VLS (vapour–liquid–solid) mechanism step by step.",a:`<ol><li>Deposit a <b>metal catalyst</b> nanoparticle (e.g. Au) on the substrate, by sputtering or by dewetting a thin film with heat. It should be inert toward the gas precursor.</li><li>Heat the substrate so the catalyst forms <b>liquid droplets</b>, usually a eutectic alloy with the growth species (Au–Si melts at about 363 °C, far below either element).</li><li>The growth species is supplied from the vapour (evaporation, CVD or MBE) and <b>dissolves into the liquid droplet</b>.</li><li>When the droplet becomes <b>supersaturated</b>, the solid precipitates at the <b>liquid–substrate interface</b>. Continued supply gives one-directional growth, and the droplet rides on top of the growing wire.</li></ol><p class="why">The droplet size stays essentially unchanged during growth and acts as a template that strictly limits lateral growth. VLS is the most successful method for single-crystal nanowires in relatively large quantities.</p>`},
{x:1,q:"In VLS growth, how do you control the diameter and the length of the nanowires?",a:`<ul><li><b>Diameter</b>: set by the <b>size of the catalyst droplet</b> (control the catalyst particle size or the thickness of the film that dewets)</li><li><b>Length</b>: set by the <b>growth time</b> (and the supersaturation or precursor flux)</li></ul><p class="why">Position can also be controlled by placing the catalyst with lithography.</p>`},
{q:"What requirements must a VLS catalyst meet?",a:`<ul><li>It must form a <b>liquid solution or alloy</b> with the growth species at the growth temperature. Use the binary phase diagram: e.g. the Au–Si eutectic gives liquid Au–Si droplets.</li><li>The growth species should be <b>more soluble in the liquid catalyst</b> than in the solid wire, so it precipitates out as the solid.</li><li>It should be <b>chemically inert</b>, not forming stable compounds with the precursor or the product.</li></ul>`},
{x:1,q:"Compare VLS and VS growth: advantages and limitations.",a:`<b>VLS</b>:<ul><li>+ The liquid catalyst lowers the activation energy for nucleation and growth (heterogeneous nucleation at the liquid–solid interface), so growth happens at <b>lower temperature</b></li><li>+ Easy control of diameter (droplet size), length (time) and position (catalyst placement)</li><li>− Catalyst contamination of the wire; a suitable catalyst is needed</li></ul><b>VS</b>:<ul><li>+ No catalyst, so no contamination; simpler setup and better scalability</li><li>− Needs <b>higher temperature</b>; poor control of diameter, length, position and orientation; more prone to secondary nucleation</li></ul><p class="why">Example from the lecture: GaN at 950 °C. VLS gave 80 nm wires several µm long but entangled. VS gave aligned 160 nm wires 3 µm long.</p>`},
{x:1,q:"What is SLS (solution–liquid–solid) growth, and when could it be preferred over VLS?",a:`It works like VLS, but the precursors are supplied from a <b>solution</b> at <b>lower temperature</b> (no vacuum). A low-melting metal droplet (e.g. In) acts as the catalyst.<br>Example: InP wires, In(t-Bu)₃ + PH₃ → InP + 3(t-Bu)H.<br><b>Prefer SLS</b> when:<ul><li>no sufficiently volatile or stable gas-phase precursors exist</li><li>the product is not stable at the high temperatures VLS needs</li><li>a suitable catalyst for VLS conditions is lacking</li></ul>`},
{q:"How can a thin metal film be turned into catalyst particles for VLS or CNT growth?",a:`<b>Heat it.</b> A thin film has a large surface and interface energy. When heated, it <b>dewets</b> and breaks up into droplets (a Rayleigh-type instability), lowering its energy.<p class="why">The film thickness controls the droplet size and spacing, and therefore the wire or tube diameter. For precise positions, use lithography instead.</p>`},
{x:1,q:"Pick a 1D growth method for each and justify: (a) Ge or InAs wires (b) Cu or Ag wires (c) polymer nanofibres (d) complex oxide (e.g. YBCO, PbTiO₃) rods",a:`<ul><li>(a) <b>Covalent semiconductors: VLS</b>, with CVD or MBE precursors and a metal catalyst of suitable solubility (from the phase diagram). Catalyst size controls the diameter, growth time the length. SLS is an alternative for InAs.</li><li>(b) <b>Metals: electrochemical deposition into a template</b> (AAO or a lithographically patterned resist made by EBL). Ag wires can also be made by polyol dissolution–condensation with Pt seeds + PVP. VLS is generally not suitable for metals.</li><li>(c) <b>Polymers: electrospinning</b>. Fast, cheap and made for polymers.</li><li>(d) <b>Complex oxides: sol-gel template filling</b> (or electrophoretic deposition) into a porous template, then calcination and template removal. Alternatively PLD, MBE or sputtering combined with a template or lithography.</li></ul>`},
{q:"What is template-based synthesis? Give examples of templates.",a:`A template serves as a <b>skeleton or frame</b>: the material is deposited inside or around it, taking a shape complementary to the template, and the template is <b>removed at the end</b>.<ul><li><b>Membranes with nano-sized channels</b>: porous anodic alumina (AAO), track-etched polycarbonate</li><li><b>Mesoscale structures self-assembled</b> from organic surfactants or block copolymers</li><li><b>Biotemplates</b>: e.g. butterfly wing scales, viruses, DNA</li><li><b>Step edges</b> on the surface of a substrate</li></ul>`},
{q:"What are the requirements for a good template?",a:`<ul><li>Compatible with the process conditions (stable during synthesis)</li><li>Chemically and thermally inert</li><li><b>Good wettability</b> by the solution or vapour</li><li>Provides a starting point for deposition</li><li>Possible to remove afterwards without destroying the product</li></ul><p class="why">A <b>diffusion-limited</b> process is preferred, so deposition fills the pores evenly instead of closing the openings first. Note the trade-off: a template that is inert and also wets well can be hard to find.</p>`},
{q:"Electrochemical deposition into a template: mechanism, materials, and the Cu nanowire example.",a:`<b>Mechanism</b>: (1) charged species (cations) <b>diffuse through the solution</b> under an external electric field; (2) they are <b>reduced at the deposition surface</b>, which is the electrode (Mⁿ⁺ + ne⁻ → M).<br><b>Materials</b>: only <b>electrically conductive</b> ones (metals, alloys, semiconductors, conductive polymers), since the growing deposit must keep conducting.<br><b>Cu nanowires</b>:<ol><li>Anodize aluminium in sulphuric and oxalic acid, giving porous alumina (AAO) with parallel channels.</li><li>Electrodeposit Cu from a CuSO₄/H₃BO₃ solution into the pores.</li><li>Etch the alumina away with H₃PO₄.</li></ol>Result: 35–40 nm diameter and 14–16 µm long wires.`},
{x:1,q:"Electrophoretic vs electrochemical deposition: how do they differ?",a:`<b>Electrophoresis</b>: motion of <b>charged colloidal particles</b> (a stabilized sol) in an electric field. The velocity depends on the <b>zeta potential</b>. At the electrode, the double layer collapses and the particles <b>coagulate</b> into a deposit.<br>Compared with electrochemical deposition:<ul><li>Needs a <b>higher voltage</b></li><li>The material does <b>not need to be electrically conductive</b> (works for oxides)</li><li>Deposits whole particles, not ions reduced one by one</li></ul><p class="why">Example: TiO₂ nanorods from a TiO₂ sol into a track-etched polycarbonate membrane on a Cu electrode (0.3–0.8 V, 60–90 min), dried at 100 °C, then annealed at 500 °C, which also burns away the polymer membrane. Electrostatic or electrosteric stabilization keeps the sol dispersed until it reaches the electrode.</p>`},
{x:1,q:"Template filling: principle, important considerations, and techniques.",a:`A liquid precursor (or precursor mixture) <b>fills the pores</b> of a template. After complete filling, a heat treatment solidifies the filling, giving 1D nanostructures. It is the most straightforward and versatile method.<br><b>Capillary forces</b> draw the liquid into the pores, so <b>good wetting</b> is needed.<br>Considerations: wettability, chemical inertness of the template, and the interaction between the filling and the pore walls (sticking).<br>Techniques: colloidal dispersion filling, melt or solution filling, CVD, deposition by centrifugation.<p class="why">Example: ZnO replicas of butterfly wing scales, made by soaking the wings in Zn(NO₃)₂ in ethanol for 12 h and then calcining.</p>`},
{x:1,q:"Outline a template route to oxide nanotubes (e.g. TiO₂), including how the template is made and removed.",a:`<ol><li><b>Make the template</b>: anodize aluminium, giving porous anodic alumina (AAO) with parallel channels. Pore size is set by the anodization conditions.</li><li><b>Make a sol</b>: e.g. Ti tetrapropoxide or isopropoxide with a complexing agent (citric acid) and a polymerizer (ethylene glycol).</li><li><b>Fill or coat the pores</b> by dipping or electrophoresis. Coating only the walls gives <b>tubes</b>, completely filling gives <b>rods</b>.</li><li><b>Dry and calcine</b>: the gel turns into crystalline TiO₂ and organics burn off.</li><li><b>Remove the template</b> by dissolving the alumina (e.g. in strong base such as NaOH, or in H₃PO₄).</li></ol><p class="why">A template is necessary because there is no driving force for TiO₂ to self-assemble into tubes. A surfactant-based template (tubular micelles) is an alternative.</p>`},
{x:1,q:"Explain the principle of electrospinning. What materials can it make?",a:`<ol><li>A precursor solution is pushed through a <b>metallic needle tip</b> connected to a <b>high voltage</b> source.</li><li>Charges in the droplet make the electric field deform it into a cone, the <b>Taylor cone</b>.</li><li>When the electric force overcomes the <b>surface tension</b> of the droplet, a thin charged <b>jet</b> is ejected.</li><li>The jet stretches and whips (bending instability), the solvent evaporates, and solid nanofibres land on a grounded collector that acts as the counter-electrode.</li></ol><b>Materials</b>: <b>polymers</b> directly (e.g. polypropylene, polyacetylene, PVP). <b>Ceramic fibres</b> come from a polymer + metal salt solution followed by calcination (e.g. PVP + zinc acetate in DMF gives ZnO fibres, with annealing temperature controlling the morphology). Removing the polymer can leave porous fibres.`}
]});

DECKS.push({id:"films1", name:"Thin films: growth & PVD", lec:"L11–L12 · CW 5.1–5.4", cards:[
{q:"Which two processes do all thin film deposition methods have in common?",a:`<ol><li><b>Transfer of material</b> to the substrate. This depends on the method (evaporation, sputtering, chemical reaction, liquid).</li><li><b>Nucleation and growth at the surface</b>. This is general: <b>heterogeneous</b> nucleation through adsorption, surface diffusion, clustering and growth.</li></ol><p class="why">What matters for a film: the substrate–film interface (chemical and structural quality), crystallinity, thickness and smoothness.</p>`},
{q:"How does the nucleation rate affect thin film morphology?",a:`<ul><li><b>High nucleation rate</b> (high supersaturation, low surface mobility): many small nuclei. They merge early into a continuous, fine-grained film.</li><li><b>Low nucleation rate</b> (low supersaturation, high mobility, high T): few nuclei that grow large before meeting. Large islands or grains, and potentially single-crystal or epitaxial films.</li></ul>`},
{x:1,q:"Describe the three thin film growth modes and relate each to wetting (Young's equation).",a:`Young: <b>γ<sub>sv</sub> = γ<sub>fs</sub> + γ<sub>vf</sub> cos θ</b><ul><li><b>Volmer–Weber (island growth)</b>: growth species bind <b>more strongly to each other than to the substrate</b>. Poor wetting, <b>large θ</b> (γ<sub>sv</sub> &lt; γ<sub>fs</sub> + γ<sub>vf</sub>). 3D islands form directly.</li><li><b>Frank–van der Merwe (layer-by-layer)</b>: species bind <b>strongly to the substrate</b>. Good wetting, <b>small θ</b> (θ → 0, γ<sub>sv</sub> ≥ γ<sub>fs</sub> + γ<sub>vf</sub>). Each layer completes before the next starts.</li><li><b>Stranski–Krastanov (layer + island)</b>: first one or more complete layers, then islands after a <b>critical thickness h<sub>c</sub></b>. Usually because <b>strain energy</b> from lattice mismatch builds up with thickness until islands (which can relax) become favourable.</li></ul>`},
{x:1,q:"Which growth mode(s) give (a) a very flat transparent conductor for touch screens and (b) a rough, superhydrophobic surface?",a:`<ul><li>(a) <b>Frank–van der Merwe</b> (layer-by-layer): good wetting gives atomically smooth, continuous layers.</li><li>(b) <b>Volmer–Weber</b> or <b>Stranski–Krastanov</b>: island growth gives mesoscopic roughness. Roughness amplifies the intrinsic hydrophobicity (lotus effect).</li></ul>`},
{x:1,q:"How does wetting affect the growth mode for thin film growth?",a:`<ul><li><b>Good wetting</b> (small contact angle θ): favours <b>layer-by-layer</b> growth (Frank–van der Merwe), and also the first wetting layer(s) in Stranski–Krastanov growth.</li><li><b>Poor wetting</b> (large θ): favours <b>island growth</b> (Volmer–Weber).</li></ul><p class="why">Wetting enters through the cos θ term in Young's equation, γ<sub>sv</sub> = γ<sub>fs</sub> + γ<sub>vf</sub> cos θ.</p>`},
{q:"Which conditions give single-crystal, polycrystalline and amorphous films? Explain why.",a:`<ul><li><b>Single crystal</b> (epitaxial): close <b>lattice match</b> with the substrate, few or no impurities, <b>high temperature</b> (high surface mobility, so atoms reach correct lattice sites), <b>low growth rate</b> (time to find those sites)</li><li><b>Amorphous</b>: <b>low temperature</b> and/or <b>high growth rate</b>. Atoms are buried before they can order. Example: amorphous Si for thin-film solar cells.</li><li><b>Polycrystalline</b>: intermediate conditions</li></ul><p class="why">It is a competition between how fast atoms arrive and how fast they can diffuse to equilibrium sites.</p>`},
{x:1,q:"What is the main difference between PVD, CVD and chemical solution deposition (CSD)?",a:`<ul><li><b>PVD</b> (physical vapour deposition): vapour from a physical source (thermal evaporation, e-beam, laser ablation, sputtering) condenses on the substrate. <b>No chemical reaction is intended.</b> Examples: MBE, PLD, sputtering.</li><li><b>CVD</b> (chemical vapour deposition): volatile precursors <b>react chemically</b> at or near the heated substrate, and the solid product deposits. The reaction is essential. Examples: MOCVD, PECVD, ALD.</li><li><b>CSD</b> (chemical solution deposition): precursors in a <b>liquid</b> are coated (spin, dip, spray), followed by chemical reactions or precipitation and heat treatment. Examples: sol-gel films.</li></ul>`},
{x:1,q:"What are the four most common ways of generating vapour from a solid target?",a:`<ol><li><b>Thermal heating</b>: evaporation from a heated crucible or effusion cell (thermal evaporation, MBE)</li><li><b>Electron beam</b>: a focused e-beam heats a spot on the target (EBPVD)</li><li><b>Pulsed laser</b>: ablation creates a plasma plume (PLD)</li><li><b>Ion sputtering</b>: energetic ions knock out target atoms by momentum transfer</li></ol>`},
{q:"Thermal evaporation: principle, typical pressure, and main challenge.",a:`The simplest PVD: heat the source until it evaporates, and the vapour condenses on a cooler substrate.<br>Done at <b>low pressure (10⁻³–10⁻¹⁰ Torr)</b>, where the mean free path is very long and evaporated molecules travel straight to the substrate without colliding. (1 Torr = 1/760 atm ≈ 133 Pa = 1.33 mbar.)<p class="why">Main challenge: <b>complex materials</b>. Elements have different vapour pressures, so the vapour has a different composition from the solid and the film's stoichiometry is off.</p>`},
{q:"What is the mean free path, and which deposition parameters does it influence?",a:`The <b>average distance a particle travels between collisions</b>. It increases as the pressure decreases (λ ∝ 1/p).<ul><li><b>Direction</b> of the evaporated particles: a long mean free path gives straight "line-of-sight" deposition</li><li><b>Energy</b> of the arriving particles: collisions thermalize them</li><li><b>Rate of nucleation and deposition</b></li></ul><p class="why">In UHV (MBE) there is no gas-phase interaction. In PLD the background gas shapes the plasma plume and so affects uniformity and the energy of the arriving species.</p>`},
{x:1,q:"Describe MBE. Give its strengths and weaknesses.",a:`<b>Molecular beam epitaxy</b>: each element is evaporated from its own <b>effusion (Knudsen) cell</b> in <b>ultra-high vacuum</b>. The beams of atoms hit a heated single-crystal substrate ("atomic spray painting"), and the film grows <b>epitaxially, layer by layer</b>. Shutters in front of each cell control the flux.<ul><li>+ The highest crystalline quality and the <b>best defect control</b>; high purity; <b>atomic-layer control</b>; can make artificial and metastable structures</li><li>+ In situ monitoring with RHEED</li><li>− <b>Slow</b> (≈ 3 Å/s), <b>very expensive</b> (UHV)</li><li>− Oxides are tricky: they need strongly oxidizing conditions, so ozone is used</li></ul>Used in industry for semiconductors (GaAs, GaN), and in research for oxides and 2D materials.`},
{q:"MBE: adsorption-controlled vs shuttered growth?",a:`<ul><li><b>Adsorption-controlled growth</b>: supply a volatile species in <b>excess</b>. Only as much as can bond into the stable compound sticks, and the rest desorbs, so the <b>equilibrium stoichiometry</b> forms automatically. Example: BiFeO₃ with the Bi and O₃ fluxes always open and Fe dosed in monolayer pulses.</li><li><b>Shuttered growth</b>: open the sources one at a time, depositing exactly one monolayer of each (e.g. SrO, then TiO₂ for SrTiO₃). Allows <b>artificial or metastable</b> layer sequences, such as deliberately "missing" layers or superlattices.</li></ul>`},
{q:"Why is ozone used in oxide MBE?",a:`Oxides need strongly oxidizing conditions (e.g. Ti + O₂ → TiO₂), but MBE must keep a <b>low pressure</b> so the atom beams have a long mean free path. O₂ at low pressure is too weakly oxidizing.<p class="why">O₃ has <b>much higher oxidizing power per molecule</b>, so oxides form while the pressure stays low. Oxide MBE is still mainly used in basic research.</p>`},
{x:1,q:"How can layer coverage and film thickness be monitored in situ during growth?",a:`<b>RHEED</b> (reflection high-energy electron diffraction): a high-energy electron beam hits the surface at a grazing angle, and the diffraction pattern appears on a screen.<p class="why">During layer-by-layer growth, the intensity of the specular spot <b>oscillates</b>. It is highest for a smooth, completed layer and lowest at half coverage, when the surface is roughest. One oscillation equals one monolayer, so you can count layers in real time.</p>`},
{x:1,q:"Pulsed laser deposition: principle and advantages.",a:`An intense, short-pulsed <b>laser</b> (Light Amplification by Stimulated Emission of Radiation) hits a target, ablating material into a <b>plasma plume</b> that expands toward the heated substrate.<ol><li><b>Versatile</b>: any (stable) material can be used as a target</li><li><b>Homogeneous (congruent) evaporation</b>: all elements are ablated together, so the target's <b>stoichiometry is transferred</b> to the film</li><li><b>Fast</b>: tens of nm per minute</li><li><b>Wide range of gas pressures</b>, not only UHV (e.g. O₂ background for oxides)</li></ol><p class="why">Typical use: complex oxides (YBa₂Cu₃O₇, ferroelectrics, multiferroics), where stoichiometry is critical. Medium to high crystalline quality.</p>`},
{x:1,q:"Explain sputtering, magnetron sputtering, DC vs RF, and reactive sputtering.",a:`<b>Sputtering</b>: target (cathode) and substrate face each other in Ar at low pressure. A DC voltage (≈ kV) accelerates free electrons, which ionize Ar and create a self-sustained <b>plasma</b>. <b>Ar⁺</b> ions are accelerated into the target and knock out atoms by <b>momentum transfer</b> (not evaporation); the atoms fly to the substrate.<ul><li><b>Magnetron</b>: a magnetic field traps electrons near the target. They ionize more Ar, so the plasma survives at lower pressure and the sputtering rate increases.</li><li><b>DC</b> sputtering for conductive targets. <b>RF</b> (radio frequency AC) for insulating targets, to prevent positive charge build-up that would stop the process.</li><li><b>Reactive</b> sputtering: add O₂ or N₂, which react with the sputtered metal to deposit oxides or nitrides.</li></ul><p class="why">Rate ∝ 1/(L·P): a large L·P is needed to sustain the plasma but lowers the rate, which is why magnetrons are used. Sputtering is used for metals, contacts, complex oxides and SEM sample coating.</p>`},
{q:"What is the energy threshold in sputtering, and what is preferential sputtering?",a:`An ion must transfer at least the <b>binding energy</b> of a surface atom to eject it. The minimum ion energy is about 10–100 eV.<br><b>Preferential sputtering</b>: in a multi-element target, some elements are sputtered more efficiently. The target surface then becomes depleted in those elements until a <b>steady state</b> is reached where the sputtered flux matches the bulk composition. So the film composition comes out right after an initial period.`},
{q:"E-beam evaporation: one advantage and one disadvantage.",a:`<ul><li>+ <b>Very low contamination</b> from the crucible, since only a small spot of the target is heated</li><li>− Different elements evaporate at <b>different rates</b>, so the deposition rates differ and the <b>stoichiometry</b> of multi-element materials is hard to control (unlike PLD)</li></ul><p class="why">E-beams are used in MBE Knudsen cells for materials with very high evaporation temperatures.</p>`},
{x:1,q:"For a multi-cation oxide film, compare MBE, PLD and chemical solution deposition (quality, cost, rate).",a:`<ul><li><b>Film quality and purity</b>: MBE outstanding (needs ozone for oxides) &gt; PLD (usually better than CSD) &gt; CSD (varies a lot)</li><li><b>Cost</b>: MBE very expensive (UHV); PLD quite expensive; CSD much cheaper and more versatile for different substrate geometries</li><li><b>Growth rate</b>: MBE slow; PLD faster; CSD depends on the method (spin coating gives thin layers per coat, dip coating thicker, spray coating is continuous)</li></ul>`},
{x:1,q:"Spell out and briefly describe: MBE, PLD, MOCVD, PECVD, LPCVD, ALD, CSD, SAM, LB.",a:`<ul><li><b>MBE</b>: Molecular beam epitaxy. Elemental beams in UHV, layer by layer.</li><li><b>PLD</b>: Pulsed laser deposition. Laser ablation of a target.</li><li><b>MOCVD</b>: Metal-organic CVD. Metal-organic precursors.</li><li><b>PECVD</b>: Plasma-enhanced CVD. Plasma activation, low T.</li><li><b>LPCVD</b>: Low-pressure CVD. Uniform, reaction-limited.</li><li><b>ALD</b>: Atomic layer deposition. Self-limiting cycles.</li><li><b>CSD</b>: Chemical solution deposition. Spin, dip or spray coating.</li><li><b>SAM</b>: Self-assembled monolayer. Chemisorbed molecules.</li><li><b>LB</b>: Langmuir–Blodgett film. Amphiphiles transferred from water.</li></ul>`},
{x:1,q:"Suggest a method for growing high-quality epitaxial complex-oxide films, e.g. LaAlO₃ on SrTiO₃ or an oxide superlattice.",a:`<b>MBE or PLD</b>: both give epitaxial, layer-by-layer growth with control of stoichiometry, and in situ RHEED monitoring. Sputtering or ALD are acceptable alternatives.<p class="why">Not liquid-based methods (sol-gel, SAM, LB): they don't give the atomic-level control, purity and epitaxial quality needed. MOCVD is not necessary for these materials.</p>`}
]});

DECKS.push({id:"films2", name:"CVD, ALD & liquid-phase films", lec:"L12–L14 · CW 5.5–5.11", cards:[
{q:"Define CVD and list its basic steps.",a:`<b>Chemical vapour deposition</b>: chemically reacting a <b>volatile compound</b> of the material to be deposited (alone or with another gas) to produce a <b>non-volatile solid</b> that deposits atom by atom on a substrate.<ol><li>Reactive gases (precursors + carrier gas) are introduced into the chamber</li><li>The gas is activated by <b>heat or plasma</b></li><li>Reaction at the <b>substrate surface</b> (adsorption, reaction, film growth)</li><li>Gaseous by-products ("waste") are transported away</li></ol><p class="why">CVD gives high-quality, high-performance solid films and is heavily used in the semiconductor industry.</p>`},
{q:"Name types of CVD and typical CVD reaction types, with examples.",a:`<b>Types</b>: MOCVD (metal-organic precursors), PECVD (plasma-enhanced), LPCVD (low pressure), LACVD (laser-assisted), AACVD (aerosol-assisted).<br><b>Reaction types</b>:<ul><li><b>Pyrolysis</b>: AB(g) → A(s) + B(g), e.g. SiH₄ → Si + 2H₂</li><li><b>Reduction</b>: AB(g) + H₂ → A(s) + HB(g), e.g. WF₆ + 3H₂ → W + 6HF</li><li><b>Oxidation</b>: AB + O₂ → AO(s) + B, e.g. SiH₄ + O₂ → SiO₂ + 2H₂</li><li><b>Compound formation</b>: AB + XY → AX(s) + BY, e.g. TiCl₄ + CH₄ → TiC + 4HCl</li><li>Disproportionation, reversible transfer</li></ul><p class="why">Silanes and other hydrides are common precursors, since H leaves easily as volatile H₂ or HX.</p>`},
{x:1,q:"What are the common rate-limiting steps in CVD?",a:`<ul><li><b>Mass transport</b> of reactants through the gas (boundary layer) to the surface</li><li><b>Adsorption</b> of reactants on the surface</li><li><b>Surface diffusion</b></li><li><b>Surface (chemical) reaction</b></li><li><b>Desorption</b> and removal of by-products</li></ul><p class="why">At the exam, any two reasonable ones gave full credit. In practice CVD is described as either mass-transport-limited or reaction-rate-limited.</p>`},
{x:1,q:"CVD: mass-transport-limited vs reaction-rate-limited regime.",a:`The deposition rate is set by the slower of gas delivery and surface reaction. The reaction rate follows Arrhenius, k ∝ exp(−E<sub>a</sub>/RT), while delivery is only weakly T-dependent.<ul><li><b>Mass-transport limited</b> (high T): the reaction is faster than gas delivery. The rate is <b>controlled by gas flow and diffusion</b>, and uniformity depends on uniform mass transport across the substrate (reactor geometry, flow).</li><li><b>Reaction-rate limited</b> (low T or low p): the reaction is slower than delivery. The rate is <b>controlled by temperature</b>, and uniformity depends on temperature uniformity. Good for coating many wafers or complex shapes evenly.</li></ul>`},
{q:"Compare atmospheric, low-pressure and UHV CVD.",a:`<ul><li><b>APCVD</b> (≈ 10³ mbar): very high collision rate, <b>turbulent flow</b>, very fast growth (µm/s), mass-transport limited. Can approach <b>homogeneous nucleation in the gas phase</b>, producing nanoparticles instead of a film. One wafer at a time limits throughput.</li><li><b>LPCVD</b> (lower pressure): faster gas diffusion, so no concentration gradients and <b>laminar flow</b>. More uniform films, <b>reaction-rate limited</b>. Wafers can be stacked, giving higher throughput.</li><li><b>UHVCVD</b> (≈ 10⁻³ mbar and below): <b>molecular flow</b>, no gas-phase reactions, high throughput.</li></ul>`},
{q:"Hot-wall vs cold-wall CVD reactors?",a:`<ul><li><b>Hot wall</b>: heated from outside. Uniform temperature over many substrates, but deposition also happens on the walls (wasted precursor, particles flaking off).</li><li><b>Cold wall</b>: only the substrate holder is heated. Less wall deposition and fewer unwanted gas-phase reactions, but temperature gradients.</li></ul><p class="why">In general, the shape of the reactor shapes the gas flow (horizontal, vertical, barrel, pancake reactors).</p>`},
{x:1,q:"What is PECVD, and what are its main advantages?",a:`<b>Plasma-enhanced CVD</b>: a <b>plasma</b> (an ionized gas of positive ions and free electrons, overall neutral) is generated between parallel electrodes by RF-AC or DC power, much like in sputtering. Energetic electrons collide with precursor molecules and <b>dissociate them into reactive free radicals</b>. These adsorb and react at the surface.<ul><li><b>Much lower deposition temperature</b> (&lt; 300 °C), because the plasma, not heat, supplies the activation energy</li><li>Can deposit materials (or use substrates) with <b>low thermal stability</b></li><li>Higher reactivity and growth rate, and lower concentration of thermally induced defects</li><li>Surface-reaction limited</li></ul>Examples: diamond films, vertically aligned CNTs.`},
{q:"Compare PVD and CVD.",a:`<ul><li><b>Mechanism</b>: CVD involves a chemical reaction with the surface (chemisorption, "absorption rather than adsorption"); PVD is physical condensation.</li><li><b>Temperature</b>: CVD is much hotter (≈ 450–1050 °C) unless plasma-enhanced.</li><li><b>Coverage</b>: CVD gives good uniformity, also on 3D shapes (conformal), like sputtering; evaporative PVD is "line of sight".</li><li><b>Films</b>: CVD is often slightly rougher and polycrystalline (but can be epitaxial).</li><li><b>Cost and environment</b>: CVD is generally cheaper but uses toxic or corrosive gases; PVD is "greener".</li></ul>`},
{x:1,q:"Explain ALD with an example.",a:`<b>Atomic layer deposition</b>: a <b>cyclic</b> CVD variant in which the precursors are introduced <b>one at a time</b>, separated by purge steps. Each half-reaction is <b>self-limiting</b>, so exactly one monolayer is added per cycle.<br>Example, TiO₂ on a hydroxylated surface:<ol><li>Pulse <b>TiCl₄</b>: it reacts with surface –OH, giving –O–TiCl₃ + HCl. The reaction <b>stops</b> when all OH groups have reacted.</li><li><b>Purge</b> excess TiCl₄ and the HCl by-product.</li><li>Pulse <b>H₂O</b>: hydrolysis of the Ti–Cl bonds gives Ti–OH, and neighbouring groups condense into Ti–O–Ti, regenerating a new –OH surface.</li><li><b>Purge</b> the excess water. Ready for the next cycle.</li></ol>Another example: ZnCl₂ chemisorbs, then H₂S reacts to give a ZnS monolayer + HCl.`},
{x:1,q:"Advantages and disadvantages of ALD compared with other thin film methods.",a:`<b>Advantages</b>:<ul><li><b>Precise thickness control</b>, one monolayer per cycle, because growth is self-limiting</li><li><b>Conformal coverage</b>: even on 3D structures, trenches and powders</li><li><b>Low temperature</b>, gentle deposition, good stoichiometry</li></ul><b>Disadvantages</b>:<ul><li><b>Slow</b> (≈ 0.5 Å per cycle), impractical for thick layers</li><li>The <b>strict precursor requirements</b>: the main limitation on which materials can be grown</li><li>By-products can be toxic or corrosive</li></ul>`},
{x:1,q:"List the requirements for ALD precursors, and explain why they matter.",a:`<ul><li><b>Volatile</b> (gases or volatile liquids), so they can be pulsed in the gas phase</li><li><b>No self-decomposition</b>: if the precursor decomposes on its own, it deposits continuously and growth is <b>no longer self-limiting</b></li><li><b>Aggressive and complete reactions</b> with the surface groups, for short cycle times</li><li><b>Not corrosive</b> to the film or substrate (no competing reaction pathways)</li><li><b>Must not dissolve the film</b> (or growth is again not self-limiting)</li><li><b>Non-reactive by-products</b>, easily purged</li><li>Sufficient <b>purity</b></li></ul>Bonus: inexpensive, simple handling and waste treatment, non-toxic and environmentally friendly.`},
{q:"Typical materials per deposition method (from the lecture)?",a:`<ul><li><b>MBE</b>: III–V semiconductors (GaAs), 2D materials, oxides</li><li><b>CVD</b>: polycrystalline Si, SiO₂, silicon nitride, tungsten, carbon-based materials (diamond, CNT, graphene)</li><li><b>ALD</b>: high-k oxides (HfO₂, ZrO₂) for transistors, TiN, TaN, Cu interconnects, noble metals, TiO₂ (FRAM, DRAM)</li><li><b>PLD</b>: complex oxides (YBa₂Cu₃O₇), battery materials</li><li><b>Sputtering</b>: metals and contacts, complex oxides, 2D materials</li></ul>`},
{x:1,q:"What types of sorption exist on a substrate?",a:`<ul><li><b>Adsorption</b>: accumulation of atoms or molecules <b>on the surface</b><ul><li><b>Chemisorption</b>: strong interaction, forming <b>ionic or covalent bonds</b> with the surface. Usually a single layer, often irreversible.</li><li><b>Physisorption</b>: weak <b>van der Waals</b> (or electrostatic) interaction. Reversible, can form multilayers.</li></ul></li><li><b>Absorption</b>: the substance diffuses <b>into</b> the bulk of a liquid or solid to form a solution</li><li><b>Desorption</b>: the reverse of both adsorption and absorption</li></ul>`},
{x:1,q:"What is a self-assembled monolayer (SAM), and what are the three parts of a SAM molecule?",a:`A molecular monolayer that forms spontaneously when a substrate is <b>immersed in a solution of an active surfactant</b> in an organic solvent. A strong molecule–substrate interaction (<b>chemisorption</b>, covalent or ionic bonding) pins the head group to specific surface sites.<ol><li><b>Head group</b>: binds to the substrate (e.g. –SH, –SiCl₃)</li><li><b>Alkyl chain</b> (spacer): packs and orders through van der Waals interactions</li><li><b>Terminal functional group</b>: faces outward and sets the new surface chemistry (–CH₃ hydrophobic, –OH or –COOH hydrophilic, –NH₂ reactive)</li></ol><p class="why">SAMs are a bottom-up wet-chemical route to organic or hybrid 2D films, often used for surface modification and to organize nanoparticles.</p>`},
{q:"Name the three chemisorption bond types for SAMs, with substrate examples.",a:`<ul><li><b>Covalent Si–O</b>: organosilicon / alkylsilanes on <b>hydroxylated</b> surfaces such as SiO₂ on Si, Al₂O₃ on Al, glass, TiO₂, oxidized metals</li><li><b>Polar covalent S–metal</b>: alkanethiols, dialkyl sulfides and disulfides on <b>noble metals</b> such as Au, Ag, Pt, Cu</li><li><b>Ionic</b>: carboxylic acids, amines or alcohols on metal or ionic substrates (e.g. carboxylic acids on Al₂O₃ and Ag, alcohols and amines on Pt)</li></ul>`},
{q:"How does an alkylsilane SAM form, and how does an alkanethiol SAM on gold form?",a:`<b>Alkylsilane</b> (RSiX₃, R₂SiX₂ or R₃SiX; X = chloride or alkoxy; R = carbon chain with a functional group):<ul><li>Immerse a hydroxylated surface (SiO₂, TiO₂) in alkyltrichlorosilane in an organic solvent (≈ 5·10⁻³ M) for 2–3 min.</li><li>Si–X reacts with surface –OH to form Si–O–surface bonds, and neighbouring molecules cross-link via <b>Si–O–Si</b> (surface polymerization).</li></ul><b>Alkanethiol</b> X–(CH₂)<sub>n</sub>–SH on Au:<ul><li>An oxidative reaction: the S–H bond is cleaved, forming a covalent <b>Au–S bond</b> and releasing H₂.</li><li>X is the functional head group, (CH₂)<sub>n</sub> the spacer, SH the binding group.</li></ul>`},
{q:"How can SAMs be stacked into multilayers, and what limits this?",a:`The terminal group of each monolayer must be <b>converted to a hydroxylated surface</b>, so the next silane SAM can bind by surface condensation.<p class="why">The quality of the monolayers degrades quickly as the film gets thicker, because defects accumulate layer by layer.</p>`},
{x:1,q:"What are Langmuir–Blodgett films, and how are they deposited?",a:`Monolayers or multilayers of <b>amphiphilic molecules</b> (surfactants) transferred from a <b>liquid–gas interface</b> (usually water–air) onto a solid substrate.<ol><li>Dissolve the amphiphile in a volatile solvent (e.g. CHCl₃) and spread a drop on the water surface. The heads point into the water and the tails into the air.</li><li>A moving <b>barrier compresses</b> the molecules into a dense, ordered monolayer at a set <b>surface pressure</b>.</li><li>Transfer by moving the substrate vertically through the interface:<ul><li><b>Hydrophilic substrate</b> (SiO₂-coated Si, glass, quartz, oxidized metals): <b>emersion/retraction</b> mode, the most common. The heads bind to the surface as it is pulled up.</li><li><b>Hydrophobic substrate</b>: <b>immersion</b> mode. The tails bind as it is dipped.</li></ul></li></ol>The barrier keeps compressing during transfer to keep the pressure constant as molecules leave the surface. Horizontal lifting is used for very rigid films. Repeated dipping builds multilayers.`},
{x:1,q:"SAM vs Langmuir–Blodgett: what's the key difference, and which suits building a multilayer stack?",a:`<ul><li><b>SAM</b>: molecules from solution <b>chemisorb</b> (react) with a specific substrate. Strong bonds, but each layer needs a compatible, reactive surface.</li><li><b>LB</b>: a pre-ordered monolayer is transferred mechanically from water and held mainly by <b>physisorption</b>. It works on many substrates and builds layer by layer.</li></ul><p class="why">For e.g. 20 monolayers on a sensitive device stack, <b>LB</b> is easier because it needs no specific surface reaction.</p>`},
{q:"Electrodeposition of thin films: key requirement and process variants.",a:`Oriented diffusion of charged species to an electrode under an applied field, then reduction:<br><b>Mⁿ⁺ + ne⁻ → M⁰</b>, with a corresponding oxidation at the counter-electrode (X<sup>m</sup> → X<sup>m−n</sup> + ne⁻).<ul><li><b>The deposit must be electrically conductive</b> so successive layers can deposit: metals, alloys, semiconductors, conductive polymers.</li><li>Can run at constant current, or with pulsed current or voltage.</li><li>Post-treatment (e.g. heating) may be needed to improve the film.</li></ul><p class="why">Liquid-phase methods in general: no vacuum, cheap, room temperature and ambient pressure, but quality can be an issue.</p>`},
{x:1,q:"Which thin film methods are combined with sol-gel chemistry?",a:`<b>Chemical solution deposition (CSD)</b>: <b>spin coating, dip coating and spray coating</b>.<p class="why">The sol is coated on the substrate, gels as the solvent evaporates, and is then heat-treated to remove organics and crystallize the oxide.</p>`},
{x:1,q:"Dip coating: what sets the film thickness? Does faster withdrawal give a thinner or thicker film?",a:`The substrate is immersed in the sol and <b>withdrawn at constant speed</b>. A liquid layer is entrained, and viscous drag (pulling liquid up) balances gravity (draining it down):<br><b>H = c₁ (η U₀ / ρ g)<sup>1/2</sup></b><br>η = viscosity, U₀ = withdrawal speed, ρ = sol density, g = gravity, c₁ = constant.<p class="why"><b>Higher withdrawal speed gives a thicker film</b>, and so does a more viscous (concentrated) sol. Other parameters: wetting, immersion time, pH, number of layers, age of the sol, drying, and heat treatment. Dip coating works for large or complicated shapes and can be continuous on flexible substrates.</p>`},
{q:"Spin coating: stages, and what controls thickness?",a:`<ol><li><b>Deposition</b> of excess solution on the substrate</li><li><b>Spin-up</b>: liquid is pushed outward by centrifugal force</li><li><b>Spin-off</b> at constant speed: excess fluid is ejected and the film thins uniformly</li><li><b>Evaporation</b> of solvent thins it further</li></ol>H = (1 − ρ<sub>A0</sub>/ρ<sub>A</sub>) · (3ηe / (2ρ<sub>A0</sub>ω²))<sup>1/3</sup><br>(ω = angular velocity, η = viscosity, e = evaporation rate, ρ<sub>A</sub> = mass of volatile solvent per volume)<p class="why"><b>Higher rotation speed gives a thinner film</b> (H ∝ ω<sup>−2/3</sup>), and so does a more dilute, less viscous sol. Spin time, acceleration and the amount deposited also matter. The same technique applies photoresist in lithography.</p>`},
{x:1,q:"What is the main problem with sol-gel films (spin or dip coating), what causes it, and how is it avoided?",a:`<b>Surface cracking.</b> Mechanisms:<ul><li><b>Shrinkage</b> of the gel as the solvent evaporates (the film is attached to a rigid substrate, so it can't shrink in-plane and tensile stress builds up)</li><li><b>Polymerization and cross-linking</b> of the gel matrix (further shrinkage)</li><li><b>Tensile stress from capillary forces</b> in the drying pores</li><li><b>Mismatch of thermal expansion coefficients</b> between film and substrate during heat treatment</li></ul>To avoid cracking: reduce the solvent volume fraction at the solidification point, and make <b>thinner layers</b> (build up thickness with several coats).`},
{q:"Advantages and disadvantages of sol-gel film deposition.",a:`<b>Advantages</b>: simple and inexpensive; low processing temperature; large or complicated surfaces (dip coating); easy to scale up; controlled composition; homogeneous coatings; wide range of substrates (glass, plastics, metals, ceramics).<br><b>Disadvantages</b>: <b>film thickness limited by crack formation</b>; short lifetime of the sols; requires a final densification heat treatment.`},
{x:1,q:"Chemical solution deposition: what is the role of heterogeneous vs homogeneous nucleation in getting an epitaxial film?",a:`After the sol is deposited and gels, the final crystal structure must <b>nucleate</b> during heat treatment.<ul><li><b>Homogeneous nucleation</b> inside the gel: crystals form at random places with random orientations, giving a <b>polycrystalline</b> film with randomly oriented grains.</li><li><b>Heterogeneous nucleation at the gel–substrate interface</b>: the substrate lattice sets the orientation of each nucleus, which is needed for <b>epitaxial</b> (textured) growth. Growth then proceeds from the substrate upward.</li></ul><p class="why">To favour this, use a lattice-matched substrate and conditions with low supersaturation (heterogeneous nucleation has the lower barrier). The in-plane rotation of grains may still be random, giving a partly epitaxial film.</p>`}
]});

DECKS.push({id:"carbon", name:"Carbon nanomaterials", lec:"L15 · CW 6.2", cards:[
{q:"Compare diamond, graphite and fullerenes in hybridization, coordination and properties.",a:`<ul><li><b>Diamond</b>: sp³, tetrahedral, CN 4, 109.5°. A 3D network of strong covalent bonds: extremely hard, wide band gap (≈ 5.5 eV), insulating. The bonding molecular orbitals are full and the antibonding ones empty, with a large gap between them.</li><li><b>Graphite</b>: sp² (2s + 2p<sub>x</sub> + 2p<sub>y</sub>), trigonal, CN 3, 120°, in layers. The remaining <b>2p<sub>z</sub></b> electron forms delocalized π bands whose valence and conduction bands touch or overlap, so it is a <b>semimetal</b> in-plane. Weak van der Waals bonding between layers.</li><li><b>Fullerenes</b>: mostly sp² but curved, a closed cage (molecule) with discrete HOMO–LUMO levels.</li></ul>Other allotropes: carbon nanotubes, graphene, amorphous carbon. Carbon materials combine high mechanical strength, low weight, and interesting electrical, thermal and biological properties.`},
{x:1,q:"Use Euler's formula to show that every fullerene has exactly 12 pentagons, and derive the number of atoms.",a:`For a convex polyhedron: <b>V − E + F = 2</b> (V vertices = C atoms, E edges = bonds, F faces).<ul><li>Each C has 3 bonds and each bond joins 2 atoms: <b>E = 3V/2</b></li><li>p pentagons and h hexagons: <b>F = p + h</b>, and each edge borders two faces: <b>2E = 5p + 6h</b></li></ul>Substituting V = (5p+6h)/3 and E = (5p+6h)/2:<br>(5p+6h)/3 − (5p+6h)/2 + p + h = 2 → <b>p = 12</b>, for any h.<br>Number of atoms: V = (5·12 + 6h)/3 = <b>2(h + 10)</b>.<p class="why">Hexagons alone tile a flat sheet; the 12 pentagons provide the curvature needed to close the cage.</p>`},
{x:1,q:"Give the formula for the number of atoms in a fullerene C<sub>a</sub>. How many hexagons do C₆₀ and C₇₀ have?",a:`<b>a = 2(n + 10)</b>, where n is the number of hexagons (always 12 pentagons).<ul><li><b>C₆₀</b>: 60 = 2(20 + 10), so n = <b>20 hexagons</b>. Spherical (football).</li><li><b>C₇₀</b>: 70 = 2(25 + 10), so n = <b>25 hexagons</b>. Oval (rugby ball): the ends are like C₆₀, with an extra equatorial belt of hexagons. It also obeys the isolated pentagon rule.</li></ul>`},
{x:1,q:"What is the isolated pentagon rule, and how does chemical bonding explain it?",a:`Every pentagon must be <b>completely surrounded by hexagons</b>: no two pentagons may share an edge or a corner.<p class="why">The C–C bonds are <b>sp²-hybridized covalent bonds</b>, which are directional and prefer 120° angles in a plane. A pentagon already bends the bonds (108° inner angle) to create curvature. If two pentagons are adjacent, the curvature is concentrated and the bonds are forced into very strained angles and lengths. That is energetically unfavourable and makes the molecule chemically unstable (reactive).</p>`},
{x:1,q:"Why is C₆₀ the smallest stable fullerene? Consider geometry and bonding.",a:`<b>Geometry</b>: every fullerene must have exactly 12 pentagons (Euler). <b>C₆₀ (20 hexagons) is the smallest cage where all 12 pentagons can be fully separated by hexagons</b>. Any smaller fullerene must have pentagons sharing edges or corners.<br><b>Bonding</b>: adjacent pentagons force the directional sp² bonds into strongly unfavourable angles (excessive bending), which makes smaller cages unstable.`},
{x:1,q:"Describe the structure of C₆₀.",a:`<ul><li>A truncated icosahedron, shaped like a football (buckyball): <b>12 pentagons + 20 hexagons</b>, 60 atoms, 90 bonds</li><li>Each pentagon is surrounded by 5 hexagons (isolated pentagon rule, important for stability)</li><li>All 60 C atoms are <b>equivalent</b>. Highly symmetric, with 2-fold (15), 3-fold (10) and 5-fold (6) rotation axes.</li><li>Two different bond lengths (≈ 1.38 Å between two hexagons, ≈ 1.45 Å between a hexagon and a pentagon). Angles close to 120°.</li></ul><p class="why">Discovered in 1985 by Curl, Smalley and Kroto (Nobel Prize in Chemistry 1996). Named after Buckminster Fuller's geodesic domes.</p>`},
{x:1,q:"How are fullerenes synthesized and isolated?",a:`<b>Arc discharge</b> (a PVD method):<ol><li>Two graphite rods connected to copper electrodes, in a chamber with <b>helium at about 200 torr</b> (≈ 266 mbar).</li><li>An electric current is applied. The contact point heats to <b>2500–3000 °C</b> and carbon evaporates.</li><li>Carbon vapour condenses as soot on the <b>water-cooled walls</b>. The soot contains up to about 15 % fullerenes (≈ 13 % C₆₀, 2 % C₇₀), plus giant fullerenes, nanotubes and amorphous carbon.</li></ol><b>Isolation</b>: extract the soluble fullerenes with a solvent (e.g. toluene), then separate them by <b>chromatography</b>. The extract is about 60 % C₆₀ and 20 % C₇₀, with smaller amounts of C₇₆, C₇₈, C₈₄ and others.<p class="why">The inert gas and vacuum are needed because carbon is very reactive at these temperatures (it would form CO₂, hydrocarbons etc.).</p>`},
{q:"How does gel permeation chromatography separate fullerenes?",a:`Separation by <b>molecular size</b>:<ul><li>A column is packed with porous gel or glass beads.</li><li><b>Large molecules</b> can't enter the pores, so they pass through the spaces between the beads and <b>elute first</b>.</li><li><b>Small molecules</b> diffuse into the pores and take a longer path, so they come out later.</li></ul>Important parameters: <b>pore size</b> and <b>bead size</b>.`},
{x:1,q:"Name applications of fullerenes and of carbon nanotubes.",a:`<b>Fullerenes</b>: biomedicine (drug delivery, antiviral agents), <b>antioxidants</b> (skin creams; they are very reactive towards radicals), solar cells (electron acceptors), protective eyewear (optical limiting), hydrogen storage, molecular optoelectronics.<br><b>CNTs</b>: composites (CNT-reinforced epoxy in XC skis, about 0.5 % CNTs giving 20–30 % stronger material), transistors and even a CNT computer, sensors (artificial nose), battery electrodes, Vantablack (VA-CNT arrays, "the darkest material"), desalination membranes.`},
{q:"SWCNT vs MWCNT. Who discovered CNTs, and when?",a:`<ul><li><b>SWCNT</b>: a single graphene sheet rolled into a seamless cylinder</li><li><b>MWCNT</b>: several concentric graphene cylinders</li></ul>Diameter: a few nm. Length: up to several µm (or more). Each tube is a hexagonal network of covalently bonded C.<p class="why">History: Iijima, 1991, found MWCNTs on the cathode of an arc-discharge setup. SWCNTs were found experimentally in 1993. Laser vaporization in 1996 gave efficient production of SWCNT arrays.</p>`},
{x:1,q:"How is the structure of a SWCNT related to graphene? Define the chiral vector and how diameter follows from it.",a:`A SWCNT is a graphene sheet <b>rolled up</b> so that two lattice points coincide. The roll-up direction is the <b>chiral vector</b>:<br><b>C<sub>h</sub> = n·a₁ + m·a₂</b> (n, m integers; a₁, a₂ graphene unit vectors)<br>|C<sub>h</sub>| is the circumference, so the diameter is:<br><b>d = |C<sub>h</sub>|/π = a√(n² + nm + m²)/π</b>, with a = 2.46 Å<br>Chiral angle θ: tan θ = √3·m/(2n + m). T is the translation vector along the tube axis.<p class="why">The pair (n, m) uniquely determines the tube: diameter, chirality (armchair, zigzag or chiral) and whether it is metallic or semiconducting.</p>`},
{x:1,q:"Name the three SWCNT geometries with their (n, m) and chiral angle.",a:`<ul><li><b>Armchair</b>: n = m, θ = 30°. The edge across the tube looks like armchairs.</li><li><b>Zigzag</b>: m = 0 (or n = 0), θ = 0°. The edge looks like a zigzag.</li><li><b>Chiral</b>: n ≠ m (both ≠ 0), 0° &lt; θ &lt; 30°. Spiral symmetry (left- or right-handed).</li></ul>`},
{x:1,q:"When is a SWCNT metallic? What fraction are metallic?",a:`<b>Metallic when 2n + m = 3q</b> (q an integer), which is equivalent to <b>(n − m) divisible by 3</b>. Otherwise semiconducting.<ul><li>About <b>1/3 metallic, 2/3 semiconducting</b> (for small diameters)</li><li><b>Armchair</b> (n = m) tubes are <b>always metallic</b></li><li>Zigzag and chiral tubes are metallic only when the criterion holds</li></ul><p class="why">Rolling up quantizes the electron wavevector around the circumference. The tube is metallic only if one of the allowed k-lines passes through the Dirac point of graphene, where the bands touch.</p>`},
{x:1,q:"Classify and predict conductivity: (6,6), (8,0), (9,0), (7,4), (6,4), (9,6).",a:`Use 2n + m = 3q:<ul><li><b>(6,6)</b>: armchair, 18 → <b>metallic</b></li><li><b>(8,0)</b>: zigzag, 16 → <b>semiconducting</b></li><li><b>(9,0)</b>: zigzag, 18 → <b>metallic</b></li><li><b>(7,4)</b>: chiral, 18 → <b>metallic</b></li><li><b>(6,4)</b>: chiral, 16 → <b>semiconducting</b></li><li><b>(9,6)</b>: chiral, 24 → <b>metallic</b></li></ul><p class="why">Exam tip: when reading (n, m) from a drawing, count steps along a₁ and a₂ from point A to point B.</p>`},
{x:1,q:"Describe the mechanical and electrical properties of CNTs qualitatively, and relate them to bonding.",a:`<b>Mechanical</b>: extremely high <b>tensile strength</b> and <b>Young's modulus</b> along the axis, comparable to or higher than diamond. Low density, very flexible and resilient. Reason: the in-plane <b>sp² σ bonds</b> are among the strongest bonds in nature, and the seamless tube has few defects.<br><b>Electrical</b>: <b>metallic or semiconducting</b> depending on chirality (2n + m = 3q). Very high carrier mobility and <b>ballistic transport</b> over long lengths, from the delocalized p<sub>z</sub> π electrons. Very high current density and high thermal conductivity along the axis.<p class="why">All of these properties are strongly anisotropic: excellent along the axis, weak between tubes (van der Waals).</p>`},
{x:1,q:"List the three main CNT synthesis methods with key conditions.",a:`<ul><li><b>Arc discharge</b>: two graphite rods (anode ≈ 6 mm, cathode ≈ 9 mm), about 20 V and 50–100 A, 2000–3000 °C, in inert gas. Electrons from the cathode heat the anode, carbon evaporates and forms fullerene soot, part of which deposits on the cathode and transforms into MWCNTs. <b>Efficient water cooling of the cathode</b> is essential. Metal catalyst is needed for SWCNTs.</li><li><b>Laser ablation</b>: a graphite target doped with about 0.5–1 % each of <b>Co and Ni</b>, in a tube furnace at <b>1200 °C</b> with Ar flowing at about 500 Torr. A laser vaporizes the target into a plume, and mainly <b>SWCNTs</b> form and are swept onto a water-cooled "cold finger".</li><li><b>CVD / PECVD</b>: gaseous carbon sources (CH₄, CO, C₂H₂) are "cracked" into reactive radicals by heat or plasma. They diffuse to a heated substrate with <b>catalyst particles (Fe, Co, Ni)</b>, where CNTs grow. Allows <b>aligned growth on substrates</b> and is the most scalable.</li></ul>`},
{x:1,q:"Tip-growth vs base-growth of CNTs: what determines which occurs? Describe each.",a:`It depends on the <b>catalyst–substrate interaction</b>.<ul><li><b>Tip growth</b> (<b>weak</b> interaction): the hydrocarbon decomposes on the <b>top</b> of the metal particle. Carbon dissolves and diffuses down through the particle until it is supersaturated, then precipitates at the bottom and <b>pushes the particle up</b> off the substrate. Growth continues while the top of the metal stays exposed, and stops when it is covered by excess carbon.</li><li><b>Base growth</b> (<b>strong</b> interaction): the precipitating carbon can't lift the particle. Carbon crystallizes out as a <b>hemispherical dome on top</b> and extends upward as a cylinder, while the catalyst stays <b>rooted at the base</b>.</li></ul><p class="why">If no catalyst particles are visible at the tops of grown CNTs, base growth is the mechanism.</p>`},
{x:1,q:"Design a synthesis of an ordered array of vertically aligned CNTs with controlled position, diameter and height.",a:`<ol><li><b>Catalyst nanoparticles</b> (Fe, Co, Ni) on the substrate:<ul><li><b>Lithography</b> (EBL or photolithography) + metal deposition (PVD or sputtering) + lift-off. The pattern sets the <b>position and spacing</b>.</li><li>Or deposit a thin metal film and <b>heat it to dewet</b> into nanoparticles (less control of position).</li><li>Particle size sets the <b>diameter</b>. Very small particles favour SWCNTs over MWCNTs.</li></ul></li><li><b>Growth by (PE)CVD</b>: introduce a high-purity hydrocarbon (CH₄, C₂H₂, C₂H₄) at low pressure. It decomposes on the catalyst, carbon dissolves until supersaturated and precipitates as a tube (a <b>VLS-like</b> mechanism). <b>Plasma</b> gives reactive radicals, so growth is faster at lower T and the electric field helps vertical alignment.</li><li><b>Height</b>: set by <b>growth time</b>. Stop by removing the carbon precursor.</li></ol><p class="why">A strongly bound catalyst gives base growth, so the catalyst stays on the substrate. PLD with patterned catalyst is a sound alternative.</p>`},
{x:1,q:"What general method can produce both fullerenes and CNTs? Mention important conditions.",a:`<b>Arc discharge</b> with graphite electrodes (or another pure C source):<ul><li>High current (an arc plasma) and very high temperature (2000–3000 °C) to vaporize carbon</li><li>Inert gas (He or Ar) at controlled low pressure, to stop the hot carbon from reacting</li><li>High purity of the feedstock and equipment</li><li>Water-cooled walls or cathode, where the products condense</li><li>A metal catalyst (Co, Ni, Fe) in the anode gives SWCNTs</li></ul>Fullerenes are separated from the soot by extraction and chromatography.`},
{q:"What are carbon nanocones, and what determines their geometry?",a:`Graphene sheets with one or more <b>60° wedges</b> removed and the edges joined into a cone. They form as a by-product of carbon black production: CₙHₘ → nC + (m/2)H₂ in a plasma at about 1600 °C (research at NTNU).<p class="why"><b>The number of pentagons at the tip equals the number of 60° wedges removed</b>, because each pentagon introduces a 60° disclination. So only specific apex angles are possible. Pentagons form at the tip to relieve strain. Formation is still not well understood and hard to reproduce. Explored as Li-ion battery anodes and as SPM tips.</p>`}
]});

DECKS.push({id:"twod", name:"Graphene & 2D materials", lec:"L16 · CW 5–6", cards:[
{x:1,q:"Describe the crystal structure of graphene.",a:`A one-atom-thick <b>2D hexagonal honeycomb</b> lattice of sp²-bonded carbon.<ul><li>120° bond angles, coordination number <b>3</b></li><li><b>2 atoms per unit cell</b> (two interpenetrating triangular sublattices)</li><li>C–C distance ≈ 1.42 Å, lattice parameter a ≈ 2.46 Å</li></ul><p class="why">Graphite is a stack of graphene layers held by van der Waals forces. A CNT is a rolled graphene sheet.</p>`},
{x:1,q:"Explain how chemical bonding gives graphene its anisotropic electrical and mechanical properties (compare with diamond).",a:`<ul><li><b>In-plane sp² σ bonds</b>: strong, directional covalent bonds (2s, 2p<sub>x</sub>, 2p<sub>y</sub>), giving exceptional in-plane strength and stiffness ("stronger than steel")</li><li><b>Singly occupied 2p<sub>z</sub> orbital</b> on each C, perpendicular to the sheet: these form delocalized <b>π bands</b>, giving <b>high conductivity</b> and extremely high electron mobility</li><li><b>Weak van der Waals bonds</b> out of plane (to adjacent sheets or adsorbates): much lower elastic modulus and high electrical resistivity along z, and the sheets can slide or exfoliate</li></ul><p class="why">Diamond has sp³ bonds in 3D corner-sharing tetrahedra, with all four electrons in localized σ bonds: isotropic, insulating (wide gap) and hard in every direction.</p>`},
{x:1,q:"Describe the electronic properties of graphene.",a:`<ul><li>A <b>semimetal</b> (zero-gap semiconductor): the full valence band and the empty conduction band touch at single points (the K points)</li><li>Near these points the bands are <b>linear</b>, forming <b>Dirac cones</b> (E ∝ |k|, not k²). The bands are very steep, so carriers act as if they have nearly zero effective mass.</li><li>The result is <b>extremely high mobility</b> and <b>ballistic transport</b> over long distances</li><li>Easily doped n- or p-type by donors or acceptors, and the carrier type (polarity) can be switched with local electric fields</li></ul>`},
{x:1,q:"Name two outstanding physical properties of graphene.",a:`<ul><li><b>Mechanical strength</b> in-plane ("stronger than steel"), combined with flexibility</li><li><b>Electrical conductivity / electron mobility</b> (Dirac cones, ballistic transport)</li></ul>Also: very high thermal conductivity, almost transparent yet absorbing over a wide wavelength range, impermeable to gases. All are highly anisotropic.`},
{q:"How was graphene first isolated, and what happened with twisted bilayers?",a:`<ul><li>1962: observed in the electron microscope on a substrate.</li><li><b>2004</b>: <b>Geim and Novoselov</b> isolated and characterized single layers using the <b>"scotch tape" method</b> (mechanical exfoliation of graphite) and transferred them to a substrate. <b>Nobel Prize in Physics 2010.</b></li><li>2010: theory predicted interesting physics in twisted bilayers. 2018: superconductivity confirmed in <b>twisted bilayer graphene</b> at the "magic angle" θ ≈ 1.1°.</li></ul>Moiré period: <b>λ = a / (2 sin(θ/2))</b>. For θ = 1.1°, λ ≈ 52a.`},
{q:"Why is '2D' not strictly correct? What is the preferred term?",a:`A 2D material still has a finite thickness and exists in 3D space. Only its <b>periodicity</b> is two-dimensional (it repeats in-plane but not out of plane). The preferred term is a <b>subperiodic</b> structure.`},
{x:1,q:"What is unique about 2D materials compared with a very thin layer of a bulk material?",a:`<ul><li><b>No dangling bonds</b>: the layers are chemically saturated, so the surfaces are stable and inert. A thin slice of a bulk 3D material has broken bonds at both surfaces.</li><li>Layers held only by <b>weak van der Waals</b> forces, so single layers can be <b>exfoliated</b> intact</li><li><b>Electrons are confined in the plane</b>: highly anisotropic electronic properties</li><li>Easy chemical and surface tailoring, and easy electronic tailoring through the <b>number of layers</b> (e.g. band gap changes)</li><li>The "end-game" of miniaturization; unique quantum properties (topological insulators, quantum Hall effect)</li></ul>`},
{x:1,q:"What type of chemical bonding must be present in 2D materials, and why?",a:`<b>Covalent bonding within the layers</b> is necessary.<p class="why">Covalent bonds are <b>directional</b>, so they can stabilize a strongly anisotropic, layered structure with all bonding in the plane. Metallic and ionic bonds are non-directional (isotropic) and favour 3D close packing. Between the layers the bonding is weak <b>van der Waals</b>, or weakly ionic.</p>`},
{x:1,q:"Why do many 2D materials have hexagonal symmetry?",a:`<ul><li><b>sp² hybridization</b> gives three bonds at <b>120°</b>, which naturally builds hexagonal (honeycomb) layers (graphene, h-BN)</li><li><b>Close packing in 2D is hexagonal</b>, which matters for 2D materials with partly metallic or ionic bonding (e.g. the metal layers in TMDs)</li></ul>`},
{q:"How are 2D materials classified?",a:`<ul><li><b>Layered van der Waals solids</b>: graphene, h-BN, transition metal chalcogenides (MoS₂, WSe₂)</li><li><b>Surface-assisted, non-layered solids</b> that must be grown on a substrate: the Xenes (silicene, germanene). Stability issues (they oxidize; buckled rather than flat).</li><li><b>Layered ionic solids</b>: layered oxides and perovskites</li></ul>`},
{x:1,q:"What makes hexagonal boron nitride (h-BN) special as a 2D material?",a:`It has the same honeycomb structure as graphene (alternating B and N), but it is a <b>wide band gap insulator</b> (≈ 5–6 eV; a white compound) and very chemically and thermally stable.<p class="why">The B–N bond is polar: the electronegativity difference opens a large gap, unlike the symmetric C–C bonds in graphene. Most other 2D materials are metallic or small-gap semiconductors. h-BN is used as the <b>dielectric</b> in 2D electronics and as an atomically flat <b>substrate</b> for graphene.</p>`},
{x:1,q:"How can C contamination make h-BN p-type or n-type?",a:`<ul><li>C on an <b>N</b> site: C has one electron <i>fewer</i> than N, so it is an <b>acceptor</b> (creates a hole), giving <b>p-type</b></li><li>C on a <b>B</b> site: C has one electron <i>more</i> than B, so it is a <b>donor</b>, giving <b>n-type</b></li></ul><p class="why">Same logic as doping Si: count valence electrons relative to the atom that is replaced (B: 3, C: 4, N: 5).</p>`},
{x:1,q:"Transition metal chalcogenides (TMDs): give examples and describe the structure.",a:`<ul><li><b>Monochalcogenides MX</b>: M = Ge, Sn; X = S, Se. Phosphorene-like, indirect semiconductors, piezoelectric.</li><li><b>Dichalcogenides MX₂</b> (the famous ones): <b>MoS₂</b>, MoSe₂, MoTe₂, WS₂, WSe₂</li><li><b>Trichalcogenides MX₃</b>: M = Ti, Zr, Hf; can be magnetic</li></ul>Structure: X–M–X sandwich layers with <b>strong covalent M–X bonds</b> within each layer and <b>weak van der Waals forces</b> between layers.<br>Polytypes: <b>1H/2H trigonal prismatic</b> (semiconducting) and <b>1T octahedral</b> (metallic).`},
{q:"How does the band gap of MoS₂ change with the number of layers? Why does it matter?",a:`It changes from an <b>indirect</b> band gap in bulk and multilayers to a <b>direct</b> band gap (≈ 1.8 eV) in a <b>monolayer</b>, because interlayer coupling and symmetry change with thickness.<p class="why">A direct gap makes the monolayer an efficient light emitter and absorber (optoelectronics). MoS₂ is also studied for transistors (high mobility), though interfaces to the rest of the device strongly influence performance.</p>`},
{q:"Relate band curvature to effective mass and mobility.",a:`Free electron (no potential): <b>E = ħ²k²/2m</b>, a parabola. In a real crystal, the curvature of the band defines the <b>effective mass</b>:<br><b>1/m* = (1/ħ²)·d²E/dk²</b><br>Mobility: <b>μ = eτ/m*</b> (τ = scattering time), and conductivity σ = neμ.<ul><li><b>Steep, strongly curved bands</b>: small m*, "light" electrons, <b>high mobility</b> (graphene's Dirac cones are the extreme case)</li><li><b>Flat bands</b>: large m*, "heavy", localized electrons (d and f electrons), low mobility</li></ul>`},
{q:"What are reciprocal space and the first Brillouin zone?",a:`The electron wavevector k (momentum p = ħk) has units of inverse length and lives in <b>reciprocal space</b>. Reciprocal space is also what diffraction experiments (XRD, electron diffraction in TEM) actually observe.<br>The <b>first Brillouin zone</b> is the primitive unit cell of the reciprocal lattice. Band structures ("spaghetti diagrams") are plotted along lines between its high-symmetry points (Γ, K, M …).`},
{q:"What is a topological insulator?",a:`A material that is an <b>insulator in its bulk</b> but has "protected" <b>conducting states at its surface or edges</b>, which carry current without dissipation (no backscattering).<p class="why">Often found in materials with strong spin–orbit coupling. A "holy grail" is a <b>magnetic topological insulator</b>, which could carry spin currents without dissipation. Magnetic 2D systems have been a hot topic in recent years.</p>`},
{x:1,q:"What is exfoliation? Give examples, with pros and cons.",a:`<b>Exfoliation</b>: separating single or few sheets from a layered bulk crystal by breaking the weak van der Waals bonds between layers.<ul><li><b>Mechanical</b> (scotch tape): easy, gives the highest-quality flakes, but very <b>low yield</b>. How easily it works depends on the interlayer surface energy (e.g. MoS₂ about 65–75 mJ/m²).</li><li><b>Liquid / chemical</b>: <b>intercalate</b> ions or molecules (often OH⁻ or Li⁺) between the layers to push them apart, then <b>sonicate</b> to break them up. <b>Scalable</b> (large amounts), but destructive, giving smaller and more defective flakes.</li></ul>`},
{q:"Besides exfoliation, how are 2D materials synthesized? Which method for graphene on Cu?",a:`<ul><li><b>CVD</b>: scalable, high quality over large areas, with control of the termination (e.g. B<sub>1−x</sub>C<sub>x</sub>N doping). Graphene on Cu foil is typically grown by <b>low-pressure CVD</b> or PECVD from CH₄; the Cu surface (111 or 001) affects the result.</li><li><b>Epitaxial growth from vapour</b> (MBE, sputtering, PLD): stoichiometry is difficult because of different vapour pressures, and films are often only a few layers thick.</li></ul>`}
]});

DECKS.push({id:"special", name:"Epitaxy, porous & core–shell", lec:"L17 · CW 6", cards:[
{q:"Define epitaxy. Homoepitaxy vs heteroepitaxy?",a:`<b>Epitaxy</b> (Greek: epi = above, taxis = order): a <b>crystalline film growing on a crystalline substrate</b>, with its crystal orientation fixed by the substrate.<ul><li><b>Homoepitaxy</b>: same material in film and substrate (e.g. Si on Si). Used to grow purer or differently doped layers (purification, p–n junctions). Perfect lattice match, no strain.</li><li><b>Heteroepitaxy</b>: different materials. This is the general case. The lattice mismatch imposes <b>strain</b> on the film.</li></ul><p class="why">Epitaxy is used for defect-free films, for integration in components, and for materials engineering through strain.</p>`},
{x:1,q:"Define misfit strain. When is it compressive and when tensile?",a:`<b>ε = (a<sub>sub</sub> − a<sub>film</sub>) / a<sub>film</sub></b><ul><li><b>Compressive</b>: ε &lt; 0, a<sub>sub</sub> &lt; a<sub>film</sub>. The film is squeezed in-plane to fit the smaller substrate lattice.</li><li><b>Tensile</b>: ε &gt; 0, a<sub>sub</sub> &gt; a<sub>film</sub>. The film is stretched in-plane.</li></ul>`},
{x:1,q:"What is epitaxial strain, and what happens to a film under compressive or tensile strain?",a:`Elastic strain from the lattice-parameter difference across a <b>coherent interface</b> (atomic planes continue across it). The crystal structures must be compatible (e.g. perovskite on perovskite, zinc blende on Si).<br>The film adopts the substrate's <b>in-plane</b> lattice parameter:<ul><li><b>Compressive</b> in-plane: the out-of-plane parameter <b>elongates</b> (the unit cell becomes taller)</li><li><b>Tensile</b> in-plane: the out-of-plane parameter <b>contracts</b></li></ul><p class="why">This is the Poisson effect: the cell tries to keep its volume roughly constant. A cubic film therefore becomes tetragonal.</p>`},
{x:1,q:"What is the critical thickness, and how does it depend on misfit?",a:`Elastic strain energy in the film grows with thickness. Above a <b>critical thickness h<sub>c</sub></b>, it becomes cheaper to <b>relax the strain by forming misfit dislocations</b> at the interface than to keep straining every new layer. Below h<sub>c</sub> the film is coherent and fully strained.<ul><li>h<sub>c</sub> is <b>inversely related to the misfit</b>: large mismatch gives a thin coherent layer</li><li>At misfit &gt; about <b>10 %</b>, h<sub>c</sub> is less than one monolayer, so the film grows fully relaxed from the start</li></ul>`},
{x:1,q:"Which structural and chemical mechanisms can accommodate epitaxial strain? Why do they form?",a:`They all form to <b>relieve (mitigate) the elastic strain energy</b>:<ul><li>Changes in <b>bond lengths and bond angles</b>; in perovskites, <b>rotation or tilting of the oxygen octahedra</b></li><li>A change of <b>crystal symmetry</b> or a phase transition</li><li><b>Dislocations</b> (misfit dislocations, line defects)</li><li><b>Point defects</b>: anion (oxygen) and cation vacancies</li><li><b>Segregation</b> of elements or dopants normal to the interface (in multi-element compounds)</li></ul>`},
{x:1,q:"What are possible consequences of epitaxial strain for a film's properties?",a:`Strain changes bond lengths and angles, so it can change the <b>crystal structure and symmetry</b>. That in turn <b>shifts physical properties</b> and can <b>induce or suppress phase transitions</b> (e.g. to or away from ferroelectric order, or shift T<sub>C</sub>). It can also create misfit dislocations, point defects (vacancies), or segregation of elements.<p class="why">Strain is a tool: "strain engineering" creates properties not found in bulk.</p>`},
{q:"Give examples of strain engineering from the lecture.",a:`<ul><li><b>BaTiO₃</b> under compressive in-plane strain: the ferroelectric T<sub>C</sub> increases strongly</li><li><b>SrTiO₃</b> (paraelectric in bulk) under <b>tensile</b> strain on DyScO₃: ferroelectric at room temperature</li><li><b>La₂₋ₓSrₓCuO₄</b> on SrLaAlO₄ (a<sub>s</sub> = 3.75 Å, about 0.5 % compressive): superconducting T<sub>C</sub> almost doubles, to about 49 K</li><li><b>SrRuO₃</b> (metallic oxide electrode): tensile strain (on DyScO₃) increases resistivity; compressive (on SrTiO₃, LSAT, LaAlO₃) decreases it and increases the saturation magnetization</li></ul>`},
{q:"Domain-matching epitaxy and selective epitaxial growth: what are they?",a:`<ul><li><b>Domain-matching epitaxy</b>: even with very large misfit, epitaxy is possible when <b>integral multiples of lattice planes</b> match (e.g. 4 film spacings ≈ 3 substrate spacings). Narayan et al. grew nitride films on Si with about 22.5 % misfit this way.</li><li><b>Selective epitaxial growth</b>: nucleation happens only on the exposed Si areas and not on the dielectric (SiO₂) mask, so the layer grows only where wanted. Widely used in electronics.</li></ul><p class="why">Different substrate orientations, e.g. (001) vs (111), can also be used to change the epitaxial relationship and the strain state.</p>`},
{q:"Why does tensile strain promote oxygen vacancies in oxides like CaMnO₃? (chemical expansion)",a:`Forming an oxygen vacancy leaves two electrons, which reduce two Mn⁴⁺ (0.53 Å) to the <b>larger</b> Mn³⁺ (0.645 Å). So vacancies cause local <b>chemical expansion</b> of the lattice.<p class="why">A lattice already stretched by tensile strain has "room" for the larger ions, so the <b>vacancy formation energy decreases</b> and vacancies are favoured. Compressive strain does the opposite. That's why strain and defect chemistry are coupled in oxide films.</p>`},
{x:1,q:"Classify porous materials by pore diameter.",a:`<ul><li><b>Microporous</b>: d &lt; 2 nm (e.g. zeolites)</li><li><b>Mesoporous</b>: 2 nm &lt; d &lt; 50 nm (e.g. MCM-41, xerogels)</li><li><b>Macroporous</b>: d &gt; 50 nm</li></ul>`},
{x:1,q:"Explain how surfactants are used to make ordered mesoporous materials.",a:`<ol><li><b>Build the template</b>: dissolve the surfactant (e.g. CTAB) at a concentration well <b>above the CMC</b>. The concentration and water/oil ratio decide what self-assembles: spherical micelles, cylinders (hexagonally packed), lamellae or multilayer "onions".</li><li><b>Generate growth species around the template</b>: sol-gel (e.g. TEOS hydrolysis and condensation) builds an inorganic network that surrounds and replicates the surfactant structure.</li><li><b>Remove the template</b> by <b>calcination</b> (burning off the organic surfactant in air) or solvent extraction, leaving uniform pores where the micelles were.</li></ol>Result: uniform pores of 3 nm to several tens of nm, pore volume up to about 70 %, surface area &gt; 700 m²/g.<p class="why">Random mesoporous silica forms when the surfactant isn't ordered (or from xerogels).</p>`},
{q:"What are MCM-41 and MCM-48, and what are mesoporous materials used for?",a:`The first ordered mesoporous materials, made by Mobil Oil and used as catalysts:<ul><li><b>MCM-41</b>: silica with a <b>hexagonal array of 1D pores</b>, 1.5–10 nm (from cylindrical micelles)</li><li><b>MCM-48</b>: aluminosilicate with a <b>3D pore system</b>, about 3 nm</li></ul>Uses: catalyst supports, adsorbents, molecular sieves, nanoscale chemical reactors.<p class="why">A patterned substrate can even determine the pore structure of a mesoporous film (epitaxy in mesoporous materials).</p>`},
{q:"What are zeolites, and how are they made?",a:`<b>Crystalline aluminosilicates</b> with a 3D framework of corner-sharing TO₄ tetrahedra (T = Si or Al), containing uniform <b>pores of molecular dimensions</b> (microporous). Pore size is set by the number of tetrahedra in the ring:<ul><li>8-ring ≈ 0.41 nm</li><li>10-ring ≈ 0.55 nm</li><li>12-ring ≈ 0.74 nm</li></ul>Made by <b>hydrothermal synthesis</b> (water above 100 °C in a pressurized vessel, giving higher solubility and diffusion). Reagents: water, a <b>silica source</b>, an <b>alumina source</b>, a <b>mineralizing agent</b> (OH⁻ or F⁻, which dissolves and transports Si and Al), and a <b>structure-directing agent</b> (an organic cation that templates the pores).`},
{x:1,q:"How are silica-coated Au nanoparticles (Au@SiO₂) made, and why is a functionalization step needed?",a:`<ol><li><b>Au core</b>: citrate reduction of HAuCl₄ (Turkevich), giving about 20 nm particles.</li><li><b>Functionalize with APS</b> ((3-aminopropyl)trimethoxysilane): add aqueous APS (2.5 mL, 1 mM) to 500 mL Au sol and stir for 15 min.<p class="why">Au is a noble metal with <b>no passivating oxide and no surface –OH groups</b>, so silica can't condense onto it directly. APS is a coupling agent: the <b>amine lone pair anchors to Au</b>, and the <b>methoxysilane end</b> points outward, ready to hydrolyse and condense with silica.</p></li><li><b>Grow the silica shell</b> by sol-gel (e.g. sodium silicate or Stöber-type TEOS), which condenses onto the silane groups.</li></ol>`},
{x:1,q:"Outline routes to core–shell particles: (a) metal@metal, (b) metal@oxide, (c) hollow oxide shell.",a:`<ul><li>(a) <b>Metal@metal</b>: colloidal synthesis of the core (precursor + reducing agent + capping agent), then reduce the second metal onto it at <b>low supersaturation</b> so it nucleates heterogeneously on the core. Or PVD/CVD of the core, then heterogeneous nucleation of the shell.</li><li>(b) <b>Metal@oxide</b>: colloidal (or PVD/CVD) metal core, then <b>sol-gel</b>, CVD or PVD of the oxide, which nucleates on the core as a substrate. A coupling agent (e.g. APS) may be needed for noble metals.</li><li>(c) <b>Hollow oxide shell</b>: make a core (metal, oxide or polymer) that is <b>more soluble</b> than the shell oxide, coat it as in (b), then <b>leach out the core</b> (dissolve or burn it away).</li></ul>`},
{q:"Why make core–shell particles at all?",a:`<ul><li><b>Protect or stabilize</b> the core (against oxidation, dissolution or agglomeration; e.g. a silica shell on magnetic particles)</li><li><b>Combine functions</b>: e.g. a magnetic core with a plasmonic, catalytic or biocompatible shell</li><li><b>Save expensive elements</b>: only the surface matters in catalysis, so put Pt only in the shell</li><li><b>Tune optical properties</b> (plasmon resonance)</li><li><b>Epitaxial core–shell</b>: the shell grows like an epitaxial thin film, giving access to strained lattice parameters</li></ul>`},
{q:"Outline the Au–Ag binary nanoparticle synthesis from the lecture.",a:`<ol><li><b>Au core</b> by sodium citrate reduction.</li><li><b>Deposit Ag</b> on it by reducing silver nitrate.</li><li><b>Add HAuCl₄ in the presence of CTAB</b>, which generates a shell of an Au–Ag <b>alloy</b> (Au replaces part of the Ag).</li></ol>`}
]});

DECKS.push({id:"litho", name:"Lithography, soft litho & SPM", lec:"L8 · L18 · L21–22 · CW 7", cards:[
{q:"What is the common principle of lithography, and why is it needed?",a:`Transfer of a <b>geometric pattern from a sacrificial layer (the resist)</b> to the material: expose the resist to radiation through a mask (or by direct writing), develop it, then use the patterned resist as a mask for etching or deposition.<p class="why">Plain layers don't make a device. Transistors, sensors and so on need patterned layers. Patterning can also create new functionality: metamaterials (properties from artificial structural "atoms") and photonic crystals (the periodic structure controls how light propagates).</p>`},
{x:1,q:"Classify lithography techniques by the radiation or tool used.",a:`<ul><li><b>Photons</b>: photolithography (UV, deep UV, EUV) and X-ray lithography</li><li><b>Electrons</b>: electron beam lithography (EBL)</li><li><b>Ions</b>: focused ion beam (FIB) lithography</li><li><b>Mechanical impression</b>: a hard mould pressed into a soft resist (nanoimprint)</li><li><b>Near-field</b>: interaction between a fine tip and the resist surface (electrical, mechanical, thermal, optical), as in SPM lithography and DPN</li></ul>`},
