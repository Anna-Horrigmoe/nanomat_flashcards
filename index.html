}

  --bg:#141218; --surface:#1d1a23; --surface-2:#26222e; --fg:#ece9f2; --muted:#a39db0; --line:#36313f;
  --accent:#f0708a; --accent-ink:#1a0d11; --accent-soft:#3a1d25;
  --good:#5cc79a; --good-soft:#173328; --bad:#f08a6c; --bad-soft:#3a2119; --star:#e2b44a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1d1a23; --surface-2:#26222e; --fg:#ece9f2; --muted:#a39db0; --line:#36313f;
  --accent:#f0708a; --accent-ink:#1a0d11; --accent-soft:#3a1d25;
  --good:#5cc79a; --good-soft:#173328; --bad:#f08a6c; --bad-soft:#3a2119; --star:#e2b44a; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.15}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.deck:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 0;min-width:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}

.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.deck[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 22px;min-height:min(56vh,440px);

.q{font-family:var(--f-display);font-weight:600;font-size:1.22rem;line-height:1.3;text-wrap:pretty}

<script>
const DECKS=[];
DECKS.push({id:"intro", name:"Why nano is special", lec:"L1 · L9 · CW 1", cards:[
{x:1,q:"What is the simplest definition of a nanomaterial?",a:`A material with <b>at least one dimension between 1 and 100 nm</b> (10⁻⁹–10⁻⁷ m).<p class="why">For scale: an atom is about 0.2–0.3 nm across, so a 1 nm particle contains only a few tens of atoms and a 10 nm particle a few tens of thousands. Nanotechnology is more than miniaturization: at this scale properties change <i>qualitatively</i> (melting point, colour, magnetism, reactivity), not just in size.</p>`},
{q:"0D, 1D, 2D and 3D nanomaterials: how many dimensions are on the nanoscale in each? Give an example of each.",a:`<ul><li><b>0D</b>: all 3 dimensions nanoscale. Nanoparticles, quantum dots, clusters.</li><li><b>1D</b>: 2 dimensions nanoscale (one long). Nanowires, nanorods, nanotubes.</li><li><b>2D</b>: 1 dimension nanoscale (thickness). Thin films, nanoplates, graphene.</li><li><b>3D</b>: no dimension nanoscale, but built from nano building blocks. Nanocrystalline solids, nanocomposites, films of nanoparticles.</li></ul><p class="why">Common trap: the number counts the dimensions that are <i>not</i> nanoscale. So "1D" has <i>two</i> nanoscale dimensions. Strictly, everything exists in 3D, so "subperiodic" is the more precise term.</p>`},
{x:1,q:"Name the four known origins of size-dependent properties in nanomaterials.",a:`<ol><li><b>Large fraction of surface atoms.</b> Surface atoms have fewer neighbours and behave differently from bulk atoms. When they are a large share of the atoms, they dominate the properties.</li><li><b>Large surface area and surface energy.</b> Lots of stored surface energy drives reactivity, lower melting points and agglomeration.</li><li><b>Spatial (quantum) confinement.</b> When the size is comparable to the electron wavelength, energy levels become discrete (quantum dots change colour with size).</li><li><b>Fewer defects.</b> Small crystals can be nearly defect-free because defects escape to the surface. This gives near-ideal mechanical strength, and when the size is below the electron mean free path, ballistic transport with very low resistance.</li></ol>`},
{x:1,q:"How does the fraction of surface atoms scale with particle radius r? Show it quickly.",a:`It scales as <b>1/r</b>.<br>Take a sphere of radius r with a surface shell of thickness Δt ≈ 0.2 nm (one atomic layer):<br>V<sub>sphere</sub> = (4/3)πr³, V<sub>surface</sub> ≈ 4πr²Δt<br><b>V<sub>surface</sub>/V<sub>sphere</sub> ≈ 3Δt/r</b><ul><li>r = 1 µm: 3·0.2/1000 ≈ 0.06 % surface atoms</li><li>r = 1 nm: 3·0.2/1 ≈ 60 % (the approximation Δt ≪ r breaks down, but the order of magnitude is right)</li></ul><p class="why">Data from the lecture: Pd clusters have about 76 % surface atoms at 1.2 nm, 45 % at 5 nm and 35 % at 7 nm. A 1 cm³ Fe cube has about 0.00001 %, while a 1 nm³ Fe cube is essentially all surface.</p>`},
{q:"A volume V is divided into cubes of edge a. How does the total surface area scale?",a:`Number of cubes N = V/a³, each with area 6a²:<br><b>A<sub>tot</sub> = N·6a² = 6V/a</b>, so a·A<sub>tot</sub> is constant and the area grows as 1/a.<br>For V = 1 cm³: a = 1 cm gives 6 cm², a = 1 mm gives 60 cm², a = 1 nm gives 6·10⁷ cm² (6000 m²).<p class="why">Example: a 9 cm cube (729 cm³) cut into 3 nm cubes gives 6·729/(3·10⁻⁷) ≈ 1.5·10¹⁰ cm², about 1.5 km². That enormous area stores a lot of surface energy, which is why nanoparticles are so reactive and tend to agglomerate.</p>`},
{x:1,q:"What is the main difference between 1 g of bulk powder and 1 g of nanocrystalline powder of the same material?",a:`The nanocrystalline powder has a <b>much larger specific surface area</b> (A ∝ 1/size) and a much <b>higher fraction of surface atoms</b>.<p class="why">Surface atoms are under-coordinated and high in energy, so the nanopowder is far more reactive (faster dissolution, catalysis, sintering at lower T), has a lower melting point, and has a strong driving force to agglomerate.</p>`},
{x:1,q:"Compare top-down and bottom-up synthesis: examples, advantages and disadvantages.",a:`<b>Top-down</b>: refining or reducing bulk material, e.g. ball milling, etching, attrition, quenching, lithography.<ul><li>+ high yield, easy to scale up, cheap, well established (microelectronics)</li><li>− broad size distribution, varied morphology, impurities from milling media, defective and damaged surfaces</li></ul><b>Bottom-up</b>: building from atoms or molecules, e.g. colloidal synthesis, sol-gel, hydrothermal, spray pyrolysis, CVD, self-assembly.<ul><li>+ controlled size, morphology and composition; high purity; few defects; can reach very small sizes</li><li>− often low yield, more complicated chemistry, sometimes hard to scale up, hard to control placement over large areas</li></ul><p class="why">Surface damage from top-down processing matters much more for nanostructures, because so many of the atoms sit at the surface. That is why the course focuses on bottom-up methods (lithography is the exception, treated as a hybrid).</p>`},
{q:"What is the 'eternal challenge' of nanoparticle work, and what drives it?",a:`Achieving <b>uniformity</b> (narrow size distribution, controlled shape) and <b>avoiding agglomeration</b>.<p class="why">The high surface energy makes nanoparticles thermodynamically unstable (metastable at best). Every system tries to lower its total surface area by agglomeration, Ostwald ripening or sintering. Example from the lecture: Fe₂O₃ nanoparticles precipitated without surfactant form large agglomerates. With SDS (sodium dodecyl sulfate, hydrophilic head + hydrophobic tail) adsorbed on the surface, they stay well dispersed.</p>`},
{x:1,q:"Why do smaller particles melt at lower temperature?",a:`Surface atoms have fewer neighbours, so they are more weakly bound than bulk atoms. When a large fraction of the atoms sits at the surface, the average binding is weaker and <b>less thermal energy is needed to melt the particle</b>.<p class="why">The melting point depression scales roughly as 1/r, like the fraction of surface atoms. Au approaches bulk T<sub>m</sub> (1337 K) for large particles but drops dramatically below about 5 nm. In thermodynamic terms, the high surface energy of a small particle raises its Gibbs energy, so the solid becomes less stable relative to the liquid.</p>`},
{q:"What is surface plasmon resonance (SPR), and what does it depend on?",a:`A <b>collective oscillation of the conduction electrons</b> at the surface of metallic nanoparticles, driven in resonance by the electric field of light. At the resonance wavelength, absorption and scattering are strongly amplified.<ul><li><b>Size</b>: Au spheres absorb around 520 nm, which gives a red colour. Larger particles shift the peak to longer wavelengths (red-shift) and broaden it.</li><li><b>Shape</b>: Au nanorods get an extra longitudinal plasmon peak that moves into the near-IR as the aspect ratio increases, so the colour of the solution changes.</li></ul><p class="why">The Lycurgus cup (4th century, about 70 nm Ag/Au particles) looks red in transmitted light and green in reflected light because of SPR.</p>`},
{q:"What is quantum confinement, and how does it show up in quantum dots?",a:`When the particle size becomes comparable to the de Broglie wavelength of the electrons (for semiconductors, the <b>exciton Bohr radius</b>, typically a few nm), the electrons are "squeezed". Continuous bands turn into <b>discrete energy levels</b> and the <b>band gap increases as the size decreases</b> (like a particle in a box, where E ∝ 1/L²).<p class="why">That's why quantum dots of the same material (e.g. CdSe) emit blue when small and red when larger. Size becomes a tuning knob for optical properties.</p>`},
{q:"Define nanoparticle, nanocrystal and quantum dot.",a:`<ul><li><b>Nanoparticle</b>: a material where all three dimensions are in the nanoscale (0D). Can be amorphous or crystalline.</li><li><b>Nanocrystal</b>: a crystalline nanoparticle.</li><li><b>Quantum dot</b>: a semiconductor nanocrystal with (size-dependent) fluorescent properties due to quantum confinement.</li></ul>`},
{x:1,q:"Name properties that change with decreasing particle size, and the direction they usually change.",a:`<ul><li><b>Lattice parameter / unit cell volume</b>: <b>decreases</b> for metals and covalent materials (shared electrons over fewer bonds give shorter bonds); <b>increases</b> for ionic materials (truncated Madelung attraction)</li><li><b>Melting temperature</b>: down (surface atoms weakly bound)</li><li><b>Vapour pressure and solubility</b>: up (Young–Laplace, higher μ for small R)</li><li><b>Phase transition temperatures</b> (ferroelectric, magnetic): usually down</li><li><b>Optical band gap</b>: up (quantum confinement)</li><li><b>Specific surface area</b>: up (∝ 1/r)</li><li><b>Magnetism</b>: single-domain below a critical size, then superparamagnetic</li></ul>`},
{x:1,q:"Name two properties that do NOT change monotonically with size but go through a maximum or minimum.",a:`<ul><li><b>Magnetic coercive field</b>: increases as particles become single-domain (switching needs coherent rotation instead of easy domain wall motion), then drops when particles become superparamagnetic (KV ≈ k<sub>B</sub>T).</li><li><b>Mechanical yield strength</b> of nanocrystalline materials: increases as grains shrink (grain boundaries block dislocations), then decreases again at very small grain sizes (inverse Hall–Petch, as grain boundary sliding takes over).</li></ul>`},
{q:"List the internal morphologies a binary (A+B) nanoparticle can have. What does Cu@Ag mean?",a:`<ul><li><b>Mixed / alloy</b>: A and B distributed randomly or ordered (e.g. CuAg)</li><li><b>Core–shell</b>: one element inside, the other outside (multi-core–shell also exists)</li><li><b>Layered</b> structure</li><li><b>Heterodimer / "dumbbell"</b>: two parts side by side (e.g. FeAg)</li><li><b>Satellite</b>: a large particle decorated with small ones (e.g. Si covered with small Ag particles)</li></ul><b>Cu@Ag</b> means a Cu core with an Ag shell (core@shell notation).`},
{x:1,q:"Binary metallic nanoparticles: is each morphology stabilized by enthalpy or entropy? (a) disordered alloy (b) core–shell (c) dumbbell",a:`Use ΔG = ΔH − TΔS:<ul><li>(a) <b>Disordered alloy: entropy.</b> Random mixing maximizes configurational entropy, so the −TΔS term stabilizes it (especially at high T).</li><li>(b) <b>Core–shell: enthalpy.</b> Segregation lowers the entropy, so it must be paid for by lower energy: the low-surface-energy metal sits at the surface, and favourable bonding at the interface.</li><li>(c) <b>Dumbbell: enthalpy.</b> Also segregated (low entropy). Favoured when A–B mixing and interfaces are energetically costly (e.g. large lattice mismatch), so minimizing the A–B interface lowers H.</li></ul>`},
{x:1,q:"All bottom-up methods rely on self-assembly. Is the driving force enthalpy or entropy? Explain.",a:`<b>Enthalpy.</b><br>ΔG = ΔH − TΔS must be &lt; 0 for a spontaneous process. When atoms or molecules order themselves into a structure, configurational entropy <b>decreases</b> (ΔS &lt; 0), so −TΔS is positive. The process can only happen if ΔH is negative enough (bond formation) to outweigh it.<p class="why">Consequence: self-assembly is favoured at <b>low temperature</b>, where −TΔS is small. At high T, entropy wins and structures disorder. Since kinetics (diffusion) slows exponentially at low T, synthesis is always a trade-off between thermodynamics and kinetics.</p>`}
]});

DECKS.push({id:"surface", name:"Surface energy & curvature", lec:"L2 · CW 2.2–2.3", cards:[
{x:1,q:"Define (specific) surface energy γ.",a:`The energy (work) needed to create a <b>unit area of new surface</b>:<br><b>γ = (∂G/∂A)<sub>n<sub>i</sub>,T,p</sub> = dW/dA</b> (units J/m²)<p class="why">It is always positive: creating surface always costs energy because bonds are broken. Surfaces always come in pairs when you cleave a solid.</p>`},
{x:1,q:"What is the microscopic origin of surface energy?",a:`Surface atoms have <b>fewer nearest neighbours</b> (lower coordination number) than bulk atoms, so they have unsatisfied, broken <b>"dangling" bonds</b>. They are in a higher energy state and feel a net inward force from the bulk.<p class="why">Consequences: (1) for small particles, the inward pull gives a measurable <b>reduction of the lattice parameter</b>; (2) nanomaterials are metastable or unstable and will always try to lower their total surface energy (by surface modification, shape change or combining particles).</p>`},
{x:1,q:"What is the difference between surface tension and surface energy?",a:`<ul><li><b>Surface tension</b>: a <b>force per unit length</b> (N/m) acting in the surface of a <b>liquid</b> (liquid–gas interface)</li><li><b>Surface energy</b>: the <b>energy cost per unit area</b> (J/m²) of creating new surface, used for solids</li></ul><p class="why">For a liquid the two are numerically equal, because atoms move freely and new surface forms simply by atoms moving out to it. For a solid, stretching the surface also changes the strain, so the two can differ.</p>`},
{q:"Give the broken-bond estimate of surface energy and explain each term. Why the factor ½?",a:`<b>γ ≈ ½ · N<sub>b</sub> · ε · ρ<sub>a</sub></b><ul><li>N<sub>b</sub>: number of broken bonds per surface atom</li><li>ε: bond strength (J per bond)</li><li>ρ<sub>a</sub>: surface atomic density (atoms per m²)</li></ul><p class="why">The ½ appears because breaking one bond creates <b>two</b> surfaces, so each surface gets half the bond energy. This is a "rigid surface" estimate: it ignores relaxation, reconstruction and adsorption, which all lower the real γ.</p>`},
{x:1,q:"For an fcc crystal, calculate and rank γ for {100}, {110} and {111}. Why is {111} lowest?",a:`Using γ = ½N<sub>b</sub>ερ<sub>a</sub> (each fcc atom has CN 12):<ul><li><b>{100}</b>: N<sub>b</sub> = 4, ρ<sub>a</sub> = 2/a² → γ = <b>4ε/a²</b> = 4.00 ε/a²</li><li><b>{110}</b>: N<sub>b</sub> = 5, ρ<sub>a</sub> = 2/(√2 a²) → γ = <b>5ε/(√2 a²)</b> ≈ 3.54 ε/a²</li><li><b>{111}</b>: N<sub>b</sub> = 3, ρ<sub>a</sub> = 4/(√3 a²) → γ = <b>2√3 ε/a²</b> ≈ 3.46 ε/a²</li></ul>Ranking: γ<sub>111</sub> &lt; γ<sub>110</sub> &lt; γ<sub>100</sub>.<p class="why">{111} is the close-packed plane: each surface atom keeps 9 of its 12 bonds and loses only 3. In general, <b>low Miller indices give low γ</b>; a facet like {520} probably has very high γ. (Cao & Wang eq. 2.5 has a typo for {111}.)</p>`},
{x:1,q:"What structural factors determine the surface energy of a specific crystallographic facet?",a:`Mainly the <b>atomic density of the plane</b>, which sets the number of broken bonds per surface atom and per area. Densely packed planes break fewer bonds per atom and have low γ.<p class="why">Bond strength ε (which atoms, what kind of bonding) is the chemical factor. Relaxation and reconstruction then lower γ from the rigid estimate.</p>`},
{x:1,q:"What would hypothetically happen if a solid's surface energy suddenly became negative?",a:`Creating surface would <b>lower</b> the Gibbs energy (dG = γ dA &lt; 0), so the material would spontaneously maximize its surface area and <b>disintegrate</b>: dissolve or turn into a gas of atoms.<p class="why">A positive γ is what holds condensed matter together and makes surfaces cost energy.</p>`},
{x:1,q:"List all the mechanisms by which nanostructures reduce total surface energy, grouped into three levels.",a:`<b>1. Surface with fixed area</b> (lower γ):<ul><li>Relaxation (bond lengths)</li><li>Restructuring / reconstruction (bond angles)</li><li>Adsorption (from the surroundings)</li><li>Compositional segregation (de-mixing at the surface)</li></ul><b>2. Shape of an individual particle</b> (lower Σγ<sub>i</sub>A<sub>i</sub>):<ul><li>Minimize surface area (sphere)</li><li>Form low-energy facets (Wulff shape)</li></ul><b>3. Overall system</b> (lower total area):<ul><li>Sintering</li><li>Ostwald ripening</li><li>Agglomeration</li></ul>`},
{x:1,q:"Surface relaxation: what is it, and how does it differ for metallic, covalent and ionic materials?",a:`Surface atoms shift position (mainly perpendicular to the surface), changing bond lengths, without changing the surface periodicity.<ul><li><b>Metals and covalent</b>: inward relaxation, bonds <b>contract</b>. The valence electrons are shared over fewer neighbours, so each remaining bond gets more electron density and becomes shorter and stronger.</li><li><b>Ionic</b>: <b>expansion</b>. Cohesion comes from the long-range Madelung attraction. At the surface the attractive sum is truncated (fewer ions pulling back), so ions move apart.</li></ul>`},
{x:1,q:"Give a microscopic explanation for why ionic oxide nanoparticles expand while metal and semiconductor nanoparticles contract as size decreases.",a:`<b>Metallic and covalent (shared electrons):</b> at the surface the coordination number drops, but the atom has the same number of valence electrons. They are distributed over fewer bonds, giving <b>higher electron density per bond</b>, shorter bonds and a <b>lattice contraction</b>. (Equivalently: better screening of ion–ion repulsion and more bonding states occupied.) Small particles are mostly surface, so the whole lattice contracts.<br><br><b>Ionic (full charge transfer):</b> electrons are not shared. Cohesion comes from the electrostatic <b>Madelung potential</b>, a sum of attractions and repulsions over all ions out to long range. In a small particle the sum is <b>truncated</b>: there are fewer ions beyond the surface, so the net attraction is weaker and the lattice <b>expands</b>.<p class="why">Only a "macroscopic" answer (e.g. surface stress) gets little credit at the exam. Mention shared vs transferred electrons and the Madelung potential.</p>`},
{x:1,q:"How do you expect the unit cell volume to change with decreasing particle size for GaAs, LiF and Au? Explain.",a:`<ul><li><b>GaAs</b> (mainly covalent): <b>shrinks</b></li><li><b>LiF</b> (ionic): <b>expands</b></li><li><b>Au</b> (metallic): <b>shrinks</b></li></ul><p class="why"><b>Why:</b> in covalent and metallic bonding the valence electrons are <i>shared</i>. Surface atoms have fewer neighbours, so their electrons are concentrated in fewer bonds, which become shorter. As the surface fraction grows (∝ 1/r), the average lattice contracts.<br>In ionic bonding the electrons are <i>transferred</i>, and the crystal is held together by the long-range Madelung attraction. In a nanoparticle this sum is truncated at the surface, so attraction weakens and the lattice expands.</p>`},
{x:1,q:"Why do covalent materials reconstruct their surfaces while metals and ionic materials mainly relax?",a:`<b>Covalent bonds are directional</b> (e.g. sp³ in Si and diamond). A cut surface leaves dangling sp³ orbitals pointing into vacuum, which is very costly. Atoms can lower the energy by moving laterally and bending bonds so that neighbouring dangling bonds pair up into new bonds. This changes the surface periodicity (e.g. dimer rows on Si{100}, the 7×7 reconstruction of Si{111}).<br><br><b>Metallic and ionic bonding are non-directional</b> (isotropic), so there is no dangling orbital to "re-hybridize". Atoms only adjust their distances, which is relaxation.<p class="why">Bending bonds costs some energy, but the electronic gain from reduced dangling-bond overlap is larger.</p>`},
{q:"How does adsorption lower surface energy? Give an example.",a:`Dangling bonds at the surface are saturated by atoms or molecules from the surroundings, by <b>chemisorption</b> (strong ionic or covalent bonds) or <b>physisorption</b> (weak van der Waals).<p class="why">Examples: Si and diamond surfaces terminated by –H or –OH (from water in the air). Si oxidizes instantly in air because its clean surface is so reactive. Adsorption is interdependent with relaxation and reconstruction, since saturated bonds remove the reason to reconstruct.</p>`},
{q:"What is compositional segregation at a surface, and why does it happen?",a:`Enrichment of impurities, or of one component of an alloy, at the surface or at grain boundaries by <b>solid-state diffusion</b>.<p class="why">The component that lowers the surface (or interface) energy most moves there, which lowers the total energy of the system. It is very common in alloys and doped materials, but irrelevant for completely pure materials.</p>`},
{x:1,q:"What is the equilibrium shape of an amorphous nanoparticle (or a liquid droplet), and why?",a:`<b>Spherical.</b><p class="why">An amorphous solid or liquid has the same atomic density in all directions, so γ is <b>isotropic</b>. The total surface energy γ·A is then minimized by minimizing the area A for a given volume, and the sphere has the lowest area-to-volume ratio.</p>`},
{x:1,q:"What determines the equilibrium shape of a crystalline nanoparticle? State and explain the Wulff construction.",a:`The <b>anisotropic surface energies</b> γ<sub>i</sub> of the different crystal facets. The equilibrium shape minimizes <b>Σ γ<sub>i</sub>A<sub>i</sub></b> at constant volume.<br><b>Wulff construction</b>: the distance h<sub>i</sub> from a fixed centre to each facet is proportional to that facet's surface energy:<br><b>γ<sub>i</sub> = C·h<sub>i</sub></b><p class="why">Low-energy facets lie <b>closer</b> to the centre. A plane close to the centre is cut by fewer other planes, so it ends up with a <b>large area</b>. High-energy facets lie far out and get small areas or vanish. For fcc this gives truncated octahedra dominated by {111} with smaller {100} facets.</p>`},
{x:1,q:"What energetic factor drives a crystalline nanoparticle to deviate from a spherical shape?",a:`<b>Crystallinity itself.</b> Planes with different Miller indices have different atomic densities, so different numbers of broken bonds and different γ. Exposing low-γ planes lowers Σγ<sub>i</sub>A<sub>i</sub> even if the total area becomes larger than for a sphere.<p class="why">The more anisotropic the crystal structure, the more anisometric (non-spherical) the particles become, following the Wulff construction.</p>`},
{q:"Why are nanoparticles grown at high temperature often spherical rather than faceted?",a:`<b>Surface roughening transition:</b> above a certain temperature, entropy makes atomically flat facets unstable. The surfaces become rough, and the energy difference between facets disappears, so γ becomes nearly isotropic and the particle rounds off.<p class="why">Kinetic factors can also prevent facets: fast growth, or growth conditions that don't allow atoms time to reach equilibrium positions.</p>`},
{x:1,q:"Sintering: what happens, at what temperature, and what is the result?",a:`Particles in contact <b>merge into one solid</b> by solid-state diffusion (necks form between particles and the material densifies). It typically happens at about <b>70 % of T<sub>m</sub></b>, where atoms are mobile enough.<p class="why">Driving force: reduction of surface area. The high-energy solid–vapour interface is replaced by lower-energy solid–solid interfaces (<b>grain boundaries</b>), so the product is <b>polycrystalline</b>. In practice: compress and heat a powder to make a dense ceramic. Nanopowders sinter at lower T than coarse powders because of their high surface energy.</p>`},
{x:1,q:"Ostwald ripening: what happens, at what temperature, and what is the result?",a:`<b>Large particles grow at the expense of small ones</b> until the small ones disappear completely. Mass moves through the surrounding medium (dissolution, diffusion, deposition), so the particles don't need to touch.<ul><li>Happens at <b>relatively low temperature</b> (e.g. in a solution at room temperature)</li><li>The grown particle is a <b>single crystal</b> (grows atom by atom)</li><li>The mean size increases and the number of particles decreases</li></ul><p class="why">Driving force: curvature. Small particles have a higher chemical potential (Young–Laplace, Δμ = 2γΩ/R), so they are more soluble.</p>`},
{x:1,q:"Agglomeration: how does it differ from sintering and Ostwald ripening?",a:`Individual particles stick together into clusters through <b>chemical or physical bonds</b> (van der Waals, hydrogen bonds, chemical bridges) <b>without any mass transport</b>. Each particle keeps its identity, size and shape.<p class="why">The smaller the particles, the greater the bonding forces relative to their mass. Agglomerates held by physical forces can sometimes be broken (e.g. ultrasound), while chemically bonded ones generally cannot. Sintering and Ostwald ripening both move atoms; agglomeration doesn't.</p>`},
{x:1,q:"What is the main driving force for nanoparticle agglomeration?",a:`<b>Reduction of the total surface area</b>, and with it the total surface energy (γ·A).<p class="why">When two particles stick together, the contact area is no longer free surface. Van der Waals attraction provides the force that brings them together; the surface energy is the thermodynamic reason they stay together.</p>`},
{x:1,q:"A dispersion of nanoparticles in a liquid at room temperature: in which ways can the system lower its total energy?",a:`<ul><li><b>Ostwald ripening</b>: small particles dissolve, large ones grow (mass transport through the liquid)</li><li><b>Agglomeration</b>: particles cluster together</li></ul><p class="why">Sintering is unlikely: it requires high temperature (about 0.7 T<sub>m</sub>) and solid-state diffusion between touching particles. (Cold sintering under pressure exists but is outside the curriculum.)</p>`},
{x:1,q:"Write the Young–Laplace equation for chemical potential and define the terms.",a:`<b>Δμ = γΩ(1/R₁ + 1/R₂)</b>, which for a sphere (R₁ = R₂ = R) gives <b>Δμ = 2γΩ/R</b><ul><li>Δμ: chemical potential of an atom at the curved surface relative to a flat surface</li><li>γ: surface energy</li><li>Ω: atomic volume</li><li>R₁, R₂: principal radii of curvature (positive for convex, negative for concave)</li></ul><p class="why">Derivation idea: moving dn atoms onto a sphere increases its volume by dV = Ω dn and its area by dA = 8πR dR. With dV = 4πR² dR, Δμ = γ dA/dn = 2γΩ/R. So μ rises as R shrinks.</p>`},
{x:1,q:"Compare convex and concave surfaces in terms of chemical potential, solubility and vapour pressure.",a:`<ul><li><b>Convex</b> (R &gt; 0): particles, droplets, bumps. μ <b>higher</b> than on a flat surface, so <b>higher solubility and vapour pressure</b>.</li><li><b>Concave</b> (R &lt; 0): pores, bubbles, necks between particles. μ <b>lower</b>, so lower solubility and vapour pressure.</li></ul>Solubility follows directly: S = S<sub>flat</sub>·exp(2γΩ/(kTR)) (Kelvin/Gibbs–Thomson).<p class="why">Atoms therefore have a driving force to move from convex to concave regions. This explains Ostwald ripening (small particles feed large ones) and why necks fill in during sintering.</p>`},
{x:1,q:"Use the Young–Laplace equation to explain Ostwald ripening.",a:`Δμ = 2γΩ/R, so <b>the smaller the particle, the higher the chemical potential</b> of its surface atoms, and the larger the difference in radius, the larger the difference in μ.<ol><li>Higher μ means higher solubility: atoms dissolve from the small particles.</li><li>They diffuse through the medium and deposit on the large particles, where μ is lower.</li><li>Small particles shrink and vanish; large ones grow.</li></ol><p class="why">The total energy falls for two reasons: atoms move to a lower chemical potential, and the total surface area decreases.</p>`},
{x:1,q:"How do melting temperature and vapour pressure scale with decreasing particle size?",a:`<ul><li><b>Melting temperature decreases</b>: a large share of weakly bound surface atoms, roughly ∝ 1/r</li><li><b>Vapour pressure (and solubility) increase</b>: Young–Laplace, Δμ = 2γΩ/R, so p = p<sub>flat</sub>·exp(2γΩ/(kTR))</li></ul>`},
{x:1,q:"A faceted cubic nanocrystal starts to dissolve. Where is dissolution fastest? Where is a vacancy most stable? Explain.",a:`Both happen first at the <b>corners (apices)</b>, then at <b>edges</b> (high curvature first), and slowest on the <b>low-energy facets</b>.<p class="why">Atoms at corners have the lowest coordination number, so the fewest bonds must be broken to remove them. This is the reverse of growth, where an adatom is most stable on the site where it forms the most bonds. For the same reason, forming a vacancy (removing an atom) costs least at a corner.</p>`},
{x:1,q:"In a core–shell nanoparticle of two metals, how can surface energy predict which metal forms the shell?",a:`The metal with the <b>lowest surface energy</b> forms the <b>shell</b>, and the one with the highest surface energy forms the core.<p class="why">Only the shell is exposed, so putting the low-γ metal outside minimizes the total surface energy Σγ<sub>i</sub>A<sub>i</sub>. The same logic explains surface segregation in alloys.</p>`},
{q:"Define chemical potential μ in the context of surface curvature.",a:`The incremental change in (surface) free energy when <b>one more atom</b> is added to the surface (μ = ∂G/∂n).<p class="why">Adding an atom to a convex surface increases the surface area more than adding it to a flat or concave surface, so μ is higher on convex surfaces: Δμ = 2γΩ/R.</p>`}
]});

DECKS.push({id:"stab", name:"Stabilization of dispersions", lec:"L3 · CW 2.4–2.6", cards:[
{x:1,q:"What are the two main ways to prevent agglomeration, and what kind of stability does each give?",a:`<ul><li><b>Electrostatic stabilization</b>: the particles carry surface charge and an electric double layer. Repulsion creates an energy barrier. The system is <b>kinetically</b> stable.</li><li><b>Steric stabilization</b>: polymers or surfactants are attached to the surface. Overlap of the layers is unfavourable. The system is <b>thermodynamically</b> stable.</li></ul>Combining both gives <b>electrosteric</b> stabilization.`},
{x:1,q:"Why is electrostatic stabilization called 'kinetic' and steric stabilization 'thermodynamic'?",a:`<ul><li><b>Electrostatic</b>: the agglomerated state (primary minimum) is still the lowest-energy state. The dispersion survives only because an <b>energy barrier</b> (DLVO) stops particles from reaching it, as long as Brownian motion (≈ k<sub>B</sub>T) can't supply enough energy. Given a big enough push (more salt, pH near PZC), it agglomerates irreversibly. That is kinetic stability.</li><li><b>Steric</b>: when particles approach, the polymer layers overlap, chains lose freedom and configurational entropy drops, so ΔG &gt; 0. The separated dispersion is the <b>equilibrium ground state</b>, and no barrier is needed. That is thermodynamic stability.</li></ul>`},
{q:"List five ways a solid surface in a liquid can acquire surface charge.",a:`<ol><li><b>Preferential adsorption of ions</b> (chemical or physical), e.g. Na⁺ from NaCl solution adsorbing on a particle</li><li><b>Dissociation of surface charged species</b>, e.g. surface –OH groups losing or gaining H⁺</li><li><b>Isomorphic substitution</b> of ions, e.g. Na⁺ replacing Ti⁴⁺ in TiO₂ leaves a net negative charge</li><li><b>Accumulation or depletion of electrons</b> at the surface (e.g. metals or semiconductors)</li><li><b>Physical adsorption</b> of charged species (e.g. charged surfactants or polyelectrolytes)</li></ol>`},
{x:1,q:"Write the surface potential of an oxide in water as a function of pH. Where does it come from?",a:`From the Nernst equation, E = E₀ + (RT/n<sub>i</sub>F) ln a<sub>i</sub>, with H⁺ as the potential-determining ion (a<sub>H⁺</sub> = 10<sup>−pH</sup>):<br><b>E = 2.303 RT/F · (PZC − pH)</b><p class="why">About 59 mV per pH unit at room temperature. Positive below the PZC, negative above it. Surface –OH groups take up H⁺ (–OH₂⁺) in acid and lose it (–O⁻) in base, so H⁺ and OH⁻ are the charge-determining ions.</p>`},
{x:1,q:"What is the PZC, and why does it matter for dispersion stability?",a:`<b>Point of zero charge</b>: the pH at which the oxide surface has zero net charge.<ul><li>pH &lt; PZC: surface <b>positive</b> (–OH₂⁺, H⁺ adsorbed)</li><li>pH &gt; PZC: surface <b>negative</b> (–O⁻, OH⁻ adsorbed)</li></ul><p class="why">At pH = PZC there is no electrostatic repulsion, only van der Waals attraction, so the particles agglomerate. For electrostatic stabilization, work at a pH well away from the PZC: the further away, the larger |E| and the higher the energy barrier.</p>`},
{x:1,q:"SiO₂ has a low PZC (≈ 2) and MgO a high PZC (≈ 12). At what pH is each stabilized, and with what charge?",a:`<ul><li><b>SiO₂</b>: stable at pH &gt; PZC (e.g. neutral or basic water), with a <b>negative</b> surface charge</li><li><b>MgO</b>: stable at pH &lt; PZC, with a <b>positive</b> surface charge</li></ul><p class="why">E = 2.303RT/F·(PZC − pH): the sign of (PZC − pH) gives the sign of the charge, and its size controls how strong the repulsion is.</p>`},
{x:1,q:"Mixed dispersion at pH 7: TiO₂ (PZC ≈ 6) and Fe₂O₃ (PZC ≈ 8.6). Give each surface charge and charge-determining species. Which stabilization would you choose?",a:`<ul><li><b>TiO₂</b>: pH 7 &gt; PZC, so <b>negative</b>. Charge-determining species: OH⁻ (deprotonated –O⁻).</li><li><b>Fe₂O₃</b>: pH 7 &lt; PZC, so <b>positive</b>. Charge-determining species: H⁺.</li></ul>Choose <b>steric (thermodynamic)</b> stabilization with adsorbed or anchored polymers.<p class="why">In a multi-phase system with different PZCs, no single pH charges both strongly in the same direction. Here they are even oppositely charged, so they would attract each other (heterocoagulation). Steric stabilization does not depend on surface charge.</p>`},
{x:1,q:"Describe the electric double layer near a charged surface in a liquid, and define the zeta potential.",a:`<ul><li><b>Stern layer</b>: counter-ions adsorbed tightly on the surface; the potential drops linearly through it</li><li><b>Diffuse layer</b> (Gouy layer): counter-ions held loosely; their concentration and the potential decay roughly exponentially with distance, φ ∝ exp(−κx)</li><li><b>Shear plane</b>: the boundary of the liquid layer that moves with the particle</li></ul>The <b>zeta potential ζ</b> is the potential at the shear plane. It is the measurable quantity that indicates stability: |ζ| above about 30 mV usually means a stable dispersion.`},
{x:1,q:"Which factors determine the thickness of the double layer (κ⁻¹), and how?",a:`<b>κ⁻¹ ∝ √( ε<sub>r</sub>ε₀ k<sub>B</sub>T / Σ C<sub>i</sub>z<sub>i</sub>² )</b> (Debye length)<ul><li><b>Counter-ion concentration</b> C<sub>i</sub>: higher gives a <b>thinner</b> layer</li><li><b>Valence</b> z<sub>i</sub> of the counter-ions: higher gives a <b>thinner</b> layer (and enters squared)</li><li><b>Dielectric constant</b> ε<sub>r</sub> of the solvent: higher gives a thicker layer</li><li><b>Temperature</b> T: higher gives a thicker layer</li></ul><p class="why">More or higher-charged ions screen the surface charge over a shorter distance.</p>`},
{x:1,q:"How does the ion concentration in the solution affect the stability of an electrostatically stabilized dispersion?",a:`Higher ion concentration (ionic strength) gives a <b>thinner double layer</b> (κ⁻¹ ∝ 1/√ΣC<sub>i</sub>z<sub>i</sub>²). The repulsion Φ<sub>R</sub> ∝ exp(−κS) then decays faster, so the <b>energy barrier is lower</b> and the dispersion is <b>less stable</b>.<p class="why">Counterintuitive point: low salt concentration gives the best stability. Adding salt is a standard way to make colloids coagulate ("salting out"), and divalent or trivalent ions are much more effective because of the z² dependence.</p>`},
{q:"How is the zeta potential measured?",a:`<ol><li>Apply an electric field E across the dispersion.</li><li>Charged particles move (electrophoresis). Measure their velocity V, e.g. from the <b>Doppler shift</b> of scattered laser light (ω<sub>D</sub> = q·V).</li><li>Electrophoretic mobility: <b>μ<sub>e</sub> = V/E</b>.</li><li>Convert to ζ with a model, e.g. Smoluchowski: <b>μ<sub>e</sub> = ε<sub>r</sub>ε₀ζ/η</b> (η = viscosity, temperature-dependent).</li></ol><p class="why">The relation between mobility and ζ is not trivial in general; Smoluchowski holds when the double layer is thin compared with the particle size.</p>`},
{q:"Why do two charged particles repel each other? Give the repulsive potential.",a:`<ol><li><b>Equal charges repel</b> (Coulomb).</li><li><b>Osmotic flow</b>: when the double layers overlap (separation S &lt; 2 double-layer thicknesses), the counter-ion concentration between the particles rises. Solvent flows into the gap to dilute it, pushing the particles apart.</li></ol><b>Φ<sub>R</sub> = 2π ε<sub>r</sub>ε₀ r E² exp(−κS)</b><br>(r = particle radius, E = surface potential, κ⁻¹ = double-layer thickness, S = separation)<p class="why">The repulsion decays exponentially with S over the length κ⁻¹, which is why the double-layer thickness controls stability.</p>`},
{q:"Give the van der Waals attraction between two spheres at short separation. What is A?",a:`<b>Φ<sub>A</sub> ≈ −A r / (12 S)</b> for S ≪ r<br>A is the <b>Hamaker constant</b>, about 10⁻²⁰–10⁻¹⁹ J, which depends on the materials and the medium.<p class="why">The attraction falls off only as 1/S, much more slowly than the exponential repulsion. So at very short and at long distances attraction can win, which gives the primary and secondary minima in DLVO. Brownian motion also matters, while gravity is usually negligible for nanoparticles.</p>`},
{x:1,q:"DLVO theory: what are the attractive and repulsive terms, and what does the total potential curve look like?",a:`<b>Φ = Φ<sub>A</sub> + Φ<sub>R</sub></b><br>Φ<sub>A</sub> = −Ar/12S (van der Waals attraction), Φ<sub>R</sub> = 2πε<sub>r</sub>ε₀rE²exp(−κS) (double-layer repulsion)<ul><li><b>Primary minimum</b> at very short distance: deep, gives irreversible agglomeration</li><li><b>Energy barrier</b> (maximum) at intermediate distance: kinetic stabilization. If it is much larger than k<sub>B</sub>T, the dispersion is stable.</li><li><b>Secondary minimum</b> at larger distance: shallow, gives weak, reversible flocculation</li></ul><p class="why">Adding salt shrinks κ⁻¹, which lowers the barrier until it disappears and the dispersion coagulates. DLVO = Derjaguin, Landau, Verwey, Overbeek.</p>`},
{x:1,q:"List the limitations of electrostatic stabilization, and its advantages.",a:`<b>Limitations:</b><ol><li>Works only for <b>dilute</b> systems (concentrated particles are close together, so double layers overlap)</li><li><b>Electrolyte sensitive</b> (salt compresses the double layer)</li><li>Agglomerated particles are close to impossible to <b>re-disperse</b> (they sit in the deep primary minimum)</li><li>Hard to apply to <b>multi-phase systems</b>: different solids have different PZC and surface charge under the same conditions</li></ol><b>Advantages:</b> simple and cheap, and no large macromolecules to remove afterwards.`},
{x:1,q:"Advantages and disadvantages of steric stabilization?",a:`<b>Advantages:</b><ol><li><b>Thermodynamic</b> stabilization: the dispersed state is the equilibrium state, and particles can be re-dispersed</li><li>Works for <b>non-dilute</b> (concentrated) systems</li><li><b>Not electrolyte sensitive</b></li><li>Suitable for <b>multi-phase</b> systems</li><li>Polymers can add functionality (e.g. biocompatibility, binding sites)</li></ol><b>Disadvantages:</b> the polymers may be hard to remove, or unwanted in the final application (e.g. they block catalytic sites or electrical contact). Results also depend on solvent quality.`},
{x:1,q:"Explain the fundamental difference between steric and electrostatic stabilization in terms of what keeps particles apart.",a:`<ul><li><b>Electrostatic</b>: adsorbed ions create an electric double layer. Overlap of double layers gives repulsion, which together with van der Waals attraction creates an <b>energy barrier</b> (DLVO). Agglomeration still lowers the total energy but is hindered <b>kinetically</b>. (Sometimes called enthalpic stabilization.)</li><li><b>Steric</b>: when the polymer layers on two particles overlap, the chains are confined and lose conformations, so <b>configurational entropy decreases</b> (ΔS &lt; 0, so −TΔS &gt; 0 and ΔG &gt; 0). The local polymer concentration in the gap also rises, giving an <b>osmotic pressure</b> that pushes solvent in. Agglomeration is <b>thermodynamically</b> unfavourable.</li></ul><p class="why">For full marks at the exam: kinetics + DLVO barrier vs thermodynamics + configurational entropy.</p>`},
{q:"Steric stabilization: compare a good solvent and a poor solvent, using ΔG = ΔH − TΔS.",a:`<ul><li><b>Good solvent</b>: polymer–solvent contacts are favourable, so the chains <b>expand</b> into the solvent. When two layers overlap, polymer–solvent contacts are replaced by polymer–polymer contacts (ΔH &gt; 0) and chain freedom is lost (ΔS &lt; 0), so <b>ΔG &gt; 0 and the particles repel</b>. Good stabilization.</li><li><b>Poor solvent</b>: polymer–polymer contacts are preferred, so the chains <b>coil up or collapse</b> on the surface. Overlap can give ΔH &lt; 0, so ΔG may become negative and the particles <b>attract</b>, leading to flocculation.</li></ul><p class="why">Coverage also matters: high coverage of anchored chains gives strong repulsion, while low coverage can let one chain bridge two particles (bridging flocculation).</p>`},
{q:"Anchored vs adsorbed polymers in steric stabilization?",a:`<ul><li><b>Anchored</b> (terminally grafted or chemisorbed at one end): strong and <b>irreversible</b>; chains stick out like brushes.</li><li><b>Adsorbed</b>: weak and <b>reversible</b> binding, but at many points along the chain (loops and trains); can desorb.</li></ul>Macromolecules that are not attached at all can also stabilize (depletion stabilization).`},
{q:"What is electrosteric stabilization? Give the two variants.",a:`A combination of electrostatic and steric stabilization:<ul><li><b>Charged particles with uncharged polymers</b> (a double layer plus a steric layer)</li><li><b>Uncharged particles with charged polymers</b> (polyelectrolytes, which give both charge and steric hindrance)</li></ul><p class="why">It is more robust than either alone: the steric part protects against salt and high concentrations, and the electrostatic part adds long-range repulsion.</p>`}
]});

DECKS.push({id:"nucl", name:"Nucleation & metal nanoparticles", lec:"L4–L5 · CW 3.1–3.3", cards:[
{x:1,q:"What is the difference between homogeneous and heterogeneous nucleation?",a:`<ul><li><b>Homogeneous</b>: a new phase nucleates <b>without any interface</b> (in the bulk of the medium). It needs a <b>high</b> degree of supersaturation, because the full surface energy of the nucleus must be paid.</li><li><b>Heterogeneous</b>: nucleation on an existing <b>interface</b> (foreign particle, seed, substrate, container wall). It needs <b>lower</b> supersaturation, because the interface replaces part of the costly nucleus surface. Most common in nature.</li></ul><p class="why">The fundamentals are the same in gases, liquids and solids. The barrier ratio is ΔG*<sub>het</sub> = f(θ)·ΔG*<sub>hom</sub>, with f(θ) ≤ 1.</p>`},
{q:"What is supersaturation, and why does it drive nucleation? Give ΔG<sub>v</sub>.",a:`<b>Supersaturation</b>: the solute concentration C exceeds the equilibrium solubility C₀. The solution has a high Gibbs free energy, which is lowered by precipitating a solid phase.<br>Change in Gibbs energy per unit volume of solid formed:<br><b>ΔG<sub>v</sub> = −(kT/Ω) ln(C/C₀) = −(kT/Ω) ln(1 + σ)</b>, where σ = (C − C₀)/C₀<p class="why">ΔG<sub>v</sub> is negative only when C &gt; C₀, and it becomes more negative with higher supersaturation. Ω is the atomic volume. (Note the error in Cao & Wang eq. 3.1.)</p>`},
{x:1,q:"If the Gibbs free energy is lowered, why doesn't nucleation always happen spontaneously in a supersaturated solution?",a:`Because of the <b>surface energy</b> of the new nucleus. For a spherical nucleus of radius r:<br><b>ΔG(r) = (4/3)πr³·ΔG<sub>v</sub> + 4πr²·γ</b><p class="why">The volume term (negative, ∝ r³) favours the solid. The surface term (positive, ∝ r²) dominates at small r. So ΔG first increases with r, goes through a maximum ΔG* at the critical radius r*, and only then decreases. Small clusters are unstable and dissolve; the system must overcome the <b>energy barrier</b> ΔG* by fluctuations, which is why a minimum supersaturation is needed.</p>`},
{q:"Derive the critical radius r* and the energy barrier ΔG*. What happens to nuclei smaller or larger than r*?",a:`Set dΔG/dr = 0 for ΔG(r) = (4/3)πr³ΔG<sub>v</sub> + 4πr²γ:<br>4πr²ΔG<sub>v</sub> + 8πrγ = 0 → <b>r* = −2γ/ΔG<sub>v</sub></b><br>Insert back: <b>ΔG* = 16πγ³ / (3ΔG<sub>v</sub>²)</b><ul><li>r &lt; r*: adding atoms raises G, so the cluster <b>dissolves</b></li><li>r &gt; r*: adding atoms lowers G, so it is a <b>stable nucleus and grows</b></li></ul><p class="why">Since ΔG<sub>v</sub> is negative, r* is positive. (Note the error in Cao & Wang eq. 3.6.)</p>`},
{q:"How can you reduce r* and ΔG* to get small nanoparticles from a supersaturated medium?",a:`From r* = −2γ/ΔG<sub>v</sub> and ΔG* = 16πγ³/(3ΔG<sub>v</sub>²):<ol><li><b>Reduce γ</b>: solvent choice, surfactants or capping agents; lower temperature also tends to reduce γ</li><li>Make <b>ΔG<sub>v</sub> more negative</b> by increasing the supersaturation σ, since ΔG<sub>v</sub> = −(kT/Ω)ln(1+σ)</li></ol><p class="why">A smaller r* means smaller stable nuclei. A lower ΔG* means a higher nucleation rate, so many nuclei form and the material is shared among many small particles.</p>`},
{x:1,q:"Explain regions I, II and III in the LaMer diagram (concentration vs time). How do you get a narrow size distribution?",a:`The solute concentration is plotted against time, with lines for the equilibrium solubility C₀ and the minimum concentration for homogeneous nucleation (set by the energy barrier).<ul><li><b>Region I</b>: concentration rises above C₀ but below the nucleation threshold. Supersaturated, but <b>no nucleation</b>.</li><li><b>Region II</b>: the threshold is exceeded, so <b>burst nucleation</b>. Nucleation and growth consume solute, and the concentration falls.</li><li><b>Region III</b>: concentration is back below the threshold but above C₀. <b>Only growth</b> of existing nuclei, until equilibrium.</li></ul>For a <b>narrow size distribution</b>, make region II <b>as short as possible</b>, so all nuclei form at nearly the same time and then grow together for the same time.`},
{x:1,q:"How can you control particle size and size distribution through homogeneous nucleation?",a:`<ul><li><b>Supersaturation</b> is controlled by concentration and temperature, and it sets the nucleation rate.</li><li><b>Time spent in the nucleation regime</b> (LaMer region II) controls the <b>size distribution</b>: short burst, narrow distribution.</li><li><b>Time allowed for growth</b> afterwards (region III) controls the <b>final size</b>. It can be stopped by quenching or capping agents.</li></ul><p class="why">Heterogeneous nucleation on impurities or walls complicates this, because it creates nuclei at other times.</p>`},
{x:1,q:"What determines the nucleation rate and the growth rate in solution?",a:`<ul><li><b>Nucleation rate</b>: the <b>degree of supersaturation</b> and the <b>temperature</b>. The rate depends on exp(−ΔG*/kT), and ΔG* ∝ γ³/ΔG<sub>v</sub>², so it is extremely sensitive to supersaturation.</li><li><b>Growth rate</b>: <b>concentration</b> (supply of growth species) and <b>temperature</b> (diffusion, surface reaction rates).</li></ul>`},
{x:1,q:"Name ways to stop nanoparticle growth abruptly.",a:`<ul><li><b>Add a capping agent</b> (surfactant, polymer, thiol) that binds to the surface and blocks the growth sites</li><li><b>Quench</b>: rapid cooling stops the kinetics (diffusion and reaction)</li><li><b>Rapid dilution</b> with solvent lowers the concentration (less abrupt)</li></ul>`},
{x:1,q:"Why can the size distribution of a nanoparticle batch be important?",a:`Many properties are size-dependent: band gap and colour (quantum dots), plasmon resonance, magnetic behaviour (single-domain vs superparamagnetic), melting point, catalytic activity. A broad size distribution gives a <b>distribution of properties</b> instead of the same property for every particle, e.g. broad emission peaks or mixed magnetic behaviour.`},
{x:1,q:"What is the general method for colloidal synthesis of metallic nanoparticles? Which chemical roles are needed?",a:`<b>Reduction of metal complexes in dilute solution.</b><ul><li><b>Metal precursor</b>: a salt or metal-organic compound (HAuCl₄, PdCl₂, AgNO₃, H₂PtCl₆)</li><li><b>Solvent</b>: often water, very dilute</li><li><b>Reducing agent</b>: sodium citrate, NaBH₄, H₂, ethylene glycol, ascorbic acid</li><li><b>Capping agent / polymer stabilizer</b>: PVP, PVA, PEG, citrate. It stabilizes against agglomeration and limits growth.</li></ul>Usually done with heating and stirring, often under a controlled atmosphere (e.g. a Schlenk line).`},
{q:"How are monosized metallic nanoparticles achieved in most colloidal syntheses, and why does this work?",a:`A combination of a <b>low solute concentration</b> and a <b>polymeric monolayer</b> on the growth surface. Both hinder the diffusion of growth species to the particle, so growth becomes <b>diffusion-limited</b>.<p class="why">In diffusion-limited growth, dr/dt ∝ 1/r: small particles grow faster than large ones (in radius), so they catch up and the size distribution narrows over time. In surface-reaction-limited growth, all particles grow at the same rate and the relative spread stays.</p>`},
{q:"Outline the classic citrate synthesis of Au nanoparticles (Turkevich), with the role of each chemical.",a:`<ol><li>Dissolve <b>HAuCl₄</b> (chloroauric acid, Au precursor) in about 20 mL water, giving a very dilute solution of about 2.5·10⁻⁴ M.</li><li>Bring to a boil and add 1 mL of 0.5 % <b>sodium citrate</b>. Citrate is the <b>reducing agent</b> (Au³⁺ → Au⁰) and also adsorbs on the particles as an electrostatic stabilizer.</li><li>Keep at 100 °C until the colour changes (to wine red). Keep the volume constant by adding water.</li></ol>The result is a very stable sol of uniform particles, about 20 nm.<p class="why">The red colour comes from the plasmon resonance near 520 nm.</p>`},
{q:"Outline the Pd nanoparticle synthesis from PdCl₂ shown in the lecture.",a:`Dilute aqueous PdCl₂ with <b>polyvinyl alcohol (PVA)</b> as polymer stabilizer.<ol><li><b>Hydrolysis</b> with sodium carbonate: PdCl₂ + 2OH⁻ → Pd(OH)₂ + 2Cl⁻</li><li><b>Reduction</b> with hydrogen gas: Pd(OH)₂ + H₂ → Pd + 2H₂O</li></ol><p class="why">Silver example: aqueous AgClO₄ reduced by NaBH₄.</p>`},
{x:1,q:"How does the strength of the reducing agent affect nanoparticle size?",a:`<ul><li><b>Strong</b> reducing agent (e.g. NaBH₄): fast reduction, so the supersaturation of metal atoms builds up very quickly. That gives a burst of many nuclei at once, and the metal is shared among many particles: <b>smaller</b> particles.</li><li><b>Weak</b> reducing agent (e.g. citrate): slow reduction, fewer nuclei, which then grow: <b>larger</b> particles.</li></ul><p class="why">The type, concentration and pH of the reducing agent all affect size, size distribution and morphology.</p>`},
{q:"Sodium citrate vs citric acid as reducing agent: what morphology does each give?",a:`<ul><li><b>Sodium citrate</b>: <b>spherical</b> particles</li><li><b>Citric acid</b>: <b>faceted</b> particles, e.g. trigons or very thin trigonal platelets with {111} facets</li></ul><p class="why">The reducing agent and its by-products can adsorb on certain facets and change their relative growth rates, so it also acts as a shape-directing agent.</p>`},
{x:1,q:"What three functions can polymers have during nanoparticle synthesis?",a:`<ol><li><b>Stabilization agents</b>: form a monolayer on the surface and prevent agglomeration (steric stabilization).</li><li><b>Growth-limiting agents</b>: block the diffusion of growth species to the surface. This requires <b>full coverage</b>.</li><li><b>Growth-directing agents</b>: bind more strongly to some facets than others, so those facets grow more slowly and the shape changes (rods, cubes, plates). The effect depends on the surface chemistry, the solvent and the temperature.</li></ol><p class="why">Example: colloidal Pt with sodium polyacrylate gives different shapes at polymer:Pt ratios of 5:1 and 1:1.</p>`},
{q:"Electrochemical synthesis of metal nanoparticles (Pd, Ni, Co): how does it work, and how is size controlled?",a:`<ol><li>Apply an electric field (current) between electrodes.</li><li>The <b>metal anode dissolves</b> (M → Mⁿ⁺ + ne⁻).</li><li>Metal ions migrate through the electrolyte to the cathode and are <b>reduced</b> to metal atoms, which nucleate as particles.</li><li>Particles are <b>stabilized by additives</b> in the electrolyte (e.g. tetraalkylammonium salts).</li></ol><b>Higher current density gives smaller nanoparticles</b> (faster supply of atoms, higher supersaturation, more nuclei).`},
{x:1,q:"What measures favour homogeneous nucleation and suppress heterogeneous nucleation in a synthesis?",a:`<ul><li><b>Clean, flaw-free glassware</b> (scratches and dirt are nucleation sites)</li><li><b>High-purity chemicals</b>, filtered solutions (no dust or seed particles)</li><li><b>Rapid increase in concentration</b> (fast addition, hot injection) so the critical supersaturation for homogeneous nucleation is passed quickly, before heterogeneous nucleation has time to take over</li></ul>`},
{x:1,q:"Write Young's equation for a nucleus on a substrate and explain the terms.",a:`<b>γ<sub>sv</sub> = γ<sub>fs</sub> + γ<sub>vf</sub> cos θ</b><ul><li>γ<sub>sv</sub>: substrate–vapour (or substrate–medium) surface energy</li><li>γ<sub>fs</sub>: nucleus (film)–substrate interface energy</li><li>γ<sub>vf</sub>: vapour–nucleus surface energy</li><li>θ: contact angle</li></ul><p class="why">It is a horizontal force balance at the edge of the nucleus. θ depends only on the surface properties of the three phases (bonding and polarity). A small θ means good wetting.</p>`},
{x:1,q:"What is wetting, and how does it affect the competition between heterogeneous and homogeneous nucleation?",a:`<b>Wetting</b> describes how well a phase spreads on a surface, measured by the contact angle θ from Young's equation. Good wetting (small θ) means the nucleus–substrate interface is cheap.<br><b>ΔG*<sub>het</sub> = f(θ)·ΔG*<sub>hom</sub></b>, with <b>f(θ) = (2 − 3cos θ + cos³θ)/4</b> ≤ 1<p class="why">Good wetting lowers the barrier for heterogeneous nucleation, so it happens at lower supersaturation and wins over homogeneous nucleation. Poor wetting makes the two more equal.</p>`},
{x:1,q:"Wetting factor f(θ): what happens at θ = 180°, 0 < θ < 180°, and θ = 0°?",a:`f(θ) = (2 − 3cos θ + cos³θ)/4<ul><li><b>θ = 180°</b> (no wetting): cos θ = −1, f = 1, so ΔG*<sub>het</sub> = ΔG*<sub>hom</sub>. Hetero and homo are <b>equally favoured</b>; the substrate doesn't help.</li><li><b>0 &lt; θ &lt; 180°</b> (partial wetting): f &lt; 1, so heterogeneous nucleation is favoured.</li><li><b>θ = 0°</b> (complete wetting): cos θ = 1, f = 0, so there is <b>no barrier</b> (the phase simply spreads as a layer).</li></ul>`},
{q:"Explain the stable, metastable and labile zones in a solubility–supersolubility diagram, and how to move from stable to labile.",a:`Concentration is plotted against temperature, with the solubility curve and the supersolubility curve:<ul><li><b>Stable</b> (below solubility, undersaturated): crystallization <b>impossible</b></li><li><b>Metastable</b> (between the curves): spontaneous crystallization <b>improbable</b>, but seeds can grow (heterogeneous nucleation and growth)</li><li><b>Labile</b> (above supersolubility): spontaneous (homogeneous) crystallization <b>probable</b></li></ul>To go from stable to labile: (1) <b>cool</b> at constant solvent content, (2) <b>evaporate</b> solvent at constant T, or (3) a combination.`},
{x:1,q:"Propose a synthesis of bimetallic A–B nanoparticles (core–shell or dumbbell) based on heterogeneous nucleation.",a:`<ol><li><b>Make seeds of metal A</b> by colloidal synthesis (precursor + reducing agent + capping agent). Purify by centrifugation and washing.</li><li>Disperse the seeds and add the <b>B precursor</b> with a <b>mild reducing agent</b> (and a capping agent).</li><li>Keep the B supersaturation <b>low</b> (in the metastable zone, controlled temperature and slow addition), so that B nucleates heterogeneously on A instead of forming separate B particles.</li></ol><p class="why">Example from the lecture: Fe₃O₄ seeds + silver acetate + oleylamine (reducing and stabilizing agent) in toluene give Fe–Ag particles, first by nucleation of Ag on the seeds, then growth. Either metal can be made first.</p>`},
{q:"Outline the synthesis of Fe nanoparticles by thermal decomposition from the lecture.",a:`<ul><li>Metallic precursor: <b>iron oleate</b></li><li>Reducing and stabilizing agent: <b>oleic acid</b></li><li>Reaction medium: <b>octadecene</b> (high-boiling solvent)</li></ul>The precursor decomposes at high temperature, giving a burst of nucleation followed by growth. The oleic acid caps the particles. Characterized by HRTEM.`},
{q:"What are the two categories of bottom-up nanoparticle synthesis?",a:`<ol><li><b>Thermodynamic equilibrium approach</b>: generate supersaturation, then nucleation, then growth. Size is controlled through the nucleation and growth kinetics (colloidal synthesis, sol-gel).</li><li><b>Kinetic approach</b>: limit the amount of precursor available or the space for growth, so particles can't grow beyond a certain size. Examples: microemulsions and reverse micelles, aerosol or spray pyrolysis, template-based deposition, growth termination by capping.</li></ol>`}
]});

DECKS.push({id:"solgel", name:"Sol-gel, micelles & kinetic control", lec:"L5–L6 · CW 3.2.4–3.6", cards:[
{q:"What is sol-gel processing, and what is it mostly used for?",a:`A wet-chemical route in which a colloidal solution (<b>sol</b>) is formed and then converted into a viscous, solid-like 3D network that extends through the liquid (<b>gel</b>), and finally into a solid material.<br>It proceeds by <b>hydrolysis and polycondensation</b> of precursors, typically metal alkoxides M(OR)<sub>n</sub> (or metal salts).<p class="why">Mostly used for <b>metal oxides</b> (SiO₂, TiO₂ …): powders, nanoparticles, thin films, fibres, monoliths, porous materials and hybrid organic–inorganic materials.</p>`},
{x:1,q:"Explain briefly: hydrolysis, oxolation, alkoxolation. Give the reactions.",a:`<ul><li><b>Hydrolysis</b>: water attacks the metal and an –OR group is replaced by –OH:<br>M–OR + H₂O → M–OH + ROH<br>(partial: only some OR groups replaced; complete: M(OH)<sub>n</sub>)</li><li><b>Oxolation</b>: condensation where the <b>leaving group is water</b>:<br>M–OH + HO–M → M–O–M + H₂O</li><li><b>Alkoxolation</b>: condensation where the <b>leaving group is an alcohol</b>:<br>M–OR + HO–M → M–O–M + ROH</li></ul><p class="why">Both condensation reactions build <b>metal–oxo bridges (M–O–M)</b>, which link the network into a gel. Hydrolysis and condensation overlap in time.</p>`},
{q:"List and explain the six steps of sol-gel processing.",a:`<ol><li><b>Sol</b>: a stable solution forms by hydrolysis and partial condensation of the precursor</li><li><b>Gel</b>: metal–oxo bonds link into a 3D network spanning the liquid</li><li><b>Aging</b>: condensation continues inside the gel, which shrinks and densifies while solvent is expelled (syneresis)</li><li><b>Drying</b>: water and other volatiles are removed from the network. Capillary forces can crack or collapse it.</li><li><b>Dehydration</b>: surface M–OH groups are removed by calcination at about 800 °C</li><li><b>Thermal treatment</b> (&gt; 800 °C): densification by sintering and grain growth into a dense oxide</li></ol>`},
{x:1,q:"Xerogel vs aerogel: how is each made, and what are they like?",a:`<ul><li><b>Xerogel</b>: solvent removed by ordinary <b>evaporation</b>. As the liquid leaves the pores, the receding meniscus exerts large capillary forces that pull the network together: <b>extreme shrinkage (&gt; 90 %)</b> and densification.</li><li><b>Aerogel</b>: solvent removed by <b>supercritical drying</b>. There is no liquid–gas interface and no capillary forces, so the gel keeps its open structure: <b>shrinkage &lt; 15 %</b>, extremely low density and high porosity.</li></ul>`},
{x:1,q:"What conditions are needed to make an aerogel, and why?",a:`<b>Supercritical drying</b>: take the solvent above its critical temperature and pressure, then release it as a gas.<p class="why">Above the critical point there is no distinction between liquid and gas, so there is no meniscus and <b>no surface tension</b>. Normal evaporation produces capillary pressure in the nanometre-sized pores (ΔP ∝ γ/r, very large for small r), which collapses and densifies the gel into a xerogel.</p>`},
{x:1,q:"Why can't you make metallic nanoparticles by a typical sol-gel route? What is sol-gel ideal for?",a:`Gel formation is built on <b>M–O–M (metal–oxo) bridges</b> from hydrolysis and condensation. The product is therefore always an <b>oxide</b> (or hydroxide), never a pure metal.<p class="why">Sol-gel is ideal for <b>metal oxides</b>, including multi-cation oxides (molecular-level mixing), and for hybrid organic–inorganic materials.</p>`},
{q:"Effect of pH on sol-gel: acid- vs base-catalysed.",a:`<ul><li><b>Acid-catalysed</b>: hydrolysis is fast and condensation is slower and happens preferentially at chain ends. This gives <b>linear or weakly branched polymer chains</b> and polymeric gels (good for films and fibres).</li><li><b>Base-catalysed</b>: condensation is fast and favours already-condensed, central sites. This gives <b>highly branched, compact clusters</b> and discrete <b>colloidal particles</b> (as in the Stöber process).</li></ul><p class="why">So pH is a lever to control morphology: polymer-like networks versus particles.</p>`},
{q:"Describe the Stöber process. What controls the particle size?",a:`Controlled synthesis of <b>monodisperse spherical SiO₂ particles</b> (50 nm–2 µm), Stöber 1968.<ol><li>Mix ethanol, water and <b>ammonium hydroxide</b> (base catalyst), e.g. in an ultrasonic bath at room temperature.</li><li>Add <b>TEOS</b> (tetraethyl orthosilicate, Si(OC₂H₅)₄), e.g. 0.28 M, and leave overnight.</li><li>TEOS hydrolyses (–OC₂H₅ replaced by –OH) and condenses into Si–O–Si (siloxane) bonds (oxolation and alkoxolation), forming particles.</li><li>Centrifuge and dry (e.g. 60 °C).</li></ol>Size depends on the precursor, solvent, and amounts of water and ammonia. <b>Higher NH₄OH concentration gives larger particles</b> (0.11 → 1.13 M increases the size).`},
{q:"List the advantages of sol-gel processing.",a:`<ul><li><b>Versatile</b>: good control of structure, porosity and particle size; nanoparticles and organic molecules can be incorporated</li><li><b>Extended composition range</b>: any oxide composition, some non-oxides, and hybrid organic–inorganic materials that don't exist naturally</li><li><b>Better homogeneity</b> through mixing at the molecular level; high purity</li><li><b>Less energy</b>: no need to reach the melting temperature</li><li><b>Many product forms</b>: coatings and thin films, monoliths, composites, porous membranes, powders, fibres</li><li><b>Inexpensive</b>: no special equipment needed</li></ul>`},
{q:"Vapour-phase nanoparticle synthesis: key principles.",a:`<ul><li>The same nucleation fundamentals as in liquids, with supersaturation in the vapour</li><li>Needs <b>elevated temperature</b> and often vacuum. Source: CVD, PVD (thermal evaporation), plasma-assisted sputtering</li><li>Particles nucleate homogeneously once sufficient supersaturation is reached, and are often deposited on a target substrate</li><li>Once nucleation starts, the supersaturation is relieved and growth follows</li><li><b>Rapid quenching</b> stops growth (remove the source or slow the kinetics)</li><li>Long deposition times: deposited particles migrate and agglomerate on the surface (spherical or needle-like shapes)</li></ul>`},
{x:1,q:"What does 'kinetically confined' synthesis mean? List the categories.",a:`Growth is <b>limited</b> by a <b>finite amount of precursor</b> or a <b>finite amount of space</b>, rather than by the nucleation and growth thermodynamics. The particle cannot grow beyond what its "box" allows.<ul><li><b>Liquid droplets in a liquid</b>: micelles, microemulsions</li><li><b>Liquid droplets in a gas</b>: aerosol synthesis, spray pyrolysis</li><li><b>Template-based</b> synthesis</li><li><b>Growth termination / self-terminating</b> synthesis: capping agents</li></ul>`},
{q:"Define surfactant, micelle, microemulsion and colloidal system.",a:`<ul><li><b>Surfactant</b>: a molecule with a <b>hydrophilic polar head</b> and a <b>hydrophobic hydrocarbon tail</b> (e.g. CTAB, cetyltrimethylammonium bromide; AOT; SDS). It spontaneously gathers at interfaces between polar and non-polar phases.</li><li><b>Micelle</b>: an aggregate of surfactant molecules dispersed in a liquid</li><li><b>Microemulsion</b>: a <b>thermodynamically stable</b> dispersion of two immiscible liquids (water and oil), stabilized by surfactant</li><li><b>Colloidal system</b>: a multiphase system in which at least one phase consists of particles smaller than 1 µm</li></ul>`},
{q:"What do surfactants lower? Name the four surfactant types.",a:`Surfactants lower:<ul><li>the surface tension of a liquid</li><li>the interfacial tension between two liquids</li><li>the interfacial tension between a liquid and a solid</li></ul>Types (by the charge of the head group): <b>nonionic, anionic, cationic, amphoteric</b> (zwitterionic). Tails can be single or multi-branched.`},
{x:1,q:"What is the critical micelle concentration (CMC)?",a:`The <b>minimum surfactant concentration at which micelles form</b> in the bulk solution.<p class="why">Below the CMC, added surfactant goes to the surface/interface. Once the interface is saturated and the solubility of single surfactant molecules in the bulk is exceeded, the extra molecules aggregate into micelles. Above the CMC, the surface tension stays roughly constant.</p>`},
{x:1,q:"Micelles vs reverse micelles: what's the difference, and which is normally used for nanoparticle synthesis? Why?",a:`<ul><li><b>Micelle</b> (oil-in-water): in a polar (aqueous) continuous phase. Hydrophobic tails point <b>inward</b> to an oily core, polar heads point outward into the water.</li><li><b>Reverse (inverse) micelle</b> (water-in-oil): in a non-polar continuous phase. Polar heads point <b>inward</b> around a tiny <b>water droplet</b>, tails point outward into the oil.</li></ul><b>Reverse micelles</b> are normally used.<p class="why">Metal salt precursors and reducing agents (e.g. NaBH₄) dissolve easily in water but not in oil. The water core is therefore a natural, size-limited <b>nanoreactor</b>.</p>`},
{x:1,q:"Is (reverse) micelle formation enthalpy- or entropy-driven? Does the CMC increase or decrease on heating?",a:`<b>Enthalpy-driven.</b> When surfactants assemble into ordered micelles, their configurational entropy <b>decreases</b> (ΔS &lt; 0), so ΔG = ΔH − TΔS &lt; 0 requires a favourable ΔH.<br>On heating, the −TΔS penalty grows, so micelle formation becomes less favourable and the <b>CMC increases</b>.`},
{q:"Which factors control the structures surfactants form (micelles, cylinders, lamellae, 'onions')?",a:`<ul><li><b>Surfactant shape</b>: the relative size of head and tail (single or branched tails) sets the preferred curvature</li><li><b>Water/oil phase ratio</b>: how much interface, and which phase is continuous</li><li><b>Surfactant concentration</b>: enough to cover the interface? Increasing above the CMC gives spheres → cylinders → lamellar phases → onion (multilayer) phases</li><li><b>Temperature and pressure</b>: e.g. gas bubbles compress or expand; surface tension depends on T</li></ul><p class="why">When micelle size and shape can be controlled, they can be used as templates for nanoporous materials (e.g. CTAB micelles to make pores in silica).</p>`},
{x:1,q:"How do reverse micelles act as nanoreactors?",a:`Reverse micelles in oil undergo <b>Brownian motion</b>. When two collide, they can briefly merge, <b>exchange their aqueous contents</b>, and then separate into two micelles again.<ul><li><b>Two microemulsions</b>: one with the metal precursor in the water cores, one with the reducing agent. Mix them, and collisions bring the reactants together inside confined droplets.</li><li><b>One microemulsion</b>: the precursor is in the water cores, and the reducing agent is added to the whole solution.</li></ul><p class="why">Nucleation and growth happen inside each droplet, and the limited water volume and precursor amount restrict the final particle size (kinetic confinement).</p>`},
{x:1,q:"Which chemicals are needed for metallic nanoparticle synthesis with reverse micelles? State the purpose of each.",a:`<ul><li><b>Metal precursor</b> (e.g. PdCl₂, H₂PtCl₆ + FeCl₂): the metal source</li><li><b>Reducing agent</b> (e.g. NaBH₄): reduces metal ions to metal</li><li><b>Water</b>: dissolves the precursor and reducing agent, and forms the micelle cores</li><li><b>Oil</b> (e.g. isooctane, n-heptane): the continuous matrix phase outside the micelles</li><li><b>Surfactant</b> (e.g. AOT), often with a <b>co-surfactant</b> (e.g. n-butanol): forms and stabilizes the reverse micelles</li></ul><p class="why">Examples: water/isooctane/AOT + PdCl₂ + NaBH₄ gives spherical or worm-like Pd nanocrystals. Water/n-heptane/AOT + n-butanol + H₂PtCl₆ + FeCl₂ + NaBH₄ gives PtFe nanocrystals.</p>`},
{x:1,q:"How can you control particle size in reverse-micelle synthesis?",a:`<ul><li>The <b>water-to-surfactant ratio w = [H₂O]/[surfactant]</b> (together with the water/oil/surfactant ratios) sets the micelle size: larger w gives larger water droplets and larger particles.</li><li>The <b>precursor concentration</b> in the water cores sets how much material each droplet can supply.</li></ul><p class="why">For w &lt; 10 the water is "bound" (hydrating the surfactant heads), and for w &gt; 10 it is "free" water.</p>`},
{x:1,q:"Propose a method for making large quantities of multi-cation oxide nanoparticles (e.g. for sintering ceramics). Justify it.",a:`<b>Spray pyrolysis.</b><ol><li>Dissolve all metal salts (e.g. nitrates) in a solvent (usually water) in the right ratio.</li><li>Atomize the solution through a nozzle into fine droplets.</li><li>A carrier gas takes them through a hot furnace, where the solvent evaporates and the salts decompose (pyrolysis) into oxide.</li><li>Collect the powder.</li></ol>Each droplet becomes one particle (kinetic confinement, droplets in gas).<p class="why">Why: it is a <b>continuous reactor</b>, so it scales well; mixing at the solution level gives <b>complex stoichiometries</b>; nozzle and furnace temperature set the size. A natural size distribution even helps dense packing for sintering. Sol-gel, co-precipitation or hydrothermal synthesis are partial-credit alternatives.</p>`},
{q:"Growth termination: explain the CdS example.",a:`Colloidal CdS from <b>cadmium acetate</b> + <b>anhydrous sodium sulfide</b> in methanol/water (only one phase).<br><b>Thiophenol</b> is the surface <b>capping agent</b>: it binds to the CdS surface and blocks further addition of growth species, so growth terminates.<br><b>Higher capping-agent concentration gives smaller particles</b>, because the surface is covered earlier in the growth.<p class="why">This is "self-terminating" kinetic control without micelles or templates.</p>`},
{x:1,q:"Discuss different approaches to controlling nanoparticle size and size distribution during synthesis.",a:`<ul><li><b>Thermodynamic (nucleation control)</b>: control supersaturation and temperature; a short burst of nucleation (narrow LaMer region II) for a narrow distribution, and growth time for size. Diffusion-limited growth narrows the distribution.</li><li><b>Kinetic confinement</b>: limit volume or precursor using reverse micelles, aerosol droplets or templates.</li><li><b>Temperature control</b>: quench to stop growth abruptly.</li><li><b>Capping agents</b>, polymers and surfactants: limit or terminate growth and stabilize the particles.</li></ul>`},
{q:"How did the lecture make magnetic nanoparticles in a silica matrix (hybrid core–shell composite)?",a:`<ol><li><b>Mixing</b>: Fe₂O₃ nanoparticles (about 10 nm), <b>CTAB</b> (surfactant), ethanol and water.</li><li><b>Sol-gel reaction</b>: add <b>TEOS</b> with ultrasound and shaking. Silica condenses around the CTAB micelles and the particles.</li><li><b>Hydrothermal treatment</b>: 120 °C for 48 h.</li><li><b>Calcination</b>: 400 °C for 8 h burns away the CTAB, leaving pores.</li></ol>The result is magnetic nanoparticles embedded in porous (mesoporous) silica: a combination of a micelle template and sol-gel chemistry.`}
]});

DECKS.push({id:"oned", name:"1D nanostructures", lec:"L7–L8 · CW 4", cards:[
{q:"Give approximate aspect ratios (L/d) for nanorods, nanotubes and nanowires.",a:`<ul><li><b>Rods</b>: L/d ≈ 3–10</li><li><b>Tubes</b>: L/d ≈ 10–20</li><li><b>Wires / fibres</b>: L/d &gt; 100</li></ul><p class="why">All are 1D nanostructures: two dimensions nanoscale, one long.</p>`},
{q:"List the main synthesis approaches for 1D nanostructures.",a:`<ul><li><b>Spontaneous growth</b> (bottom-up): evaporation–condensation (VS), dissolution–condensation, vapour–liquid–solid (VLS), solution–liquid–solid (SLS), stress-induced recrystallization (pressure + temperature on a solid)</li><li><b>Template-based synthesis</b> (bottom-up): electrochemical deposition, electrophoretic deposition, template filling</li><li><b>Electrospinning</b> (bottom-up)</li><li><b>Lithography</b> (top-down, considered a hybrid)</li></ul>`},
{q:"What drives spontaneous growth, and what is needed for 1D growth specifically?",a:`Spontaneous growth is driven by a <b>reduction of Gibbs free energy</b> (chemical potential), achieved by recrystallization or by a <b>decrease in supersaturation</b> (precipitation from a supersaturated vapour or solution).<br>For 1D structures, growth must be <b>anisotropic</b>: the crystal must grow much faster in one direction than in the others.<p class="why">Defects and impurities can strongly influence the final morphology.</p>`},
{x:1,q:"How can anisotropic (1D) growth be achieved?",a:`<ul><li><b>Anisotropic surface energy</b>: different facets grow at different rates (high-energy facets grow fastest and the slow, low-energy ones end up as the sides)</li><li><b>Crystal imperfections</b>, especially <b>screw dislocations</b>, which give a step that never disappears in one direction</li><li><b>Preferential accumulation or poisoning</b> of specific sites by impurities or capping agents (e.g. PVP or CTAB binding to the side facets)</li><li>A <b>catalyst</b> liquid droplet directing the growth (VLS)</li></ul>`},
{q:"List the six elementary steps of crystal growth from a vapour or solution. Which can be rate-limiting?",a:`<ol><li><b>Diffusion</b> of growth species from the medium to the growing surface</li><li><b>Adsorption</b> on the surface, in competition with desorption (can be rate-limiting)</li><li><b>Surface diffusion</b> of adsorbed species to a growth site (can be rate-limiting)</li><li><b>Irreversible incorporation</b> into the crystal (rate-limiting at low supersaturation)</li><li><b>Desorption of by-products</b> from the surface, freeing the sites</li><li><b>Diffusion of by-products away</b></li></ol><p class="why">The slowest step controls the growth rate and the morphology.</p>`},
{x:1,q:"Adsorption-limited vs surface-growth-limited growth: what's the difference, and what happens if you keep increasing the concentration?",a:`<ul><li><b>Adsorption/desorption-limited</b> (low concentration): growth rate depends on concentration. Species arrive slowly and have time to diffuse to and adsorb on <b>high-energy sites</b> (kinks, steps, dislocations). This gives uniform coverage and preferential, anisotropic growth, which is what you want for 1D structures.</li><li><b>Surface-growth-limited</b> (high concentration): the surface is saturated and the rate becomes concentration-independent. Species are forced to adsorb anywhere, not only on high-energy sites, giving <b>defects</b>, <b>secondary nucleation</b> and heterogeneous nucleation.</li></ul>If the concentration keeps increasing, you eventually cross the threshold for <b>homogeneous nucleation in the vapour or solution</b> and make <b>nanoparticles</b> instead of wires or films.`},
{x:1,q:"Why and how can a screw dislocation give rise to 1D growth?",a:`An adatom is most stable where it forms the <b>most bonds</b>: kink sites (3 bonds) &gt; step sites (2) &gt; flat terraces (1). Growth on a perfect flat facet needs 2D nucleation of a new layer, which has its own barrier.<br>A <b>screw dislocation</b> that comes out at the surface creates a <b>step that never disappears</b>. As atoms are added, the step simply rotates around the dislocation core in a spiral. So growth continues without the need for new nucleation, and the crystal grows fast along the dislocation line, giving a wire or whisker.`},
